<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GP3 Live</title>
<style>
body { background: #0a0a0f; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
.header { text-align: center; margin-bottom: 30px; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 30px; }
.kpi { background: #1a1a24; padding: 20px; border-radius: 8px; text-align: center; }
.kpi-value { font-size: 32px; font-weight: bold; color: #E8001D; }
.kpi-label { font-size: 12px; color: #888; margin-top: 10px; }
.section { margin-bottom: 30px; }
.section-title { font-size: 14px; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 10px; }
.table { width: 100%; border-collapse: collapse; }
.table th { background: #111; padding: 10px; text-align: left; font-size: 12px; }
.table td { padding: 10px; border-bottom: 1px solid #222; }
.no-data { text-align: center; padding: 40px; color: #666; }
</style>
</head>
<body>
<div class="header">
  <h1>GP3 Live Dashboard</h1>
  <p id="date"></p>
</div>

<div class="kpis">
  <div class="kpi">
    <div class="kpi-value" id="clients">0</div>
    <div class="kpi-label">Clientes</div>
  </div>
  <div class="kpi">
    <div class="kpi-value" id="units">0</div>
    <div class="kpi-label">Unidades</div>
  </div>
  <div class="kpi">
    <div class="kpi-value" id="usd">0</div>
    <div class="kpi-label">Total USD</div>
  </div>
  <div class="kpi">
    <div class="kpi-value" id="ars">0</div>
    <div class="kpi-label">Total ARS</div>
  </div>
</div>

<div class="section">
  <div class="section-title">Últimas Ventas</div>
  <div id="ventas">
    <div class="no-data">Cargando...</div>
  </div>
</div>

<script>
const SHEETS_URL = "https://script.google.com/macros/s/AKfycbxh0cN7SV9tZtR0bgvZH6ysGzxQgApFiKn7O4C9mN7HUV8h3hWpLbq2fqYbw5XV1Jk3/exec";

document.getElementById('date').textContent = new Date().toISOString().split('T')[0];

async function loadData() {
  try {
    const response = await fetch(SHEETS_URL);
    const data = await response.json();
    
    if (!data.ventas || data.ventas.length === 0) {
      document.getElementById('ventas').innerHTML = '<div class="no-data">Sin ventas registradas</div>';
      return;
    }

    const ventas = data.ventas;
    const totalClientes = ventas.length;
    const totalUnidades = ventas.reduce((s, v) => s + (v.total_unidades || 0), 0);
    const totalUSD = ventas.filter(v => v.moneda === 'USD').reduce((s, v) => s + v.total_monto, 0);
    const totalARS = ventas.filter(v => v.moneda === 'ARS').reduce((s, v) => s + v.total_monto, 0);

    document.getElementById('clients').textContent = totalClientes;
    document.getElementById('units').textContent = totalUnidades;
    document.getElementById('usd').textContent = totalUSD.toLocaleString();
    document.getElementById('ars').textContent = totalARS.toLocaleString();

    let html = '<table class="table"><thead><tr><th>Piloto</th><th>Categoría</th><th>Unidades</th><th>Total</th></tr></thead><tbody>';
    ventas.forEach(v => {
      html += `<tr><td>#${v.num_piloto} ${v.piloto}</td><td>${v.categoria}</td><td>${v.total_unidades}</td><td>${v.moneda} ${v.total_monto.toLocaleString()}</td></tr>`;
    });
    html += '</tbody></table>';
    document.getElementById('ventas').innerHTML = html;
  } catch (e) {
    console.error('Error:', e);
  }
}

loadData();
setInterval(loadData, 5000);
</script>
</body>
</html>
