<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Invitación VIP · Gran Premio Mobil</title>
<meta name="theme-color" content="#001450">
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700;800&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#001450;--blue:#0C479D;--red:#FE000C;--ink:#16161d;--muted:#33415C;--soft-muted:#5A6B8C;--line:#E6E9F2;--soft:#F5F7FB;
--r-ctl:12px;--r-card:16px}
html,body{min-height:100%}
body{background:#EDF0F6;font-family:'Barlow',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-size:16px}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;box-shadow:0 0 60px rgba(0,20,80,.08);padding-bottom:40px}
/* HERO NAVY */
.hero{background:linear-gradient(160deg,#001c66 0%,var(--navy) 55%,#000e38 100%);padding:calc(env(safe-area-inset-top) + 30px) 20px 26px;text-align:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -20% -60% -20%;height:90%;background:radial-gradient(60% 100% at 50% 100%, rgba(12,71,157,.35), transparent 70%);pointer-events:none}
.hero .mobil{height:50px;display:block;margin:0 auto;position:relative;z-index:1}
.hero .rule{height:3px;width:64px;background:var(--red);margin:20px auto 0;border-radius:2px;position:relative;z-index:1}
.body{padding:24px 20px 0}
.eyebrow{text-align:center;color:var(--blue);font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;letter-spacing:6px}
.evento{text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:800;line-height:1.05;letter-spacing:.5px;text-transform:uppercase;margin-top:8px;color:var(--navy);text-wrap:balance}
.lugar{text-align:center;font-size:13.5px;color:var(--blue);letter-spacing:2.5px;text-transform:uppercase;margin-top:10px;font-weight:700}
.invite{text-align:center;font-size:15px;color:#41465a;line-height:1.65;margin:16px 6px 24px}
.invite b{color:var(--navy)}
.incluye{background:var(--soft);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 16px;margin:0 0 24px;text-align:center}
.incluye .t{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--blue);font-weight:700}
.incluye .s{font-size:14px;color:#41465a;margin-top:6px}
.incluye .s b{color:var(--navy)}
/* FORM */
label.lbl{display:block;font-size:12px;color:var(--muted);letter-spacing:1.2px;margin:20px 2px 6px;font-weight:700;text-transform:uppercase;font-family:'Barlow',sans-serif}
.lbl .hint{text-transform:none;letter-spacing:0;font-weight:600;color:var(--soft-muted)}
.req{color:var(--red)}
.inp{width:100%;background:var(--soft);border:1.5px solid var(--line);border-radius:var(--r-ctl);padding:14px;color:var(--ink);font-size:16px;outline:none;font-family:'Barlow',sans-serif;transition:border .15s,background .15s}
.inp:focus{border-color:var(--blue);background:#fff}
.inp.inp-error{border-color:var(--red);background:#FFF6F6}
.helper{font-size:12.5px;color:var(--soft-muted);margin:6px 2px 0;line-height:1.5}
.chips{display:flex;gap:8px;margin-top:6px}
button.chip{flex:1;text-align:center;padding:14px 4px;border-radius:var(--r-ctl);font-weight:800;font-size:15px;border:1.5px solid var(--line);color:var(--muted);background:var(--soft);cursor:pointer;user-select:none;font-family:'Barlow Condensed',sans-serif;letter-spacing:.5px;text-transform:uppercase;transition:all .15s;min-height:48px}
button.chip small{display:block;font-size:10px;letter-spacing:1.5px;color:#6B7490;font-weight:700;margin-top:2px}
button.chip .ck{display:none;margin-right:5px}
button.chip.on{border-color:var(--navy);background:var(--navy);color:#fff}
button.chip.on small{color:#9FC9E8}
button.chip.on .ck{display:inline}
button.chip:disabled{opacity:.4;cursor:not-allowed}
/* AUTO */
.auto{background:linear-gradient(135deg,#F0F4FC,#E8EEFA);border:1.5px solid #D8E2F5;border-radius:var(--r-card);padding:16px;margin-top:24px}
.auto .t{display:flex;align-items:center;gap:10px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:17px;color:var(--navy);text-transform:uppercase;letter-spacing:.5px}
.auto .t .opt{font-size:10px;letter-spacing:1.5px;background:#fff;border:1px solid #D8E2F5;color:var(--soft-muted);border-radius:6px;padding:3px 7px;margin-left:auto}
.auto .s{font-size:13.5px;color:#41465a;line-height:1.6;margin:8px 2px 12px}
.auto .s b{color:var(--navy)}
.auto .chips button.chip{background:#fff}
.auto .chips button.chip.on{background:var(--navy);border-color:var(--navy)}
.auto .no{display:block;margin:10px auto 0;background:none;border:none;font-family:'Barlow',sans-serif;font-size:13px;color:var(--soft-muted);text-decoration:underline;cursor:pointer;padding:8px}
.auto .no.on{color:var(--navy);font-weight:700}
.btn{margin-top:24px;width:100%;background:var(--red);color:#fff;border:none;border-radius:var(--r-ctl);padding:16px;font-size:19px;font-weight:800;letter-spacing:1.5px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;box-shadow:0 2px 8px rgba(0,20,80,.18);transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.err{display:none;background:#FFF0F0;border:1px solid #FFC9CC;color:#C40010;font-size:13.5px;text-align:center;padding:11px;border-radius:var(--r-ctl);margin-top:12px;font-weight:600;line-height:1.5}
.privacy{text-align:center;font-size:12px;color:var(--soft-muted);margin-top:14px;line-height:1.5}
/* WALLET / QR NOTE */
.wallet{display:flex;align-items:center;gap:13px;background:var(--soft);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 15px;margin-top:20px}
.wallet .ico{flex-shrink:0;display:flex}
.wallet .tx{font-size:13.5px;color:#41465a;line-height:1.55}
.wallet .tx b{color:var(--navy)}
/* FOOTER */
.foot{text-align:center;margin:32px 20px 0;border-top:1px solid var(--line);padding-top:20px}
.foot .logos{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:12px}
.foot .logos img{height:22px;object-fit:contain;filter:grayscale(1);opacity:.65}
.foot .tx{font-size:11px;color:var(--soft-muted);letter-spacing:1.5px;text-transform:uppercase;line-height:1.8}
/* ESTADOS */
.center{text-align:center;padding:56px 20px}
.center h2{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--navy)}
.center p{color:#41465a;font-size:14.5px;line-height:1.65;margin-top:8px}
.center .icn{margin:0 auto 14px;display:flex;justify-content:center}
.loadwrap{text-align:center;padding:70px 0}
.spin{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;margin:0 auto 14px;animation:rot .8s linear infinite}
.loadwrap .t{font-size:13.5px;color:var(--soft-muted)}
@keyframes rot{to{transform:rotate(360deg)}}
/* ÉXITO */
.ok-steps{margin-top:22px;text-align:left}
.step{display:flex;gap:13px;background:var(--soft);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 15px;margin-bottom:10px}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Barlow Condensed',sans-serif}
.step .t{font-size:14px;color:#41465a;line-height:1.6}
.step .t b{color:var(--navy)}
.rescue{background:#FFF9EF;border:1px solid #F2E2C4;border-radius:var(--r-card);padding:13px 15px;margin-top:14px;font-size:13.5px;color:#6b5a35;line-height:1.6;text-align:left}
.rescue b{color:#4d3f20}
.cal{margin-top:16px;width:100%;background:#fff;color:var(--navy);border:1.5px solid var(--navy);border-radius:var(--r-ctl);padding:14px;font-size:15px;font-weight:800;letter-spacing:1px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase}
.hidden{display:none}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:up .35s ease}
</style>
</head>

  car: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#001450" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14l1.5-4.5A2 2 0 0 1 6.4 8h11.2a2 2 0 0 1 1.9 1.5L21 14"/><path d="M3 14h18v4a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H6v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><circle cx="7" cy="15.8" r=".9" fill="#FE000C" stroke="none"/><circle cx="17" cy="15.8" r=".9" fill="#FE000C" stroke="none"/></svg>',

  ticket: '<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#001450" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9V7a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v2a2.2 2.2 0 0 0 0 6v2a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-2a2.2 2.2 0 0 0 0-6z"/><path d="M14 6v2M14 11v2M14 16v2" stroke="#FE000C" stroke-dasharray="2 2.6"/></svg>',
  sad: '<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#001450" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M9.5 15.5a4 4 0 0 1 5 0" /></svg>',
  clock: '<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#001450" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke="#FE000C"/></svg>'
};

function esc(s){ return (""+(s==null?"":s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function mensaje(icon, titulo, html){
  content.innerHTML = '<div class="center anim"><div class="icn">'+(ICONS[icon]||'')+'</div><h2>'+esc(titulo)+'</h2><p>'+html+'</p></div>';
}

async function cargar(){
  try{
    const r = await fetch(SHEETS_URL+"?tipo=vip_sponsors&t="+Date.now());
    const j = await r.json();
    const sp = (j.sponsors||[]).find(s=>(""+s.id).toLowerCase()===SPONSOR_ID);
    if(!sp){ mensaje('sad','No disponible','Esta invitación no está disponible. Pide un link nuevo a la organización.'); return; }
    if(!sp.activo){ mensaje('clock','Registro cerrado','Las invitaciones de '+esc(sp.nombre)+' no están abiertas en este momento.'); return; }
    SP = sp;
    render();
  }catch(e){
    mensaje('sad','Sin conexión','No pudimos cargar la invitación. Intenta de nuevo en un momento.');
  }
}

function chipDia(d,i,on,extraCls){
  const parts = (''+d).trim().split(/\s+/);
  const top = parts.slice(0,2).join(' ');
  const rest = parts.slice(2).join(' ');
  return '<button type="button" class="chip '+(extraCls||'')+(on?' on':'')+'" data-i="'+i+'" aria-pressed="'+(on?'true':'false')+'"><span class="ck">✓</span>'+esc(top)+(rest?'<small>'+esc(rest)+'</small>':'')+'</button>';
}

function render(){
  const dias = (SP.dias||[]).slice(0,3);
  const chipsHTML = dias.length ? dias.map((d,i)=>chipDia(d,i,SEL[i])).join('')
    : '<div style="color:#6B7490;font-size:13.5px">Sin días configurados.</div>';

  // Vuelta en auto: solo los dos primeros días (viernes y sábado)
  const autoDias = dias.slice(0,2);
  const autoHTML = autoDias.length ?
    '<div class="auto">'+
      '<div class="t">'+ICONS.car+' Vuelta en auto de carrera <span class="opt">OPCIONAL</span></div>'+
      '<div class="s">Mobil te invita a dar una vuelta al circuito en un <b>auto de carrera</b>. Solo <b>viernes y sábado</b>, cupos limitados por orden de registro. ¿Te animas?</div>'+
      '<div class="chips" id="autoDays" role="radiogroup" aria-label="Día de la vuelta en auto">'+
        autoDias.map((d,i)=>'<button type="button" class="chip auto-chip" role="radio" aria-checked="false" data-a="'+esc(d)+'" data-i="'+i+'" disabled><span class="ck">✓</span>'+esc((''+d).trim().split(/\s+/).slice(0,2).join(' '))+'</button>').join('')+
      '</div>'+
      '<div class="helper" id="autoHint">Marca primero arriba el día que asistes.</div>'+
      '<button type="button" class="no on" id="autoNo">Esta vez no</button>'+
    '</div>' : '';

  content.innerHTML =
    '<div class="anim">'+
    '<div class="eyebrow">INVITACIÓN VIP</div>'+
    '<h1 class="evento">'+esc(SP.evento||'Gran Premio Mobil')+'</h1>'+
    (SP.lugar?'<div class="lugar">'+esc(SP.lugar)+'</div>':'')+
    '<div class="invite"><b>Mobil</b> te invita a vivir la carrera desde la <b>zona VIP</b>. Completa tus datos y tu acceso con código QR llega a tu correo.</div>'+
    '<div class="incluye"><div class="t">Tu día VIP incluye</div><div class="s">🎟️ <b>Acceso liberado</b> a toda la zona VIP durante tu jornada.</div></div>'+
    '<form id="frm" novalidate>'+
    '<label class="lbl" for="f_nombre">Nombre completo <span class="req">*</span></label>'+
    '<input class="inp" id="f_nombre" placeholder="Nombre y apellido" autocomplete="name" autocapitalize="words">'+
    '<label class="lbl" for="f_email">Email <span class="req">*</span></label>'+
    '<input class="inp" id="f_email" type="email" placeholder="tucorreo@email.com" autocomplete="email" inputmode="email">'+
    '<div class="helper">A este correo llega tu acceso — revísalo bien antes de enviar.</div>'+
    '<label class="lbl" for="f_tel">Teléfono / WhatsApp <span class="req">*</span></label>'+
    '<input class="inp" id="f_tel" placeholder="Tu teléfono" autocomplete="tel" inputmode="tel">'+
    '<div class="helper">Por si no te llega el correo, te contactamos por acá.</div>'+
    '<label class="lbl" for="f_dni">DNI</label>'+
    '<input class="inp" id="f_dni" placeholder="Tu documento" inputmode="numeric" enterkeyhint="send">'+
    '<div class="helper">Solo para tu acreditación en el acceso al autódromo.</div>'+
    '<label class="lbl">¿Qué días asistes? <span class="req">*</span> <span class="hint">(puedes elegir varios)</span></label>'+
    '<div class="chips" id="days">'+chipsHTML+'</div>'+
    autoHTML+
    '<div class="err" id="err" role="alert"></div>'+
    '<button class="btn" id="send" type="submit">Confirmar mi lugar VIP</button>'+
    '</form>'+
    '<div class="privacy">Tus datos se usan únicamente para gestionar tu acceso a este evento.</div>'+
    '<div class="wallet"><div class="ico">'+ICONS.qr+'</div><div class="tx">Tu acceso llega por email con <b>código QR</b>. Guárdalo en tu celular y muéstralo en la entrada.</div></div>'+
    '</div>';

  const syncAuto = ()=>{
    document.querySelectorAll('.auto-chip').forEach(el=>{
      const i=+el.dataset.i;
      el.disabled = !SEL[i];
      if(!SEL[i] && AUTO===el.dataset.a){ AUTO=""; el.classList.remove('on'); el.setAttribute('aria-checked','false'); document.getElementById('autoNo').classList.add('on'); }
    });
    const anyEnabled = [0,1].some(i=>SEL[i]);
    const hint=document.getElementById('autoHint');
    if(hint) hint.style.display = anyEnabled ? 'none' : 'block';
  };

  document.querySelectorAll('#days .chip').forEach(el=>{
    el.onclick=()=>{ const i=+el.dataset.i; SEL[i]=!SEL[i]; el.classList.toggle('on',SEL[i]); el.setAttribute('aria-pressed',SEL[i]?'true':'false'); syncAuto(); };
  });
  document.querySelectorAll('.auto-chip').forEach(el=>{
    el.onclick=()=>{
      document.querySelectorAll('.auto-chip').forEach(x=>{x.classList.remove('on');x.setAttribute('aria-checked','false');});
      el.classList.add('on'); el.setAttribute('aria-checked','true');
      document.getElementById('autoNo').classList.remove('on');
      AUTO = el.dataset.a || "";
    };
  });
  const noBtn=document.getElementById('autoNo');
  if(noBtn) noBtn.onclick=()=>{
    AUTO="";
    document.querySelectorAll('.auto-chip').forEach(x=>{x.classList.remove('on');x.setAttribute('aria-checked','false');});
    noBtn.classList.add('on');
  };
  document.getElementById('frm').onsubmit = (e)=>{ e.preventDefault(); enviar(); };
  syncAuto();
}

function marcarError(input, msg){
  const err=document.getElementById('err');
  err.textContent=msg; err.style.display='block';
  if(input){ input.classList.add('inp-error'); input.scrollIntoView({block:'center',behavior:'smooth'}); input.focus({preventScroll:true}); }
}

async function enviar(){
  const nEl=document.getElementById('f_nombre'), eEl=document.getElementById('f_email');
  const nombre=(nEl.value||'').trim();
  const email=(eEl.value||'').trim();
  const tel=(document.getElementById('f_tel').value||'').trim();
  const dni=(document.getElementById('f_dni').value||'').trim();
  const err=document.getElementById('err');
  err.style.display='none';
  document.querySelectorAll('.inp').forEach(i=>i.classList.remove('inp-error'));
  if(nombre.length<2) return marcarError(nEl,'Escribe tu nombre.');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return marcarError(eEl,'Revisa tu email — ahí te llega el QR.');
  if(/@(gmail|hotmail|outlook|yahoo|icloud)\.(con|comm|cim|vom)$/i.test(email)) return marcarError(eEl,'Parece que hay un error al final del email (¿quisiste decir .com?).');
  const tEl=document.getElementById('f_tel');
  if(tel.replace(/\D/g,'').length<6) return marcarError(tEl,'Escribe tu teléfono — lo usamos si no te llega el correo.');
  if(!(SEL[0]||SEL[1]||SEL[2])) return marcarError(null,'Marca al menos un día de asistencia.');
  if(AUTO){
    const dias=(SP.dias||[]);
    const idx=dias.indexOf(AUTO);
    if(idx>=0 && !SEL[idx]) return marcarError(null,'Elegiste la vuelta en auto para '+AUTO+', pero no marcaste ese día de asistencia.');
  }

  const btn=document.getElementById('send');
  btn.disabled=true; btn.textContent='Enviando...';
  const payload={ type:"vip_generico", sponsor_id:SP.id, nombre, email, telefono:tel, dni,
    d1:!!SEL[0], d2:!!SEL[1], d3:!!SEL[2],
    vuelta_auto: AUTO,
    fecha_registro:new Date().toLocaleString("es-AR") };
  try{
    await fetch(SHEETS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  }catch(e){
    btn.disabled=false; btn.textContent='Confirmar mi lugar VIP';
    marcarError(null,'No pudimos enviar tu registro. Revisa tu conexión e inténtalo de nuevo.');
    return;
  }
  exito(nombre, email);
}

function icsFechas(){
  // Fechas del evento para el calendario (config del evento actual)
  const F = { "VIE 4":"20260904","SÁB 5":"20260905","DOM 6":"20260906" };
  const dias=(SP.dias||[]);
  const sel=[SEL[0]?dias[0]:null,SEL[1]?dias[1]:null,SEL[2]?dias[2]:null].filter(Boolean);
  return sel.map(d=>F[d]).filter(Boolean);
}

function descargarICS(){
  const fechas=icsFechas();
  if(!fechas.length) return;
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//GP3//VIP//ES'];
  fechas.forEach((f,i)=>{
    lines.push('BEGIN:VEVENT','UID:gp3vip-'+f+'-'+i+'@gp3sports.lat','DTSTART;VALUE=DATE:'+f,
      'SUMMARY:'+(SP.evento||'Gran Premio Mobil')+' — Zona VIP',
      'LOCATION:'+(SP.lugar||''),'END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  const a=document.createElement('a');
  a.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(lines.join('\r\n'));
  a.download='gran-premio-mobil-vip.ics'; a.click();
}

function exito(nombre, email){
  const dias=(SP.dias||[]);
  const elegidos=[SEL[0]?dias[0]:null,SEL[1]?dias[1]:null,SEL[2]?dias[2]:null].filter(Boolean).join(' · ');
  content.innerHTML =
    '<div class="center anim" style="padding:36px 0 10px">'+
    '<div class="icn">'+ICONS.ticket+'</div>'+
    '<h2>¡Listo, '+esc(nombre.split(' ')[0])+'!</h2>'+
    '<p>Tu lugar VIP quedó confirmado'+(elegidos?' para <b style="color:var(--navy)">'+esc(elegidos)+'</b>':'')+'.'+
    (AUTO?'<br>Vuelta en auto de carrera: anotado para <b style="color:var(--navy)">'+esc(AUTO)+'</b>. Te confirmamos tu cupo antes del evento.':'')+'</p>'+
    '<div class="ok-steps">'+
      '<div class="step"><div class="n">1</div><div class="t">En los próximos minutos te llega tu acceso con <b>código QR</b> a <b>'+esc(email)+'</b>, desde <b>inscripcion@gp3chile.cl</b>. Revisa también <b>spam</b> y promociones.</div></div>'+
      '<div class="step"><div class="n">2</div><div class="t">Guarda el correo o haz una captura del <b>QR</b> para tenerlo a mano en tu celular.</div></div>'+
      '<div class="step"><div class="n">3</div><div class="t">El día de la carrera, muestra el <b>QR en la entrada</b> junto con tu <b>DNI</b> y disfruta la zona VIP.</div></div>'+
    '</div>'+
    '<div class="rescue">¿No te llegó en 15 minutos? Escríbenos a <b>admin@gp3chile.cl</b> y te lo reenviamos.</div>'+
    '<button type="button" class="cal" onclick="descargarICS()">Agregar a mi calendario</button>'+
    '</div>';
  window.scrollTo({top:0,behavior:'smooth'});
}

cargar();
</script>
