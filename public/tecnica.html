<style>
/* VOICE: libreta técnica de box, sobria y exacta, como la planilla de un equipo de fábrica.
   IDEA: la ficha de la moto en el paddock: cada moto es una tarjeta con su contador hacia el próximo desarme.
   PICTURE: tablero de flota con 18 barras de km hacia la inspección de 2.000 km del motor.
   COLOUR/TYPE: manual Moto4 (Quick Guide v3): negro, blanco, Latin Purple #D63DFC, Latin Violet #C604F7, Latin Pink #E37BFD.
   Krona One reemplaza a MGP Display (licencia no incluida); Barlow para el texto. LAYOUT: cabecera negra Moto4, pestañas, tarjetas. */
:root{color-scheme:light dark;
 --bg:light-dark(#f4f3f6,#09080b);--card:light-dark(#fff,#16141a);--ink:light-dark(#141217,#f2f0f5);--ink2:light-dark(#4a4652,#c9c4d2);--ink3:light-dark(#6c6775,#9a94a5);
 --line:light-dark(#e4e1e9,#2a2631);--line2:light-dark(#cfcad6,#3d3846);--field:light-dark(#fbfafc,#1e1b23);
 --vio:#C604F7;--pur:#D63DFC;--pink:#E37BFD;--acc:light-dark(#9a00c4,#e37bfd);--accbg:light-dark(#f6e6fd,#2b1236);
 --ok:light-dark(#0b7a3a,#4ad688);--okbg:light-dark(#e3f5ea,#0f2a1b);--warn:light-dark(#8a5a00,#f2be4a);--warnbg:light-dark(#fdf2d8,#332709);
 --crit:light-dark(#b3261e,#ff7a70);--critbg:light-dark(#fbe6e4,#3a1513);--gray:light-dark(#6c6775,#9a94a5);--graybg:light-dark(#efedf2,#221f27)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Barlow',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;overflow-x:clip}
.top{background:#000;color:#fff;padding:12px max(16px,env(safe-area-inset-left)) 0;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-80px;top:-60px;width:420px;height:260px;border-radius:50%;border:38px solid var(--vio);opacity:.5;filter:blur(1px);pointer-events:none}
.top::before{content:"";position:absolute;right:-30px;top:-10px;width:300px;height:180px;border-radius:50%;border:22px solid var(--pur);opacity:.35;pointer-events:none}
.tw{max-width:1240px;margin:0 auto;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:52px;height:52px;border-radius:10px}
.brand b{font:400 clamp(17px,3.4vw,24px)/1.1 'Krona One',sans-serif;display:block}
.brand span{font-size:13px;color:#d9c7e6}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
nav.tabs button{flex:none;border:0;background:transparent;color:#d9c7e6;font:700 15px 'Barlow Condensed',sans-serif;letter-spacing:.4px;padding:11px 14px;border-radius:8px 8px 0 0;cursor:pointer;min-height:44px}
nav.tabs button[aria-selected=true]{background:var(--bg);color:var(--ink)}
.wrap{max-width:1240px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left)) 60px}
.banner{background:var(--accbg);color:var(--ink);border:1px solid var(--pur);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.banner b{color:var(--acc)}
h1{font:400 clamp(20px,3.6vw,30px)/1.1 'Krona One',sans-serif;margin:4px 0 6px;text-wrap:balance}
h2{font:700 19px/1.2 'Barlow Condensed',sans-serif;letter-spacing:.3px;margin:0 0 10px}
h3{font:700 16px/1.2 'Barlow Condensed',sans-serif;margin:14px 0 8px}
.lead{color:var(--ink2);margin:0 0 14px;max-width:70ch}
.small{font-size:13px;color:var(--ink3)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.fleet{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
@media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .l{font:700 13px 'Barlow Condensed',sans-serif;color:var(--ink2);letter-spacing:.3px}
.kpi .v{font:400 clamp(18px,4vw,26px)/1.15 'Krona One',sans-serif;margin:4px 0 2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.moto{cursor:pointer;transition:border-color .15s}
.mh .pill{white-space:normal;max-width:58%;text-align:right;line-height:1.2}
.moto:hover,.moto:focus-visible{border-color:var(--pur);outline:none}
.mh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.num{font:400 22px/1 'Krona One',sans-serif;color:var(--acc)}
.bar{height:10px;border-radius:5px;background:var(--graybg);overflow:hidden;margin:6px 0 3px}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--vio),var(--pur))}
.bar.w>i{background:var(--warn)}.bar.c>i{background:var(--crit)}
.pill{display:inline-flex;align-items:center;gap:5px;font:700 12.5px/1 'Barlow Condensed',sans-serif;letter-spacing:.3px;padding:5px 8px;border-radius:20px;white-space:nowrap}
.ok{color:var(--ok);background:var(--okbg)}.warn{color:var(--warn);background:var(--warnbg)}.crit{color:var(--crit);background:var(--critbg)}.gray{color:var(--gray);background:var(--graybg)}.accp{color:var(--acc);background:var(--accbg)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
button,.btn{font:600 15px 'Barlow',sans-serif;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 14px;min-height:44px;cursor:pointer}
button.p{background:var(--vio);border-color:var(--vio);color:#fff}
button.p:hover{background:#a903d3}
button.d{color:var(--crit)}
button.s{min-height:36px;padding:6px 10px;font-size:14px}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--pur);outline-offset:2px}
label{display:block;font:600 13px 'Barlow',sans-serif;color:var(--ink2);margin-bottom:3px}
input,select,textarea{font:16px 'Barlow',sans-serif;color:var(--ink);background:var(--field);border:1px solid var(--line2);border-radius:8px;padding:9px 10px;width:100%;min-height:44px}
textarea{min-height:80px}
input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
.hint{font-size:12.5px;color:var(--ink3);margin-top:2px}
.f{margin-bottom:10px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px 4px;margin:0 0 12px}
.pi{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 0;border-top:1px solid var(--line)}
.pi:first-of-type{border-top:0}
.pi .pt{flex:1 1 220px;font-size:14.5px}
.sn{display:inline-flex;gap:4px}
.sn label{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:600;cursor:pointer;min-height:38px}
.sn input{width:auto;min-height:0;margin:0}
.pi .psi{width:80px;flex:0 0 80px}
.pi .po{flex:1 1 180px;min-width:140px}
.rg{padding:9px 0;border-top:1px solid var(--line)}
.rg .pill{white-space:normal;text-align:right;line-height:1.2}
.rgp{margin:3px 0;font-size:14.5px}
legend{font:700 15px 'Barlow Condensed',sans-serif;padding:0 6px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font:700 13px 'Barlow Condensed',sans-serif;color:var(--ink2);border-bottom:1px solid var(--line2);padding:7px 6px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
code,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;overflow-wrap:anywhere}
.empty{padding:22px;text-align:center;color:var(--ink3);border:1px dashed var(--line2);border-radius:12px}
dialog{border:0;border-radius:14px;padding:0;width:min(720px,96vw);max-height:92vh;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(10,0,20,.55)}
.dh{background:#000;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:2}
.dh b{font:400 15px 'Krona One',sans-serif;flex:1}
.dh button{background:transparent;color:#fff;border-color:#555}
.db{padding:14px 16px;overflow:auto;max-height:calc(92vh - 60px)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#000;color:#fff;border:1px solid var(--pur);padding:10px 16px;border-radius:10px;z-index:99;font-size:15px;max-width:92vw}
.list>div{padding:9px 0;border-top:1px solid var(--line)}.list>div:first-child{border-top:0}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:38px}.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
@media(max-width:600px){table{font-size:13.5px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:2px 0;padding-inline-start:8.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:8em;margin-inline-start:-8.5em;color:var(--ink3);font-size:12.5px}.stack td:empty{display:none}.stack td.n{text-align:start}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>

const SESIONES = ['Libre 1','Libre 2','Libre 3','Clasificación','Calentamiento (warm up)','Carrera 1','Carrera 2','Test'];
const BODEGAS = [['CL','Chile'],['BR','Brasil'],['AR','Argentina']];
const ESTADOS_CAIDA = {reportada:['Reportada','gray'],presupuestada:['Enviada al apoderado','warn'],aceptada:['Aceptada','ok'],revision:['En revisión','crit'],cobrada:['Cobrada','accp']};
// ======================= PAUTA DE MANTENCIÓN (planilla Moto4, actualizada 19-09-2026) =======================

const PAUTA_ITEMS = [
 ['m01','Cambio de aceite motor (1,2 litros 10W30 Mobil)'],['m02','Cambio filtro de aceite (15410-NX7-003)'],['m03','Cambio O-ring A (91302-PA9-003)'],['m04','Cambio O-ring B (91302-PL4-003)'],['m05','Cambio arandela (golilla) (90474-333-000)'],

 ['m16','Reemplazo líquido de freno'],['m17','Limpieza cáliper delantero'],['m18','Medición pastillas delanteras (indicador de desgaste)'],['m19','Limpieza cáliper trasero'],['m20','Medición pastillas traseras (indicador de desgaste)'],
 ['m21','Cambio neumático delantero'],['m22','Cambio neumático trasero'],['m23','Lubricación cables (piolas)'],['m24','Lubricación partes móviles'],['m25','Moto limpia']];

const REGLAJE = [

  ['Resorte','8,0 kgf/mm (amarillo) · precarga 6,9 mm (147 mm)','6,5 negro → precarga 8,5 mm · 7,0 verde → 7,9 mm · 7,5 azul → 7,4 mm · 8,5 rojo → 6,5 mm','Cambio de resorte (ver página 5-20) y precarga según la tabla','Para el peso del piloto. Con la precarga de la tabla, la altura de la moto queda igual que con el resorte estándar.','2-4 · 7-13']]},

async function cargar(){

    let ok=false; try{ const s=localStorage.getItem(LS); if(s){ const o=JSON.parse(s); COLS.forEach(c=>D[c]=Array.isArray(o[c])?o[c]:[]); ok=D.motos.length>0; } }catch(e){}

  }

async function api(body){
  if(!CFG.url) return {ok:false,error:'Falta conectar el servidor de Moto4 Técnica.'};
  const ac=new AbortController(); const t=setTimeout(()=>ac.abort(),40000);
  try{ const r=await fetch(CFG.url,{method:'POST',signal:ac.signal,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({pin:SES.pin||undefined,c:SES.codigo||undefined,autor:SES.autor},body))}); return await r.json(); }
  catch(e){ return {ok:false,error:'Sin conexión con el servidor. Revisa internet y vuelve a intentar.'}; }
  finally{ clearTimeout(t); }
}
function resumen(c,f){ return c==='tandas'?`${f.sesion||''} · ${f.vueltas||0} vueltas`:c==='caidas'?`Caída ${f.curva||''}`:c==='movimientos'?`${f.tipo} ${f.cantidad} × ${f.parte||''}`:(f.item||f.nombre||f.numero||f.id); }
async function guardar(c,f0){
  const f=Object.assign({},f0); const nuevo=!f.id||!byId(c,f.id); if(!f.id) f.id=uid(c.slice(0,2).toUpperCase());
  const base=f.v||0; f.editado=new Date().toISOString(); f.autor=SES.autor||SES.rol;
  if(PRUEBA){
    const act=byId(c,f.id); if(act&&Number(act.v||0)!==Number(base)){ toast('Otra persona cambió este registro. Ciérralo y vuelve a abrirlo.'); return false; }
    f.v=Number(base)+1;
    const i=D[c].findIndex(x=>x.id===f.id); if(i>=0) D[c][i]=f; else D[c].push(f);
    if(c!=='historial') D.historial.unshift({id:uid('H'),ts:f.editado,autor:f.autor,accion:nuevo?'creó':'editó',col:c,ref:f.id,resumen:resumen(c,f)});
    D.historial=D.historial.slice(0,400); return guardarLocal() ? f : false;
  }
  const r=await api({accion:'guardar',col:c,fila:f,base});
  if(!r.ok){ toast(r.error||'No se pudo guardar'); return false; }
  const i=D[c].findIndex(x=>x.id===r.fila.id); if(i>=0) D[c][i]=r.fila; else D[c].push(r.fila); return r.fila;
}

const largo = evId => { const e=byId('eventos',evId); const c=e&&byId('circuitos',e.circuitoId); return c?num(c.largoKm):null; };
const kmTanda = t => { const L=largo(t.eventoId); const v=num(t.vueltas); return L!=null&&v!=null ? +(L*v).toFixed(2) : null; };
const kmMoto = m => (num(m.kmInicial)||0) + D.tandas.filter(t=>t.motoId===m.id).reduce((s,t)=>s+(kmTanda(t)||0),0);
const kmMotor = e => (num(e.kmInicial)||0) + D.tandas.filter(t=>t.motorId===e.id).reduce((s,t)=>s+(kmTanda(t)||0),0);
const motorDe = m => byId('motores', m.motorId);
const nombreMoto = m => m ? (m.numero ? '#'+m.numero : 'Moto '+String(m.flota).padStart(2,'0')) : '—';
const etiquetaMoto = m => m ? nombreMoto(m) + (m.piloto ? ' · '+m.piloto : '') : '—';
const eventosDeMoto = m => [...new Set(D.tandas.filter(t=>t.motoId===m.id).map(t=>t.eventoId))].map(id=>byId('eventos',id)).filter(Boolean).sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));
function ultimaMant(it, m){
  const e = it.aplica==='motor' ? motorDe(m) : null;
  const xs = D.mantenciones.filter(x=>(x.items||[]).includes(it.id) && (it.aplica==='motor' ? x.motorId===(e&&e.id) : x.motoId===m.id)).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  return xs[0]||null;
}
function estadoItem(it, m){
  const e = motorDe(m); const actual = it.aplica==='motor' ? (e?kmMotor(e):null) : kmMoto(m);
  const u = ultimaMant(it, m);
  // ¿Se conoce la historia? Solo si Alex cargó los km de la planilla en papel (km inicial) de la moto o del motor.
  const conocida = (it.aplica==='motor' ? (e&&num(e.kmInicial)!=null) : num(m.kmInicial)!=null);
  // La lluvia obliga a cambiar el líquido de frenos aunque no se conozca la historia (manual, pág. 3-1)
  const despues = t => !u || String(t.fecha||'') > String(u.fecha||'') || (String(t.fecha||'')===String(u.fecha||'') && String(t.editado||'') > String(u.editado||''));
  const lluvia = it.lluvia && D.tandas.some(t=>t.motoId===m.id && t.condicion==='Lluvia' && despues(t));
  if(lluvia) return {st:'crit',txt:'Corrió con lluvia: cambiar',pct:100};
  if(!u && !conocida && it.tipo==='km'){
    // Lo anotado en el sistema es un piso seguro: si ya supera el intervalo, está vencido aunque falte la planilla
    if(actual!=null && actual>=it.km) return {st:'crit', txt:`Vencido: ya lleva ${km(actual)} solo en este sistema (falta la planilla en papel)`, pct:100};
    return {st:'gray', falta:true, txt:'Falta el km de la planilla en papel y el último cambio', faltan:null, pct:0};
  }
  if(it.tipo==='km'){
    // Sin registro del último cambio, pero con km conocidos: se cuenta desde 0 km (lo más prudente: nunca esconde un vencimiento)
    const desde = u && u.km!=null ? actual - num(u.km) : actual;
    if(desde==null) return {st:'gray', txt:'Sin motor', faltan:null, pct:0};
    const faltan = it.km - desde; const pct = Math.min(100, Math.max(0, desde/it.km*100));
    const sufijo = u ? '' : ' (sin registro del último cambio: se cuenta desde 0 km)';
    return {st: faltan<=0?'crit':pct>=85?'warn':'ok', txt: (faltan<=0?`Vencido por ${km(-faltan)}`:`Faltan ${km(faltan)}`)+sufijo, faltan, pct};
  }
  if(it.tipo==='rodaje'){ // tras cada desarme (P10) toca rodaje
    const des = ultimaMant(D.plan.find(x=>x.id==='P10')||{id:'P10',aplica:'motor'}, m);
    if(!des) return {st:'gray',txt:'Al reconstruir el motor',pct:0};
    const hecho = u && String(u.fecha)>=String(des.fecha);
    return hecho ? {st:'ok',txt:'Rodaje hecho tras el último desarme',pct:100} : {st:'warn',txt:'Toca rodaje: motor reconstruido el '+fdia(des.fecha),pct:50};
  }
  // por evento
  const evs = eventosDeMoto(m);
  if(it.veces){ // dos cambios de aceite por evento: se mide en el último evento donde la moto corrió o tuvo mantención
    const conActividad = new Set(evs.map(x=>x.id).concat(D.mantenciones.filter(x=>x.motoId===m.id&&x.eventoId).map(x=>x.eventoId)));
    const ult = D.eventos.filter(x=>conActividad.has(x.id)).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)))[0];
    if(!ult) return {st:'gray',txt:'Sin eventos aún',pct:0};
    const n = D.mantenciones.filter(x=>x.motoId===m.id && (x.items||[]).includes(it.id) && x.eventoId===ult.id).length;
    return {st: n>=it.veces?'ok':n>0?'warn':'crit', txt:`${n} de ${it.veces} en ${ult.nombre}`, pct:n/it.veces*100};
  }
  if(it.primeroKm && !u){ const k=kmMoto(m); return k>=it.primeroKm?{st:'crit',txt:`Sin registro y ya lleva ${km(k)} (primer cambio a los ${it.primeroKm} km)`,pct:100}:{st:'gray',falta:true,txt:'Falta registrar el último cambio',pct:0}; }
  const desdeEv = u ? evs.filter(ev=>String(ev.fecha)>String(u.fecha)).length : evs.length;
  if(!u && desdeEv < it.cada) return {st:'gray', falta:true, txt: evs.length ? 'Falta registrar el último cambio' : 'Sin eventos aún', pct:0};
  const faltan = it.cada - desdeEv;
  return {st: faltan<=0?'crit':faltan===1?'warn':'ok', txt: (faltan<=0?'Toca en este evento':`Faltan ${faltan} evento${faltan>1?'s':''}`)+(u?'':' (sin registro del último cambio)'), pct:desdeEv/it.cada*100};
}
function alertas(m){ return D.plan.map(it=>({it, e:estadoItem(it,m)})).filter(x=>x.e.st==='crit'||x.e.st==='warn'); }
function faltanDatos(m){ return D.plan.some(it=>estadoItem(it,m).falta); }
function peor(m){ const a=alertas(m); return a.some(x=>x.e.st==='crit')?'crit':a.length?'warn':faltanDatos(m)?'gray':'ok'; }

// ======================= COSTO PUESTO EN CHILE =======================
// Por embarque: pago al proveedor en pesos (CIF: repuestos + flete aéreo + seguro) + derechos + agencia + almacenaje + transporte + courier + otros.
// El IVA de importación es crédito fiscal: solo suma al costo si se marca «no recuperable».
// Cada repuesto toma su parte en proporción a su precio FOB en yenes: costo = FOB del repuesto × (costo total del embarque ÷ FOB total del embarque).
const GASTOS = [['derechos','Derechos de aduana (6 % del CIF)'],['agencia','Agencia de aduana (comisión + despacho)'],['almacenaje','Almacenaje en el aeropuerto'],['transporte','Transporte a la bodega'],['courier','Courier (FedEx, DHL)'],['otros','Otros gastos']];
function costosEmbarque(e){
  if(!e) return null;
  const est = {};                           // lo que se calcula por falta del dato real
  let pago = num(e.pagoClp);
  if(pago==null && num(e.cifJpy)!=null && num(e.tcJpyEstimado)!=null){ pago = num(e.cifJpy)*num(e.tcJpyEstimado); est.pagoClp = true; }
  let derechos = num(e.derechos);
  if(derechos==null && pago!=null){ derechos = pago*0.06; est.derechos = true; }
  const otros = GASTOS.slice(1).reduce((s,[k])=>s+(num(e[k])||0),0);
  let iva = num(e.iva); if(iva==null && pago!=null){ iva = (pago+(derechos||0))*0.19; est.iva = true; }
  const total = pago==null ? null : pago + (derechos||0) + otros + (e.ivaRecuperable===false ? (iva||0) : 0);
  const fob = num(e.fobJpy);
  const factor = total!=null && fob ? total/fob : null;          // pesos por cada yen FOB
  const gastos = total!=null && pago ? (total-pago)/pago : null;  // recargo sobre el pago al proveedor
  const estimado = e.estado==='estimado' || Object.keys(est).length>0;
  return {pago, derechos, otros, iva, total, factor, gastos, estimado, est};
}
function costoRepuesto(r){
  const e = r && r.embarqueId ? byId('embarques', r.embarqueId) : null; const c = costosEmbarque(e);
  if(!c || c.factor==null || num(r.fobJpy)==null) return null;
  const clp = num(r.fobJpy)*c.factor; const tc = num(e.tcUsd);
  return {clp, usd: tc ? clp/tc : null, embarque:e, estimado:c.estimado};
}
const clp = v => v==null ? '—' : '$ ' + fmt(v, 0);
function margen(r){ const c=costoRepuesto(r); const p=num(r.precio); if(!c||p==null||p<=0) return null;
  const mo = r.moneda||'USD'; if(mo!=='CLP' && mo!=='USD') return null; const costo = mo==='CLP' ? c.clp : c.usd; if(costo==null) return null; return (p-costo)/p; }
const stockTotal = r => BODEGAS.reduce((s,[b])=>s+(num(r.stock&&r.stock[b])||0),0);

function tarjetaMoto(m){
  const e = motorDe(m); const kmE = e?kmMotor(e):null; const it = D.plan.find(x=>x.id==='P10');
  const st = it ? estadoItem(it, m) : {pct:0};
  const p = peor(m); const al = alertas(m);
  return `<div class="card moto" tabindex="0" data-a="ficha" data-id="${h(m.id)}">
   <div class="mh"><div><div class="num">${h(nombreMoto(m))}</div><div style="font-weight:600">${h(m.piloto||'Sin piloto asignado')}</div></div>${pill(p, p==='ok'?'Al día':p==='gray'?'Faltan datos':p==='warn'?al.length+' por venir'+(faltanDatos(m)?' · faltan datos':''):al.filter(x=>x.e.st==='crit').length+' vencido'+(al.filter(x=>x.e.st==='crit').length>1?'s':'')+(faltanDatos(m)?' · faltan datos':''))}</div>
   <div class="small mono" style="margin-top:6px">Chasis ${h(m.chasis)}</div>

const datalistRep = () => `<datalist id="dlRep">${D.repuestos.map(r=>`<option value="${h(r.parte)} · ${h(r.nombre)}">`).join('')}</datalist>`;
async function moverStock(parte, delta, bodega, extra){
  const r = D.repuestos.find(x=>x.parte===parte); if(!r || (!delta && !(extra&&extra.absoluto!=null&&!PRUEBA))) return !!r;
  if(!PRUEBA){ // el servidor aplica la diferencia bajo bloqueo: dos personas a la vez no se pisan
    const x = await api({accion:'moverStock', parte, delta, bodega, extra, absoluto: extra&&extra.absoluto!=null ? extra.absoluto : undefined});
    if(!x.ok){ toast(x.error||'No se pudo mover el stock'); return false; }
    const i=D.repuestos.findIndex(y=>y.id===x.repuesto.id); if(i>=0) D.repuestos[i]=x.repuesto; D.movimientos.push(x.movimiento); return true;
  }
  const st = Object.assign({CL:0,BR:0,AR:0}, r.stock); st[bodega] = (num(st[bodega])||0) + delta;
  if(!await guardar('repuestos', Object.assign({}, r, {stock:st}))) return false;
  if(st[bodega]<0) setTimeout(()=>toast('El stock de '+parte+' quedó negativo: falta registrar el conteo o la compra'),900);
  return !!await guardar('movimientos', Object.assign({fecha:hoy(), parte, repuestoId:r.id, cantidad:delta, bodega}, extra));
}

function validarTanda(f){
  if(!FECHA.test(String(f.fecha||''))) return 'Revisa la fecha';

  for(const [k,[a,b,ent]] of Object.entries(RANGOS)){ if(f[k]===''||f[k]==null) continue; const v=num(f[k]); if(v==null||v<a||v>b||(ent&&!Number.isInteger(v))) return `${NOMBRES[k]}: valor fuera de rango (${a} a ${b})`; }

async function fotosDe(input){

  return out;
}

function marcasPauta(p){ const it=p.items||{}; const si=PAUTA_ITEMS.filter(([k])=>(it[k]||{}).v==='si').length; const no=PAUTA_ITEMS.filter(([k])=>(it[k]||{}).v==='no').length; return {si,no}; }
function tablaPautas(ps, conMoto){
  if(!ps.length) return '<div class="empty">Sin pautas registradas.</div>';
  return `<div class="scroll"><table class="stack"><thead><tr><th>Fecha</th>${conMoto?'<th>Moto</th>':''}<th>Evento</th><th>Mecánico</th><th class="n">Hechos</th><th></th></tr></thead><tbody>${ps.map(p=>{ const c=marcasPauta(p); return `<tr><td>${fdia(p.fecha)}</td>${conMoto?`<td>${h(etiquetaMoto(byId('motos',p.motoId)))}</td>`:''}<td>${h((byId('eventos',p.eventoId)||{}).nombre||'—')}</td><td>${h(p.mecanico||'—')}</td><td class="n">${c.si} sí · ${c.no} no</td><td><button class="s" data-a="verPauta" data-id="${h(p.id)}">Ver</button></td></tr>`; }).join('')}</tbody></table></div>`;
}
let FP = {moto:''};
function vPautas(){

}
function vMiPauta(){
  const ps=D.pautas.filter(p=>p.motoId===SES.moto).sort((a,b)=>String(b.fecha+b.editado).localeCompare(String(a.fecha+a.editado)));

function formPauta(p, motoFijo){
  const nueva=!p.id; const idP=uid('PA'); const piloto=SES.rol==='piloto';
  const bloqueada = !nueva && piloto && (Date.now() - new Date(String(p.fecha)+'T12:00:00').getTime()) > 3*86400000;
  const motos = motoFijo ? [byId('motos',motoFijo)] : D.motos;
  const it=p.items||{}, pr=p.precinto||{};
  const sn=(name,val)=>`<span class="sn"><label><input type="radio" name="${name}" value="si" ${val==='si'?'checked':''}> Sí</label><label><input type="radio" name="${name}" value="no" ${val==='no'?'checked':''}> No</label></span>`;
  abrir(nueva?'Pauta de mantención':'Pauta de mantención · '+fdia(p.fecha), `<form id="fP">
  <div class="grid g3">
   <div class="f"><label for="p_moto">Moto</label><select id="p_moto" name="motoId" ${motoFijo?'disabled':''}>${motos.map(m=>`<option value="${h(m.id)}" ${p.motoId===m.id?'selected':''}>${h(etiquetaMoto(m))}</option>`).join('')}</select></div>
   <div class="f"><label for="p_fecha">Fecha</label><input id="p_fecha" name="fecha" type="date" value="${h(p.fecha||hoy())}" required></div>
   <div class="f"><label for="p_ev">Evento (circuito)</label><select id="p_ev" name="eventoId"><option value="">—</option>${D.eventos.slice().sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha))).map(e=>`<option value="${h(e.id)}" ${p.eventoId===e.id?'selected':''}>${h(e.nombre)}</option>`).join('')}</select></div>
   <div class="f"><label for="p_mec">Mecánico responsable</label><input id="p_mec" name="mecanico" maxlength="80" value="${h(p.mecanico||'')}" required></div>
  </div>
  <div class="small" id="p_datos" style="margin:-4px 0 10px"></div>
  <fieldset><legend>Mantención</legend>
   ${PAUTA_ITEMS.map(([k,t])=>{ const x=it[k]||{}; const psi = k==='m21'||k==='m22'; return `<div class="pi"><div class="pt">${h(t)}</div>${sn('i_'+k,x.v)}${psi?`<input name="psi_${k}" type="number" step="0.5" min="10" max="45" inputmode="decimal" placeholder="psi" value="${h(x.psi??'')}" class="psi">`:''}<input name="o_${k}" maxlength="200" placeholder="Observación" value="${h(x.o||'')}" class="po"></div>`; }).join('')}
  </fieldset>
  <fieldset><legend>Precintado</legend>${PRECINTO_ITEMS.map(([k,t])=>`<div class="pi"><div class="pt">${h(t)}</div>${sn('r_'+k,pr[k])}</div>`).join('')}</fieldset>
  <div class="f"><label for="p_obs">Observaciones</label><textarea id="p_obs" name="observaciones" maxlength="2000">${h(p.observaciones||'')}</textarea></div>
  <details style="margin:8px 0 12px"><summary><b>Torques (N·m, manual Honda NSF250R)</b></summary><table style="margin-top:6px"><tbody>${TORQUES.map(([t,v,n])=>`<tr><td>${h(t)}${n?`<div class="small" style="color:var(--warn)">▲ ${h(n)}</div>`:''}</td><td class="n"><b>${v}</b></td></tr>`).join('')}</tbody></table></details>
  ${bloqueada?'<p class="small">Esta pauta tiene más de 3 días: para corregirla, pídelo a Alex.</p>':''}
  <div class="row">${bloqueada?'':'<button class="p">Guardar pauta</button>'}${!nueva&&!bloqueada?'<button type="button" class="d" id="pDel">Borrar</button>':''}<span class="small">${h(PAUTA_FUENTE)}</span></div></form>`);
  const datos=()=>{ const m=byId('motos',motoFijo||$('#p_moto').value); const e=m&&motorDe(m); $('#p_datos').innerHTML = m?`Chasis <span class="mono">${h(m.chasis)}</span> · Motor <span class="mono">${h(e?e.numero:'—')}</span> · Piloto ${h(m.piloto||'—')}`:''; };
  datos(); if(!motoFijo) $('#p_moto').onchange=datos;
  if(!nueva && $('#pDel')) $('#pDel').onclick=()=>confirmar('¿Borrar esta pauta?', async()=>{ if(await borrar('pautas',p.id)){ cerrar(); render(); } });
  $('#fP').onsubmit = async ev => { ev.preventDefault(); const F=new FormData(ev.target); const f=Object.fromEntries(F); if(motoFijo) f.motoId=motoFijo;
    if(!FECHA.test(String(f.fecha||''))){ toast('Revisa la fecha'); return; }
    if(!String(f.mecanico||'').trim()){ toast('Escribe el mecánico responsable'); return; }
    const items={}; for(const [k] of PAUTA_ITEMS){ const v=f['i_'+k]||''; const o=String(f['o_'+k]||'').trim(); const x={}; if(v) x.v=v; if(o) x.o=o;
      if(f['psi_'+k]!=null && f['psi_'+k]!==''){ const n=num(f['psi_'+k]); if(n==null||n<10||n>45){ toast('Presión fuera de rango (10 a 45 psi)'); return; } x.psi=n; }
      if(Object.keys(x).length) items[k]=x; }
    const precinto={}; for(const [k] of PRECINTO_ITEMS){ const v=f['r_'+k]; if(v) precinto[k]=v; }
    if(!Object.keys(items).length){ toast('Marca al menos un punto de la pauta'); return; }
    const m=byId('motos',f.motoId);
    const fila=Object.assign({id:p.id||idP}, p, {motoId:f.motoId, motorId:(p.motoId===f.motoId&&p.motorId)||(m&&m.motorId), fecha:f.fecha, eventoId:f.eventoId||'', mecanico:String(f.mecanico).trim().slice(0,80), items, precinto, observaciones:String(f.observaciones||'').slice(0,2000)});
    if(await guardar('pautas',fila)){ toast('Pauta guardada'); cerrar(); render(); } };
}

document.addEventListener('click', async ev=>{
  const tb=ev.target.closest('[data-tab]'); if(tb){ TAB=tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  const fb=ev.target.closest('[data-fb]'); if(fb){ window._fb=fb.dataset.fb; render(); return; }
  const b=ev.target.closest('[data-a]'); if(!b) return; const a=b.dataset.a, id=b.dataset.id;
  const piloto = SES.rol==='piloto';
  if(a==='ficha'&&!piloto) ficha(id);
  else if(a==='nuevaTanda') formTanda({motoId:piloto?SES.moto:id||undefined}, piloto?SES.moto:null);
  else if(a==='verTanda'){ const t=byId('tandas',id); if(t&&(!piloto||t.motoId===SES.moto)) formTanda(t, piloto?SES.moto:null); }
  else if(a==='nuevaCaida') formCaida({motoId:piloto?SES.moto:id||undefined}, piloto?SES.moto:(id||null));
  else if(a==='verCaida'&&!piloto) formCaida(byId('caidas',id));
  else if(piloto&&a==='aceptar'){ const c=byId('caidas',id); if(!c||c.motoId!==SES.moto) return; abrir('Aceptar cargo',`<form id="fAc"><p>Total: <b>${dinero(totalCaida(c),monedaCaida(c))}</b></p><div class="f"><label for="acN">Nombre de quien acepta (apoderado)</label><input id="acN" name="nombre" required></div><button class="p">Acepto el cargo</button></form>`);
    $('#fAc').onsubmit=async e2=>{e2.preventDefault(); const n=new FormData(e2.target).get('nombre'); const r = PRUEBA ? await guardar('caidas',Object.assign({},c,{estado:'aceptada',aceptacion:{nombre:n,ts:new Date().toISOString(),total:totalCaida(c),moneda:monedaCaida(c),piezas:c.piezas,manoObra:c.manoObra}})) : (await api({accion:'aceptarCargo',id:c.id,nombre:n})).ok && (await cargar(),true); if(r){toast('Cargo aceptado');cerrar();render();}}; }
  else if(piloto&&a==='duda'){ const c=byId('caidas',id); if(!c||c.motoId!==SES.moto) return; abrir('Tengo una duda',`<form id="fDu"><div class="f"><label for="duT">Escribe tu pregunta para Alex</label><textarea id="duT" name="t" required></textarea></div><button class="p">Enviar</button></form>`);
    $('#fDu').onsubmit=async e2=>{e2.preventDefault(); const t=new FormData(e2.target).get('t'); const r = PRUEBA ? await guardar('caidas',Object.assign({},c,{estado:'revision',duda:t})) : (await api({accion:'dudaCargo',id:c.id,texto:t})).ok && (await cargar(),true); if(r){toast('Pregunta enviada');cerrar();render();}}; }
  else if(a==='nuevaPauta') formPauta({motoId:piloto?SES.moto:id||undefined}, piloto?SES.moto:null);
  else if(a==='verPauta'){ const p=byId('pautas',id); if(p&&(!piloto||p.motoId===SES.moto)) formPauta(p, piloto?SES.moto:null); }
  else if(a==='instalar' && avisoInstalar){ avisoInstalar.prompt(); try{ await avisoInstalar.userChoice; }catch(e){} avisoInstalar=null; render(); }
  else if(a==='reintentar'){ location.reload(); }
  else if(a==='soyEncargado'){ ev.preventDefault(); pantallaClave(); }
  else if(a==='salirMoto'){ try{ localStorage.removeItem('m4t_c'); }catch(e){} location.replace(location.pathname); }
  else if(a==='ocultarApp'){ try{ localStorage.setItem('m4t_sin_aviso_app','1'); }catch(e){} render(); }
  else if(piloto) return;
  else if(a==='nuevaMant') nuevaMant(id);
  else if(a==='cambiarMotor') cambiarMotor(id);
  else if(a==='editMotor') editMotor(id);
  else if(a==='editRep') editRep(id);
  else if(a==='editEmb') editEmb(id);
  else if(a==='movimiento') movimiento();
  else if(a==='editCirc') editCirc(id);
  else if(a==='editEv') editEv(id);
  else if(a==='copiar'){ try{ await navigator.clipboard.writeText(b.dataset.v); toast('Link copiado'); }catch(e){ toast('No se pudo copiar: selecciona el link y cópialo'); } }
  else if(a==='regen'){ const m=byId('motos',id); confirmar(`¿Cambiar el código de ${nombreMoto(m)}? El link anterior deja de funcionar.`, async()=>{ if(await guardar('motos',Object.assign({},m,{codigo:codigo()}))){ cerrar(); render(); toast('Código cambiado'); } }); }
  else if(a==='verComo'){ SES.rol='piloto'; SES.moto=id; TAB='mimoto'; render(); }
  else if(a==='copiarCSV'){ const cols=['fecha','moto','evento','sesion','vueltas','km','pFD','pFT','pCD','pCT','juego','hP','hC','hE','hA','aP','aC','aE','aH','dD','pinon','corona','condicion','comentario'];
    const q=v=>{ let x=String(v??''); if(/^[=+\-@\t\r]/.test(x)) x="'"+x; return '"'+x.replace(/"/g,'""')+'"'; }; const rows=D.tandas.map(t=>[t.fecha,etiquetaMoto(byId('motos',t.motoId)),(byId('eventos',t.eventoId)||{}).nombre,t.sesion,t.vueltas,kmTanda(t),t.pFD,t.pFT,t.pCD,t.pCT,t.juego,t.hP,t.hC,t.hE,t.hA,t.aP,t.aC,t.aE,t.aH,t.dD,t.pinon,t.corona,t.condicion,t.comentario].map(q).join(','));
    try{ await navigator.clipboard.writeText([cols.join(',')].concat(rows).join('\n')); toast('Tabla copiada: pégala en Excel o Sheets'); }catch(e){ toast('No se pudo copiar'); } }
  else if(a==='reiniciar'&&PRUEBA) confirmar('¿Reiniciar la copia de prueba? Se borra todo lo anotado en este navegador.', ()=>{ try{localStorage.removeItem(LS);}catch(e){} D=Object.fromEntries(COLS.map(c=>[c,[]])); seedInicial(); guardarLocal(); SES.rol='admin'; cerrar(); render(); });
  else if(a==='ejemplo'&&PRUEBA){ if(D.eventos.some(e=>e.ejemplo)) quitarEjemplo(); else cargarEjemplo(); render(); }
});
document.addEventListener('keydown', ev=>{ const c=ev.target.closest&&ev.target.closest('.moto'); if(c&&(ev.key==='Enter'||ev.key===' ')){ ev.preventDefault(); c.click(); } });
document.addEventListener('change', ev=>{
  if(ev.target.id==='verComo'){ const v=ev.target.value; if(v==='admin'){SES.rol='admin';SES.moto=null;TAB='flota';} else {SES.rol='piloto';SES.moto=v;TAB='mimoto';} render(); }
  if(ev.target.id==='ftM'){ FT.moto=ev.target.value; render(); } if(ev.target.id==='fpM'){ FP.moto=ev.target.value; render(); } if(ev.target.id==='ftE'){ FT.evento=ev.target.value; render(); }
});
document.addEventListener('input', ev=>{ if(ev.target.id==='qb'){ window._qb=ev.target.value; const pos=ev.target.selectionStart; render(); const q=$('#qb'); if(q){ q.focus(); try{q.setSelectionRange(pos,pos);}catch(e){} } } });
// Doble toque: el formulario queda bloqueado mientras guarda (se llama al manejador una sola vez)
document.addEventListener('submit', ev=>{ const f=ev.target; if(typeof f.onsubmit!=='function') return; ev.preventDefault(); ev.stopPropagation(); const fn=f.onsubmit; ocupado(f, ()=>fn.call(f, ev)); }, true);
document.addEventListener('submit', async ev=>{ if(ev.target.id==='fAj'){ ev.preventDefault(); const v=new FormData(ev.target).get('moneda');
  if(v!==ajuste('moneda') && D.repuestos.some(r=>r.precio!=null&&r.precio!=='')){ toast('Ya hay precios en '+(ajuste('moneda')||'USD')+': cambiar la moneda los dejaría mal. Pídelo a Antonio.'); render(); return; } const a=D.ajustes.find(x=>x.id==='moneda')||{id:'moneda'}; if(await guardar('ajustes',Object.assign({},a,{valor:v}))){ toast('Moneda guardada'); render(); } } });

// ======================= EJEMPLO (solo copia de prueba) =======================
function cargarEjemplo(){
  const ci={id:'CIej',nombre:'Circuito de ejemplo',largoKm:4,fuente:'Dato de ejemplo, no es un circuito real',ejemplo:true};
  const ev={id:'EVej',nombre:'Fin de semana de ejemplo',fecha:hoy(),circuitoId:'CIej',ejemplo:true};
  D.circuitos.push(ci); D.eventos.push(ev);
  const S=std(); const ses=['Libre 1','Libre 2','Clasificación','Carrera 1'];
  D.motos.slice(0,6).forEach((m,i)=>{ if(!m.piloto){ m.piloto='Piloto de ejemplo '+String.fromCharCode(65+i); m.numero=String(90+i); m.ejemplo=true; }
    ses.forEach((s,j)=>D.tandas.push({id:'TAej'+i+j,motoId:m.id,motorId:m.motorId,eventoId:'EVej',sesion:s,fecha:hoy(),vueltas:[8,9,7,14][j],condicion:'Seco',pFD:S.presion_del_psi,pFT:S.presion_tras_psi,juego:'J1',hP:S.horq_precarga_mm,hC:S.horq_comp+(i%2),hE:S.horq_ext,hA:S.horq_altura_mm,aP:S.amort_precarga_mm,aC:S.amort_comp,aE:S.amort_ext,pinon:S.pinon,corona:S.corona,comentario:'Ejemplo',ejemplo:true,editado:new Date().toISOString(),autor:'ejemplo'}));
    D.mantenciones.push({id:'MAej'+i,motoId:m.id,motorId:m.motorId,eventoId:'EVej',fecha:hoy(),items:['P01'],km:0,notas:'Cambio de aceite antes de empezar (ejemplo)',ejemplo:true}); });
  const m=D.motos[1]; D.caidas.push({id:'CAej',motoId:m.id,eventoId:'EVej',sesion:'Clasificación',fecha:hoy(),curva:'Curva 3',tipo:'Caída por adelante',descripcion:'Maneta de freno y estribera derecha dobladas (ejemplo)',estado:'reportada',piezas:[],fotos:[],ejemplo:true});
  guardarLocal(); toast('Ejemplo cargado: 6 motos, 24 tandas y una caída');
}
function quitarEjemplo(){ ['circuitos','eventos','tandas','mantenciones','caidas'].forEach(c=>D[c]=D[c].filter(x=>!x.ejemplo)); D.motos.forEach(m=>{ if(m.ejemplo){ m.piloto=''; m.numero=''; delete m.ejemplo; } }); guardarLocal(); toast('Ejemplo quitado'); }

// ======================= APLICACIÓN EN EL TELÉFONO =======================
const enApp = () => { try{ return matchMedia('(display-mode: standalone)').matches || navigator.standalone===true; }catch(e){ return false; } };
const esIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
let avisoInstalar = null;
window.addEventListener('beforeinstallprompt', ev => { ev.preventDefault(); avisoInstalar = ev; if(document.querySelector('#instalarApp')) render(); });
function tarjetaInstalar(){
  if(enApp()) return '';
  let oculto=false; try{ oculto = localStorage.getItem('m4t_sin_aviso_app')==='1'; }catch(e){}
  if(oculto) return '';
  const pasos = esIOS() ? 'En el iPhone: abre este link en <b>Safari</b>, toca <b>Compartir</b> (el cuadrado con la flecha) y elige <b>«Agregar a inicio»</b>.'
    : avisoInstalar ? 'Toca el botón y queda como una app más en tu teléfono.'
    : 'En Android: abre el menú <b>⋮</b> de Chrome y elige <b>«Instalar aplicación»</b> o «Agregar a la pantalla principal». En el computador: el ícono de instalar en la barra de direcciones de Chrome o Edge.';
  return `<div class="card" id="instalarApp" style="margin-bottom:12px;border-color:var(--pur)"><div class="row"><b>Instálala como app</b><span class="sp"></span>${avisoInstalar?'<button class="p s" data-a="instalar">Instalar</button>':''}<button class="s" data-a="ocultarApp">Ahora no</button></div><p class="small" style="margin:6px 0 0">${pasos} Sirve en cualquier marca de teléfono y en el computador.</p></div>`;
}
if('serviceWorker' in navigator && !PRUEBA && (location.protocol==='https:' || location.hostname==='localhost')){ window.addEventListener('load', ()=>{ navigator.serviceWorker.register('/tecnica-sw.js', {scope:'/tecnica'}).catch(()=>{}); }); }
window.addEventListener('offline', ()=>toast('Sin internet: lo que anotes no se guarda hasta que vuelva la señal'));

// ======================= INICIO =======================
function pantallaClave(err){
  $('#tabs').innerHTML='';
  $('#app').innerHTML=`<div class="card" style="max-width:420px;margin:30px auto"><h1 style="font-size:22px">Encargado técnico</h1><p class="small">Entra con la clave del encargado de Moto4 Técnica. Se valida en el servidor.</p>${err?`<p class="pill crit">■ ${h(err)}</p>`:''}<form id="fL"><div class="f"><label for="lN">Tu nombre</label><input id="lN" name="autor" required autocomplete="name"></div><div class="f"><label for="lP">Clave</label><input id="lP" name="pin" type="password" required autocomplete="current-password"></div><button class="p" style="width:100%">Entrar</button></form></div>`;
  $('#fL').onsubmit=async ev=>{ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target));SES.pin=f.pin;SES.autor=f.autor;try{await cargar(); if(SES.rol!=='admin') throw new Error('Clave incorrecta'); render();}catch(e){SES.pin='';pantallaClave(e.message);}};
}
// App instalada sin código guardado (en iPhone la app instalada no comparte datos con Safari): se pega el link
function pantallaLink(){
  $('#tabs').innerHTML='';
  $('#app').innerHTML=`<div class="card" style="max-width:460px;margin:30px auto"><h1 style="font-size:22px">Abre tu moto</h1><p class="small">Pega aquí el link de Moto4 Técnica que te mandó Alex.</p><form id="fLink"><div class="f"><label for="lk">Link de tu moto</label><input id="lk" name="link" required placeholder="https://panel.gp3sports.lat/tecnica#c-…"></div><button class="p" style="width:100%">Entrar</button></form><p class="small" style="margin-top:12px"><a href="#" data-a="soyEncargado">Soy encargado: entrar con la clave</a></p></div>`;
  $('#fLink').onsubmit=ev=>{ ev.preventDefault(); const v=String(new FormData(ev.target).get('link')||''); const m=v.match(/(?:#c-|[?&]c=)([a-z0-9]{10,40})/); if(!m){ toast('Ese link no parece de Moto4 Técnica'); return; } try{ localStorage.setItem('m4t_c', m[1]); }catch(e){} location.replace(location.pathname+'#c-'+m[1]); location.reload(); };
}
async function iniciar(){
  try{ const s=document.querySelector('#logo'); if(window.M4T_LOGO) s.src=window.M4T_LOGO; }catch(e){}
  let c = new URLSearchParams(location.search).get('c') || (location.hash.match(/^#c-([a-z0-9]{10,40})$/)||[])[1];
  if(c && !PRUEBA){ try{ localStorage.setItem('m4t_c', c); }catch(e){} }
  if(!c && !PRUEBA){ try{ const g=localStorage.getItem('m4t_c'); if(/^[a-z0-9]{10,40}$/.test(g||'')) c=g; }catch(e){} }
  if(PRUEBA){ await cargar(); SES.rol='admin'; SES.autor='Prueba'; if(c){ const m=D.motos.find(x=>x.codigo===c); if(m){SES.rol='piloto';SES.moto=m.id;TAB='mimoto';} } render(); return; }
  if(c){ SES.codigo=c; SES.autor='Piloto'; try{ await cargar(); if(SES.rol!=='piloto') throw new Error('Clave o link no válido'); SES.autor=etiquetaMoto(byId('motos',SES.moto)); TAB='mimoto'; render(); }
    catch(e){ $('#tabs').innerHTML='';
      if(/no válido/i.test(String(e&&e.message))){ try{ localStorage.removeItem('m4t_c'); }catch(_){} $('#app').innerHTML='<div class="empty">Este link no es válido o fue cambiado. Pide uno nuevo a Alex.</div>'; }
      else { $('#app').innerHTML='<div class="empty">Sin señal o sin conexión con el servidor.<br><br><button class="p" data-a="reintentar">Volver a intentar</button></div>'; } }
    return; }
  if(enApp()){ pantallaLink(); return; }
  pantallaClave();
}
iniciar();
}
</script>
