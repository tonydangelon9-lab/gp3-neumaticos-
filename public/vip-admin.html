<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⭐ Admin VIP — GP3 Sports LATAM</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--red:#E8001D;--bg:#f4f5f8;--card:#fff;--bd:#e3e5ec;--bd2:#d2d5e0;--tx:#16161d;--gr:#5c5c70;--gr2:#9a9ab0;--gn:#00a884;--or:#ef6c00;--yl:#c8920a}
  html,body{min-height:100%;background:var(--bg);font-family:'Barlow',sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased}
  .wrap{max-width:920px;margin:0 auto;padding:18px 14px 70px}
  .cond{font-family:'Barlow Condensed',sans-serif}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .logo{display:flex;align-items:center}
  .gp{background:#0a0a0f;color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;padding:2px 8px;border-radius:6px 0 0 6px;line-height:1}
  .g3{background:var(--red);color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:27px;padding:0 8px;border-radius:0 6px 6px 0;transform:skewX(-6deg);margin-left:-3px;line-height:1}
  .g3 span{display:inline-block;transform:skewX(6deg)}
  h1{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:-.5px;line-height:1}
  .sub{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--red);font-weight:800;font-family:'Barlow Condensed',sans-serif;margin-top:2px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid transparent;border-radius:9px;padding:11px 16px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:pointer;background:var(--red);color:#fff;transition:transform .1s,opacity .15s}
  .btn:active{transform:scale(.98)}
  .btn.o{background:transparent;border-color:var(--bd2);color:var(--gr)}
  .btn.gn{background:var(--gn)}
  .btn.sm{padding:7px 11px;font-size:12px;border-radius:7px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:13px;overflow:hidden;margin-bottom:13px}
  .ch{padding:11px 15px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .dot{width:14px;height:14px;border-radius:4px;flex-shrink:0;border:1px solid rgba(0,0,0,.15)}
  .ctit{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:800;letter-spacing:.3px}
  .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;font-family:'Barlow Condensed',sans-serif}
  .bON{background:rgba(0,168,132,.13);color:var(--gn);border:1px solid rgba(0,168,132,.3)}
  .bOFF{background:rgba(154,154,176,.15);color:var(--gr2);border:1px solid var(--bd2)}
  .cb{padding:13px 15px;font-size:13px;color:var(--gr);line-height:1.7}
  .cb b{color:var(--tx)}
  .cact{padding:11px 15px;border-top:1px solid var(--bd);display:flex;gap:8px;flex-wrap:wrap}
  .link{flex:1;min-width:180px;background:var(--bg);border:1px dashed var(--bd2);border-radius:8px;padding:8px 11px;font-size:12px;color:var(--gr);font-family:'Barlow',monospace;word-break:break-all;display:flex;align-items:center}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:9px;padding:13px 15px}
  .stat{background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:9px 11px;border-top:2px solid var(--red)}
  .stat .v{font-family:'Barlow Condensed',sans-serif;font-size:23px;font-weight:900;line-height:1}
  .stat .l{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--gr);margin-top:3px;font-family:'Barlow Condensed',sans-serif}
  input,select{background:var(--bg);border:1px solid var(--bd2);color:var(--tx);border-radius:9px;padding:11px 13px;font-size:15px;outline:none;width:100%;font-family:'Barlow',sans-serif}
  input:focus,select:focus{border-color:var(--red)}
  label{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--gr);font-weight:700;font-family:'Barlow Condensed',sans-serif;margin-bottom:5px;display:block}
  .fld{margin-bottom:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--gr);font-family:'Barlow Condensed',sans-serif;padding:8px 10px;border-bottom:1px solid var(--bd)}
  td{padding:9px 10px;font-size:13px;border-bottom:1px solid var(--bd);vertical-align:middle}
  .code{font-family:'Barlow',monospace;font-size:11px;color:var(--gr);background:var(--bg);padding:2px 6px;border-radius:5px}
  .x{cursor:pointer;color:var(--gr2);font-weight:900;font-size:15px;padding:2px 7px;border-radius:5px}
  .x:hover{color:var(--red);background:rgba(232,0,29,.08)}
  .empty{padding:30px;text-align:center;color:var(--gr2);font-size:14px}
  .ov{position:fixed;inset:0;background:rgba(10,10,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;z-index:50;overflow-y:auto}
  .modal{background:var(--card);border:1px solid var(--bd);border-radius:15px;width:100%;max-width:460px;overflow:hidden;animation:up .25s ease}
  @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .mh{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
  .mb{padding:18px}
  .clr{display:flex;gap:8px;align-items:center}
  .clr input[type=color]{width:46px;height:42px;padding:2px;border-radius:9px;flex-shrink:0;cursor:pointer}
  .err{color:var(--red);font-size:13px;margin:4px 0 0;font-weight:600;min-height:16px}
  .gate{max-width:340px;margin:14vh auto 0;text-align:center}
  .gate input{text-align:center;font-size:24px;letter-spacing:8px;font-family:'Barlow Condensed',sans-serif}
  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--gn);color:#fff;padding:10px 18px;border-radius:9px;font-family:'Barlow Condensed',sans-serif;font-weight:800;letter-spacing:1px;z-index:99;box-shadow:0 8px 28px rgba(0,0,0,.25);animation:up .2s ease}
  .spin{width:30px;height:30px;border:3px solid var(--bd);border-top-color:var(--red);border-radius:50%;margin:40px auto;animation:rot .8s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  .back{background:none;border:0;color:var(--gr);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:14px;cursor:pointer;padding:6px 0;letter-spacing:.5px}
  .srch{margin:0 0 12px}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}.hideM{display:none}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="spin"></div></div>
<div id="overlay"></div>
<div id="toastbox"></div>

<script>
const SHEETS_URL = "https://script.google.com/macros/s/AKfycbxh0cN7SV9tZtR0bgvZH6ysGzxQgApFiKn7O4C9mN7HUV8h3hWpLbq2fqYbw5XV1Jk3/exec";
const PIN = "270913";

const app = document.getElementById('app');
const overlay = document.getElementById('overlay');
let SPONSORS = [];
let COUNTS = {};         // id -> {total,d1,d2,d3}
let VIEW = {mode:'list'};
let MON = {regs:[], q:'', timer:null};

function esc(s){ return (""+(s==null?"":s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function baseDir(){ return location.origin + location.pathname.replace(/[^/]*$/, ''); }
function publicLink(id){ return baseDir() + 'vip.html?id=' + encodeURIComponent(id); }
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.getElementById('toastbox').appendChild(t); setTimeout(()=>t.remove(),1900); }
async function post(p){ try{ await fetch(SHEETS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});}catch(e){} }
async function getJSON(qs){ const sep=qs.indexOf('?')<0?'?':'&'; const r=await fetch(SHEETS_URL+qs+sep+'t='+Date.now()); return r.json(); }
function copy(txt){ if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>toast('Link copiado ✓'),()=>prompt('Copiá el link:',txt));} else prompt('Copiá el link:',txt); }

/* ───────────── PIN gate ───────────── */
function gate(){
  app.innerHTML =
    '<div class="gate"><div class="logo" style="justify-content:center;margin-bottom:18px"><span class="gp">GP</span><span class="g3"><span>3</span></span></div>'+
    '<h1 style="margin-bottom:4px">Admin VIP</h1>'+
    '<div class="sub" style="margin-bottom:22px">Acceso restringido</div>'+
    '<input id="pin" type="password" inputmode="numeric" placeholder="••••••" maxlength="6">'+
    '<div class="err" id="perr"></div>'+
    '<button class="btn" style="width:100%;margin-top:10px" id="pbtn">Entrar</button></div>';
  const go=()=>{ if(document.getElementById('pin').value===PIN){ sessionStorage.setItem('vipadmin','1'); boot(); } else { document.getElementById('perr').textContent='PIN incorrecto'; } };
  document.getElementById('pbtn').onclick=go;
  document.getElementById('pin').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  document.getElementById('pin').focus();
}

/* ───────────── carga ───────────── */
async function boot(){
  app.innerHTML='<div class="spin"></div>';
  try{
    const j = await getJSON('?tipo=vip_sponsors');
    SPONSORS = j.sponsors || [];
    // contar invitados de cada sponsor en paralelo
    await Promise.all(SPONSORS.map(async sp=>{
      try{ const r=await getJSON('?tipo=vip_reg&id='+encodeURIComponent(sp.id)); COUNTS[sp.id]=resumen(r.registros||[]); }
      catch(e){ COUNTS[sp.id]={total:0,d1:0,d2:0,d3:0}; }
    }));
    renderList();
  }catch(e){
    app.innerHTML='<div class="card"><div class="empty">No se pudo conectar con la planilla.<br><br><button class="btn o" onclick="boot()">Reintentar</button></div></div>';
  }
}
function resumen(regs){ let d1=0,d2=0,d3=0; regs.forEach(r=>{ if(r.d1)d1++; if(r.d2)d2++; if(r.d3)d3++; }); return {total:regs.length,d1,d2,d3}; }

/* ───────────── vista LISTA de sponsors ───────────── */
function renderList(){
  VIEW={mode:'list'};
  let cards = SPONSORS.map(sp=>{
    const c = COUNTS[sp.id]||{total:0};
    const cupo = (sp.cupo_dia&&sp.cupo_dia>0)? (sp.cupo_dia+' por día') : 'Sin tope';
    return ''+
    '<div class="card">'+
      '<div class="ch"><span class="dot" style="background:'+esc(sp.color)+'"></span>'+
        '<span class="ctit">'+esc(sp.nombre)+'</span>'+
        '<span class="badge '+(sp.activo?'bON':'bOFF')+'">'+(sp.activo?'Activo':'Inactivo')+'</span>'+
        '<span style="margin-left:auto;font-family:\'Barlow Condensed\',sans-serif;font-weight:900;font-size:20px;color:'+esc(sp.color)+'">'+c.total+'</span>'+
        '<span style="font-size:10px;color:var(--gr);text-transform:uppercase;letter-spacing:1px">invit.</span>'+
      '</div>'+
      '<div class="cb"><b>Evento:</b> '+esc(sp.evento||'—')+' &nbsp;·&nbsp; <b>Lugar:</b> '+esc(sp.lugar||'—')+'<br>'+
        '<b>Cupo:</b> '+cupo+' &nbsp;·&nbsp; <b>Días:</b> '+(sp.dias&&sp.dias.length?esc(sp.dias.join(' · ')):'—')+' &nbsp;·&nbsp; <b>ID:</b> <span class="code">'+esc(sp.id)+'</span></div>'+
      '<div class="cact">'+
        '<div class="link" title="Link público">'+esc(publicLink(sp.id))+'</div>'+
        '<button class="btn sm o" onclick="copy(publicLink(\''+esc(sp.id)+'\'))">⧉ Copiar link</button>'+
      '</div>'+
      '<div class="cact" style="border-top:0;padding-top:0">'+
        '<button class="btn sm" onclick="openMonitor(\''+esc(sp.id)+'\')">👥 Ver invitados</button>'+
        '<button class="btn sm o" onclick="openForm(\''+esc(sp.id)+'\')">✎ Editar</button>'+
        '<button class="btn sm o" style="margin-left:auto;border-color:rgba(232,0,29,.4);color:var(--red)" onclick="delSponsor(\''+esc(sp.id)+'\')">🗑 Borrar</button>'+
      '</div>'+
    '</div>';
  }).join('');
  if(!SPONSORS.length) cards='<div class="card"><div class="empty">Todavía no hay sponsors. Creá el primero. 👇</div></div>';

  app.innerHTML =
    '<div class="top">'+
      '<div class="logo"><span class="gp">GP</span><span class="g3"><span>3</span></span></div>'+
      '<div><h1>Admin VIP</h1><div class="sub">Sponsors autoadministrables</div></div>'+
      '<div style="margin-left:auto;display:flex;gap:8px">'+
        '<button class="btn o sm" onclick="boot()">↻ Actualizar</button>'+
        '<button class="btn" onclick="openForm()">+ Nuevo sponsor</button>'+
      '</div>'+
    '</div>'+ cards;
}

/* ───────────── modal crear/editar sponsor ───────────── */
function openForm(id){
  const sp = id ? SPONSORS.find(s=>s.id===id) : null;
  const e = sp || {id:'',nombre:'',color:'#E3B84B',evento:'',lugar:'',cupo_dia:0,dias:['','',''],activo:true};
  const d = (e.dias||[]).concat(['','','']).slice(0,3);
  overlay.innerHTML =
    '<div class="ov" onclick="if(event.target===this)closeOv()"><div class="modal">'+
      '<div class="mh"><span class="cond" style="font-size:18px;font-weight:900">'+(sp?'Editar sponsor':'Nuevo sponsor')+'</span><span class="x" onclick="closeOv()">✕</span></div>'+
      '<div class="mb">'+
        '<div class="grid2">'+
          '<div class="fld"><label>ID (sin espacios)</label><input id="s_id" value="'+esc(e.id)+'" '+(sp?'disabled style="opacity:.6"':'placeholder="ej. mobil"')+'></div>'+
          '<div class="fld"><label>Color</label><div class="clr"><input type="color" id="s_color" value="'+esc(e.color||'#E3B84B')+'"><input id="s_colorx" value="'+esc(e.color||'#E3B84B')+'"></div></div>'+
        '</div>'+
        '<div class="fld"><label>Nombre del sponsor</label><input id="s_nombre" value="'+esc(e.nombre)+'" placeholder="Ej. Mobil"></div>'+
        '<div class="fld"><label>Evento</label><input id="s_evento" value="'+esc(e.evento)+'" placeholder="Ej. Mobil — Concordia 2026"></div>'+
        '<div class="grid2">'+
          '<div class="fld"><label>Lugar</label><input id="s_lugar" value="'+esc(e.lugar)+'" placeholder="Autódromo de..."></div>'+
          '<div class="fld"><label>Cupo por día (0 = sin tope)</label><input id="s_cupo" type="number" min="0" value="'+(e.cupo_dia||0)+'"></div>'+
        '</div>'+
        '<label>Días de la fecha</label>'+
        '<div class="grid2" style="grid-template-columns:1fr 1fr 1fr;gap:8px">'+
          '<input id="s_d1" value="'+esc(d[0])+'" placeholder="Día 1">'+
          '<input id="s_d2" value="'+esc(d[1])+'" placeholder="Día 2">'+
          '<input id="s_d3" value="'+esc(d[2])+'" placeholder="Día 3">'+
        '</div>'+
        '<label style="display:flex;align-items:center;gap:9px;margin-top:14px;cursor:pointer"><input type="checkbox" id="s_activo" '+(e.activo?'checked':'')+' style="width:auto"> <span style="font-size:13px;color:var(--tx);text-transform:none;letter-spacing:0;font-weight:600">Registro abierto (activo)</span></label>'+
        '<div class="err" id="serr"></div>'+
        '<button class="btn" style="width:100%;margin-top:8px" id="sbtn">'+(sp?'Guardar cambios':'Crear sponsor')+'</button>'+
      '</div>'+
    '</div></div>';
  const cp=document.getElementById('s_color'), cx=document.getElementById('s_colorx');
  cp.oninput=()=>cx.value=cp.value; cx.oninput=()=>{ if(/^#[0-9a-fA-F]{6}$/.test(cx.value)) cp.value=cx.value; };
  document.getElementById('sbtn').onclick=()=>saveSponsor(!!sp);
}
function closeOv(){ overlay.innerHTML=''; }

async function saveSponsor(isEdit){
  const id=(document.getElementById('s_id').value||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'');
  const nombre=(document.getElementById('s_nombre').value||'').trim();
  const err=document.getElementById('serr'); err.textContent='';
  if(!id){ err.textContent='Poné un ID (ej. mobil).'; return; }
  if(!nombre){ err.textContent='Poné el nombre del sponsor.'; return; }
  if(!isEdit && SPONSORS.some(s=>s.id===id)){ err.textContent='Ya existe un sponsor con ese ID.'; return; }
  const sponsor={ id, nombre, color:document.getElementById('s_colorx').value||'#888888',
    evento:(document.getElementById('s_evento').value||'').trim(),
    lugar:(document.getElementById('s_lugar').value||'').trim(),
    cupo_dia:parseInt(document.getElementById('s_cupo').value||'0',10)||0,
    dias:[document.getElementById('s_d1').value,document.getElementById('s_d2').value,document.getElementById('s_d3').value].map(x=>(x||'').trim()).filter(x=>x),
    activo:document.getElementById('s_activo').checked };
  document.getElementById('sbtn').disabled=true; document.getElementById('sbtn').textContent='Guardando...';
  await post({type:'vip_sponsor_save', sponsor});
  closeOv();
  toast(isEdit?'Sponsor actualizado ✓':'Sponsor creado ✓');
  setTimeout(boot, 1400);
}

async function delSponsor(id){
  const sp=SPONSORS.find(s=>s.id===id); if(!sp) return;
  const pin=prompt('Para borrar "'+sp.nombre+'" ingresá el PIN.\n(No se borran los invitados ya cargados, solo el sponsor.)');
  if(pin===null) return;
  if(pin!==PIN){ toast('PIN incorrecto'); return; }
  await post({type:'vip_sponsor_delete', id});
  toast('Sponsor borrado ✓');
  setTimeout(boot, 1400);
}

/* ───────────── monitor de invitados ───────────── */
async function openMonitor(id){
  const sp=SPONSORS.find(s=>s.id===id); if(!sp) return;
  VIEW={mode:'monitor', id};
  MON={regs:[], q:'', timer:null};
  app.innerHTML='<button class="back" onclick="renderList()">‹ Volver a sponsors</button><div class="spin"></div>';
  await loadMon(sp);
  if(MON.timer) clearInterval(MON.timer);
  MON.timer=setInterval(()=>{ if(VIEW.mode==='monitor'&&VIEW.id===id) loadMon(sp,true); }, 30000);
}
async function loadMon(sp, silent){
  try{
    const j=await getJSON('?tipo=vip_reg&id='+encodeURIComponent(sp.id));
    MON.regs=j.registros||[];
    COUNTS[sp.id]=resumen(MON.regs);
    renderMon(sp);
  }catch(e){ if(!silent) app.innerHTML='<button class="back" onclick="renderList()">‹ Volver</button><div class="card"><div class="empty">No se pudieron cargar los invitados.</div></div>'; }
}
function renderMon(sp){
  const d=(sp.dias||[]).concat(['Día 1','Día 2','Día 3']).slice(0,3);
  const r=resumen(MON.regs);
  const q=MON.q.trim().toLowerCase();
  const filt = q ? MON.regs.filter(x=>((x.nombre||'')+' '+(x.email||'')+' '+(x.vip_code||'')).toLowerCase().includes(q)) : MON.regs;
  let rows = filt.map(x=>{
    const dd=[x.d1?d[0]:'',x.d2?d[1]:'',x.d3?d[2]:''].filter(Boolean).join(', ');
    return '<tr><td><b>'+esc(x.nombre)+'</b></td><td class="hideM">'+esc(x.email||'—')+'</td><td>'+esc(dd||'—')+'</td><td><span class="code">'+esc(x.vip_code||'—')+'</span></td><td style="text-align:right"><span class="x" onclick="delReg(\''+esc(sp.id)+'\',\''+esc(x.id)+'\')">✕</span></td></tr>';
  }).join('');
  if(!filt.length) rows='<tr><td colspan="5"><div class="empty" style="padding:22px">'+(q?'Sin resultados.':'Todavía no hay invitados cargados.')+'</div></td></tr>';

  app.innerHTML =
    '<button class="back" onclick="renderList()">‹ Volver a sponsors</button>'+
    '<div class="top" style="margin-top:6px"><span class="dot" style="background:'+esc(sp.color)+';width:18px;height:18px"></span>'+
      '<div><h1>'+esc(sp.nombre)+'</h1><div class="sub">Invitados VIP · en vivo</div></div>'+
      '<div style="margin-left:auto;display:flex;gap:8px">'+
        '<button class="btn o sm" onclick="copy(publicLink(\''+esc(sp.id)+'\'))">⧉ Link público</button>'+
        '<button class="btn o sm" onclick="loadMon(SPONSORS.find(s=>s.id===\''+esc(sp.id)+'\'))">↻</button>'+
      '</div></div>'+
    '<div class="card"><div class="stats">'+
      '<div class="stat" style="border-top-color:'+esc(sp.color)+'"><div class="v">'+r.total+'</div><div class="l">Invitados</div></div>'+
      '<div class="stat"><div class="v">'+r.d1+'</div><div class="l">'+esc(d[0])+'</div></div>'+
      '<div class="stat"><div class="v">'+r.d2+'</div><div class="l">'+esc(d[1])+'</div></div>'+
      '<div class="stat"><div class="v">'+r.d3+'</div><div class="l">'+esc(d[2])+'</div></div>'+
    '</div></div>'+
    '<input class="srch" id="msrch" placeholder="🔎 Buscar por nombre, email o código..." value="'+esc(MON.q)+'">'+
    '<div class="card"><table><thead><tr><th>Invitado</th><th class="hideM">Email</th><th>Días</th><th>Código QR</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  const s=document.getElementById('msrch');
  s.oninput=()=>{ MON.q=s.value; const pos=s.selectionStart; renderMon(sp); const n=document.getElementById('msrch'); n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} };
}
async function delReg(spId,regId){
  if(!confirm('¿Borrar este invitado? Su QR dejará de ser válido.')) return;
  MON.regs=MON.regs.filter(x=>x.id!==regId);
  const sp=SPONSORS.find(s=>s.id===spId);
  renderMon(sp);
  await post({type:'vip_reg_delete', sponsor_id:spId, id:regId});
  toast('Invitado borrado ✓');
  setTimeout(()=>loadMon(sp,true), 1500);
}

/* ───────────── arranque ───────────── */
if(sessionStorage.getItem('vipadmin')==='1') boot(); else gate();
</script>
