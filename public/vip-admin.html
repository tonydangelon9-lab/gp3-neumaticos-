<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Administración VIP · GP3 Sports LATAM</title>
<meta name="theme-color" content="#0A0E1C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0E1C;--bg2:#111733;--card:#131A36;--card2:#0F1530;--border:#243150;--red:#E8001D;--gold:#E3B84B;--cy:#2BB0E8;--green:#16c79a;--gray:#8a96b8;--gray2:#5d6a92;--txt:#fff;--ff:'Barlow',sans-serif;--fc:'Barlow Condensed',sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:var(--ff)}
.wrap{max-width:720px;margin:0 auto;background:linear-gradient(180deg,#0E1430,#0A0E1C 60%);min-height:100vh;padding:calc(env(safe-area-inset-top) + 18px) 16px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:inline-flex;align-items:center}
.logo .gp{background:#fff;color:#0a0a0f;font-family:var(--fc);font-size:24px;font-weight:900;letter-spacing:-1px;padding:2px 8px;border-radius:6px 0 0 6px;line-height:1}
.logo .n3{background:var(--red);color:#fff;font-family:var(--fc);font-size:30px;font-weight:900;letter-spacing:-2px;padding:0 8px;border-radius:0 6px 6px 0;line-height:1;display:flex;align-items:center}
.live{display:inline-flex;align-items:center;gap:6px;background:rgba(232,0,29,.14);border:1px solid rgba(232,0,29,.4);color:#fff;font-size:11px;font-weight:700;letter-spacing:1.5px;padding:5px 10px;border-radius:20px;font-family:var(--fc)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:p 1.4s infinite}
@keyframes p{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
.ttl{margin:18px 0 2px}
.ttl .e{color:var(--gold);font-size:11px;font-weight:700;letter-spacing:4px;font-family:var(--fc)}
.ttl h1{font-size:25px;font-weight:800;letter-spacing:.3px;font-family:var(--fc)}
.upd{font-size:11px;color:#6c7794;margin-top:4px}
.pills{display:flex;gap:7px;overflow-x:auto;padding:14px 0 6px}
.pill{flex:0 0 auto;border:1.5px solid var(--border);background:var(--card2);color:var(--txt);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:var(--ff);display:flex;align-items:center;gap:7px}
.pill.on{background:var(--red);border-color:var(--red)}
.pill .c{font-family:var(--fc);font-weight:900;font-size:14px;opacity:.95}
.pill.on .c{color:#fff}
.grid{display:flex;gap:8px;margin:14px 0}
.st{flex:1;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 6px;text-align:center}
.st .n{font-size:30px;font-weight:900;line-height:1;font-family:var(--fc)}
.st .l{font-size:10px;color:#8fa0bd;letter-spacing:1px;margin-top:5px;text-transform:uppercase;font-family:var(--fc)}
.st.tot{border-color:var(--gold);background:linear-gradient(135deg,rgba(227,184,75,.16),rgba(227,184,75,.03))}
.st.tot .n{color:var(--gold)}
.st .n.cy{color:var(--cy)}
.search{display:flex;gap:8px;align-items:center;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:4px 12px;margin:6px 0 4px}
.search input{flex:1;background:transparent;border:none;color:#fff;font-size:15px;outline:none;padding:10px 0;font-family:var(--ff)}
.search .ic{color:var(--gray);font-size:15px}
.sec{font-size:11px;color:#8fa0bd;letter-spacing:2px;text-transform:uppercase;margin:16px 2px 10px;font-weight:700;font-family:var(--fc)}
.row{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:9px;display:flex;align-items:center;gap:10px}
.row .mid{flex:1;min-width:0}
.row .nm{font-weight:700;font-size:15px}
.row .meta{font-size:11.5px;color:#8fa0bd;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:10px;font-weight:800;border-radius:5px;padding:2px 7px;margin:3px 4px 0 0;font-family:var(--fc);letter-spacing:.5px}
.tag.dia{background:rgba(43,176,232,.16);color:#7fd0f3;border:1px solid rgba(43,176,232,.4)}
.tag.honda{background:rgba(232,0,29,.16);color:#ff8a96;border:1px solid rgba(232,0,29,.45)}
.tag.mobil{background:rgba(43,143,208,.16);color:#8cc8f0;border:1px solid rgba(43,143,208,.45)}
.tag.gp3{background:rgba(227,184,75,.16);color:#f0d588;border:1px solid rgba(227,184,75,.45)}
.tag.otro{background:rgba(138,150,184,.16);color:#b9c2da;border:1px solid rgba(138,150,184,.4)}
.del{background:transparent;border:1px solid #ED5565;color:#ED5565;border-radius:8px;padding:8px 11px;font-size:14px;cursor:pointer;font-weight:700}
.empty{text-align:center;color:#6c7794;padding:30px;font-size:14px}
.ctrl{display:flex;gap:8px;align-items:center;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:9px 11px;margin-top:8px}
.ctrl input{flex:1;background:#0A1430;border:1px solid #2c4474;border-radius:7px;padding:10px;color:#fff;font-size:14px;outline:none}
.ctrl button{background:var(--red);border:none;color:#fff;border-radius:7px;padding:10px 16px;font-weight:800;font-size:13px;cursor:pointer;font-family:var(--fc);letter-spacing:1px}
.ctrl.on{border-color:var(--gold);background:rgba(227,184,75,.1)}
.ctrl .lock{font-size:12px;color:#8fa0bd}
.diag{font-size:11px;color:#6c7794;background:var(--card2);border:1px dashed var(--border);border-radius:9px;padding:9px 11px;margin-top:10px;line-height:1.5}
.foot{text-align:center;font-size:10px;color:#6c7794;letter-spacing:1.5px;margin-top:24px;text-transform:uppercase;font-family:var(--fc)}
</style></head><body><div class="wrap">

  <div class="top">
    <div class="logo"><span class="gp">GP</span><span class="n3">3</span></div>
    <div><span class="live"><span class="dot"></span>EN VIVO</span><div class="upd" id="upd">Cargando…</div></div>
  </div>

  <div class="ttl">
    <div class="e">ADMINISTRACIÓN VIP</div>
    <h1>Invitados VIP · CAV 2026</h1>
  </div>

  <div class="pills" id="pills"></div>

  <div class="grid" id="stats"></div>

  <div class="search">
    <span class="ic">🔎</span>
    <input id="q" type="text" placeholder="Buscar por nombre o email…" oninput="render()">
  </div>

  <div class="ctrl" id="ctrl">
    <span class="lock">🔒</span>
    <input id="pin" type="password" inputmode="numeric" placeholder="PIN de control (para borrar)">
    <button onclick="unlock()">Entrar</button>
  </div>

  <div class="sec" id="secLbl">Lista de invitados</div>
  <div id="lista"><div class="empty">Cargando…</div></div>

  <div class="diag" id="diag" style="display:none"></div>

  <div class="foot">GP3 Sports LATAM · CAV 2026 · Panel de invitados VIP</div>
</div>

<script>
var URL="https://script.google.com/macros/s/AKfycbxh0cN7SV9tZtR0bgvZH6ysGzxQgApFiKn7O4C9mN7HUV8h3hWpLbq2fqYbw5XV1Jk3/exec";
var ADMIN_PIN="270913";
var admin=false, datos=[], SP_KEY=null, DIAS=[], SEL="todos";

function jsonp(u,cb){var n='cb_'+Math.random().toString(36).slice(2);var s=document.createElement('script');var done=false;
  window[n]=function(d){done=true;try{cb(d);}finally{cl();}};
  function cl(){try{delete window[n];}catch(e){}if(s.parentNode)s.parentNode.removeChild(s);}
  s.onerror=function(){if(!done){cb(null);cl();}};
  s.src=u+(u.indexOf('?')>-1?'&':'?')+'callback='+n+'&t='+Date.now();document.body.appendChild(s);
  setTimeout(function(){if(!done){cb(null);cl();}},15000);}
function hora(){var d=new Date();function z(x){return(x<10?'0':'')+x;}return z(d.getHours())+':'+z(d.getMinutes())+':'+z(d.getSeconds());}
function esc(s){return (s==null?'':s).toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── detectar sponsor y días automáticamente ──
var SPONSOR_KEYS=["sponsor","tipo","origen","programa","vip_tipo","empresa","marca","categoria"];
function detectSponsorKey(rows){
  for(var i=0;i<SPONSOR_KEYS.length;i++){var k=SPONSOR_KEYS[i];
    if(rows.some(function(r){return (r[k]!=null&&(''+r[k]).trim()!=='');})) return k;}
  return null;
}
function detectDias(rows){
  var set={};rows.forEach(function(r){Object.keys(r).forEach(function(k){if(/^d\d{1,2}$/.test(k))set[k]=1;});});
  return Object.keys(set).sort(function(a,b){return (+a.slice(1))-(+b.slice(1));});
}
function spLabel(v){v=(''+(v||'')).toLowerCase();
  if(v.indexOf('honda')>-1)return 'Honda';
  if(v.indexOf('mobil')>-1)return 'Mobil';
  if(v.indexOf('gp3')>-1||v.indexOf('gp 3')>-1||v.indexOf('sports')>-1)return 'GP3 Sports';
  if(!v.trim())return 'Sin clasificar';
  return v.charAt(0).toUpperCase()+v.slice(1);
}
function spClass(label){var l=label.toLowerCase();
  if(l==='honda')return 'honda';if(l==='mobil')return 'mobil';if(l==='gp3 sports')return 'gp3';return 'otro';}
function spOf(r){return SP_KEY?spLabel(r[SP_KEY]):'Sin clasificar';}

function unlock(){var p=(document.getElementById('pin').value||'').trim();
  if(p===ADMIN_PIN){admin=true;var c=document.getElementById('ctrl');c.classList.add('on');
    c.innerHTML='<span class="lock">🔓 Modo control activo — ya podés borrar invitados</span>';render();}
  else{document.getElementById('pin').value='';document.getElementById('pin').placeholder='PIN incorrecto';}}

function borrar(id,nombre){if(!confirm('¿Borrar a '+nombre+' de la lista VIP?'))return;
  try{fetch(URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'vip_delete',id:id})});}catch(e){}
  datos=datos.filter(function(x){return x.id!==id;});render();setTimeout(cargar,1500);}

function buildPills(){
  var counts={};datos.forEach(function(r){var s=spOf(r);counts[s]=(counts[s]||0)+1;});
  var orden=['Honda','Mobil','GP3 Sports'];
  var keys=Object.keys(counts).sort(function(a,b){var ia=orden.indexOf(a),ib=orden.indexOf(b);
    if(ia<0)ia=99;if(ib<0)ib=99;return ia-ib||a.localeCompare(b);});
  var html='<button class="pill'+(SEL==='todos'?' on':'')+'" onclick="setSel(\'todos\')">Todos <span class="c">'+datos.length+'</span></button>';
  keys.forEach(function(k){
    html+='<button class="pill'+(SEL===k?' on':'')+'" onclick="setSel(\''+k.replace(/'/g,"")+'\')">'+esc(k)+' <span class="c">'+counts[k]+'</span></button>';
  });
  document.getElementById('pills').innerHTML=html;
}
function setSel(s){SEL=s;render();}

function visibles(){
  var q=(document.getElementById('q').value||'').toLowerCase().trim();
  return datos.filter(function(r){
    if(SEL!=='todos' && spOf(r)!==SEL) return false;
    if(q){var hay=((r.nombre||'')+' '+(r.email||'')+' '+(r.telefono||'')).toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;
  });
}

function buildStats(vis){
  var html='<div class="st tot"><div class="n">'+vis.length+'</div><div class="l">'+(SEL==='todos'?'Total VIP':esc(SEL))+'</div></div>';
  var dd=DIAS.slice(0,4);
  if(dd.length){
    dd.forEach(function(k){var c=vis.filter(function(r){return r[k];}).length;
      html+='<div class="st"><div class="n cy">'+c+'</div><div class="l">Día '+k.slice(1)+'</div></div>';});
  }else{
    var cmail=vis.filter(function(r){return (r.email||'').trim();}).length;
    html+='<div class="st"><div class="n cy">'+cmail+'</div><div class="l">Con email</div></div>';
  }
  document.getElementById('stats').innerHTML=html;
}

function render(){
  buildPills();
  var vis=visibles();
  buildStats(vis);
  document.getElementById('secLbl').textContent='Lista de invitados ('+vis.length+')';
  if(!datos.length){document.getElementById('lista').innerHTML='<div class="empty">Todavía no hay invitados VIP confirmados.</div>';return;}
  if(!vis.length){document.getElementById('lista').innerHTML='<div class="empty">Ningún invitado coincide con el filtro.</div>';return;}
  var h='';
  vis.slice().reverse().forEach(function(x){
    var sp=spOf(x);
    var tags='<span class="tag '+spClass(sp)+'">'+esc(sp)+'</span>';
    DIAS.forEach(function(k){if(x[k])tags+='<span class="tag dia">DÍA '+k.slice(1)+'</span>';});
    var meta=esc(x.email||'')+(x.telefono?(' · '+esc(x.telefono)):'');
    h+='<div class="row"><div class="mid"><div class="nm">'+esc(x.nombre||x.apellido||'—')+'</div>'
      +'<div style="margin-top:2px">'+tags+'</div>'
      +(meta?'<div class="meta">'+meta+'</div>':'')+'</div>'
      +(admin?('<button class="del" onclick="borrar(\''+esc(x.id)+'\',\''+esc((x.nombre||'').replace(/[\\\\\'\"]/g,""))+'\')">🗑</button>'):'')
      +'</div>';
  });
  document.getElementById('lista').innerHTML=h;

  // diagnóstico: si no se detectó sponsor, mostrar qué campos llegan
  var diag=document.getElementById('diag');
  if(!SP_KEY && datos.length){
    var campos=Object.keys(datos[0]).join(', ');
    diag.style.display='';
    diag.innerHTML='ℹ️ No se detectó un campo de sponsor en los datos, así que se muestran todos juntos. '
      +'Los campos que llegan de la planilla son: <b>'+esc(campos)+'</b>. '
      +'Decime cuál identifica el sponsor (Honda/Mobil/GP3) y lo activo como filtro.';
  }else{diag.style.display='none';}
}

function cargar(){document.getElementById('upd').textContent='Actualizando…';
  jsonp(URL+'?tipo=vip',function(d){
    if(d&&d.ok&&Array.isArray(d.vip)){
      datos=d.vip;
      SP_KEY=detectSponsorKey(datos);
      DIAS=detectDias(datos);
      render();
      document.getElementById('upd').textContent='Actualizado '+hora();
    }else{document.getElementById('upd').textContent='Sin conexión — reintentando…';}
  });}
cargar();setInterval(cargar,30000);
</script></body></html>
