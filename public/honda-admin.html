<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#CC0000">
<title>Panel VIP Honda · Gran Premio Mobil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--red:#CC0000;--red-d:#A30000;--ink:#161616;--muted:#6c6c6c;--line:#e8e8e8;--field:#f5f5f5;--bg:#ececed;}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Barlow',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding:16px}
  .cond{font-family:'Barlow Condensed',sans-serif}
  /* LOGIN */
  .login{max-width:360px;margin:8vh auto 0;background:#fff;border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.12);overflow:hidden;text-align:center}
  .login .bar{height:7px;background:var(--red)}
  .login .in{padding:30px 28px 32px}
  .login img{width:96px;height:96px;object-fit:contain;margin:0 auto 6px;display:block}
  .login h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:23px;margin:4px 0 2px}
  .login .sub{color:var(--muted);font-size:13px;margin:0 0 20px}
  .pin{width:100%;background:var(--field);border:1.5px solid transparent;border-radius:11px;padding:14px;font-size:20px;text-align:center;letter-spacing:6px;outline:none;font-family:'Barlow',sans-serif}
  .pin:focus{border-color:var(--red);background:#fff}
  .pin.err{border-color:var(--red);background:#fff6f6}
  .btn{width:100%;margin-top:14px;background:var(--red);color:#fff;border:none;border-radius:12px;padding:15px;font-size:14px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:2px}
  .btn:hover{background:var(--red-d)}
  /* PANEL */
  .panel{display:none;max-width:640px;margin:0 auto}
  .panel.show{display:block}
  .top{background:#fff;border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.08);padding:16px 18px;display:flex;align-items:center;gap:12px;margin-bottom:14px;position:sticky;top:8px;z-index:5}
  .top img{width:42px;height:42px;object-fit:contain}
  .top .t{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:18px;line-height:1}
  .top .s{font-size:12px;color:var(--muted)}
  .count{margin-left:auto;background:var(--red);color:#fff;border-radius:20px;padding:6px 14px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px}
  .refresh{background:var(--field);border:none;border-radius:10px;width:40px;height:40px;cursor:pointer;font-size:17px;color:#444}
  .refresh:hover{background:#ececec}
  .list{display:flex;flex-direction:column;gap:10px}
  .row{background:#fff;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.06);padding:15px 17px;display:flex;gap:12px;align-items:flex-start}
  .row .info{flex:1;min-width:0}
  .row .nm{font-weight:700;font-size:16px;margin:0 0 4px}
  .daypills{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 7px}
  .pill{background:#fde7e7;color:var(--red);border-radius:7px;padding:2px 9px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.5px}
  .meta{font-size:13px;color:var(--muted);line-height:1.5;word-break:break-word}
  .meta b{color:#444;font-weight:600}
  .date{font-size:11.5px;color:#aaa;margin-top:5px}
  .del{background:transparent;border:1.5px solid var(--line);color:var(--red);border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:16px;flex-shrink:0}
  .del:hover{background:#fff1f1;border-color:var(--red)}
  .state{text-align:center;color:var(--muted);padding:40px 20px;font-size:15px}
  .foot{text-align:center;color:#aaa;font-size:12px;margin:18px 0 6px}
  .foot b{color:var(--red)}
</style>
</head>

      <div>
        <div class="t">Invitados VIP Honda</div>
        <div class="s">Gran Premio Mobil · San Nicolás</div>
      </div>
      <div class="count" id="count">0</div>
      <button class="refresh" id="refresh" title="Actualizar">&#x21bb;</button>
    </div>
    <div class="list" id="list"></div>
    <div class="state" id="state">Cargando invitados...</div>
    <div class="foot">Panel privado · <b>Honda Argentina</b></div>
  </div>

<script>
  var ENDPOINT = "https://script.google.com/macros/s/AKfycbxh0cN7SV9tZtR0bgvZH6ysGzxQgApFiKn7O4C9mN7HUV8h3hWpLbq2fqYbw5XV1Jk3/exec";
  var PIN = "270913";
  var ndia = {d19:"Vie 19", d20:"Sáb 20", d21:"Dom 21"};
  var timer = null;

  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  document.getElementById('entrar').addEventListener('click', entrar);
  document.getElementById('pin').addEventListener('keydown', function(e){ if(e.key==='Enter') entrar(); });
  function entrar(){
    var el = document.getElementById('pin');
    if(el.value.trim() === PIN){
      document.getElementById('login').style.display = 'none';
      document.getElementById('panel').classList.add('show');
      cargar();
      timer = setInterval(cargar, 15000);
    } else {
      el.classList.add('err'); el.value=''; el.placeholder='PIN incorrecto';
    }
  }

  document.getElementById('refresh').addEventListener('click', cargar);

  function cargar(){
    var cb = 'cb_' + Date.now() + Math.floor(Math.random()*1000);
    window[cb] = function(json){ render(json); limpiar(cb, s); };
    var s = document.createElement('script');
    s.src = ENDPOINT + '?tipo=vip_honda&callback=' + cb + '&t=' + Date.now();
    s.onerror = function(){ var st=document.getElementById('state'); st.style.display='block'; st.textContent='No se pudo conectar. Reintentá con el botón de actualizar.'; limpiar(cb, s); };
    document.body.appendChild(s);
  }
  function limpiar(cb, s){ try{ delete window[cb]; }catch(e){ window[cb]=undefined; } if(s && s.parentNode) s.parentNode.removeChild(s); }

  function render(json){
    var list = document.getElementById('list');
    var state = document.getElementById('state');
    var arr = (json && json.vip) ? json.vip : [];
    document.getElementById('count').textContent = arr.length;
    if(!arr.length){ list.innerHTML=''; state.style.display='block'; state.textContent='Todavía no hay invitados anotados.'; return; }
    state.style.display='none';
    // más nuevos primero
    arr.reverse();
    var html = '';
    arr.forEach(function(v){
      var pills='';
      ['d19','d20','d21'].forEach(function(k){ if(v[k]) pills += '<span class="pill">'+ndia[k]+'</span>'; });
      html += '<div class="row">'+
        '<div class="info">'+
          '<div class="nm">'+esc(v.nombre)+'</div>'+
          '<div class="daypills">'+(pills||'<span class="meta">Sin días</span>')+'</div>'+
          '<div class="meta"><b>Email:</b> '+esc(v.email)+'<br><b>Tel:</b> '+esc(v.telefono)+' &nbsp;·&nbsp; <b>DNI:</b> '+esc(v.dni)+'</div>'+
          '<div class="date">Registrado: '+esc(v.fecha_registro)+'</div>'+
        '</div>'+
        '<button class="del" title="Eliminar" onclick="borrar(\''+esc(v.id)+'\')">&#x1f5d1;</button>'+
      '</div>';
    });
    list.innerHTML = html;
  }

  window.borrar = function(id){
    if(!confirm('¿Eliminar este invitado de la lista?')) return;
    fetch(ENDPOINT, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({type:'vip_honda_delete', id:id})})
      .then(function(){ setTimeout(cargar, 900); })
      .catch(function(){ setTimeout(cargar, 900); });
  };
</script>
