<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GP3 Live">
<meta name="theme-color" content="#000000">
<title>GP3 Live</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --red:#E8001D;
  --dark:#000000;
  --dark2:#0d0d0d;
  --dark3:#161616;
  --dark4:#1e1e1e;
  --border:#2a2a2a;
  --border2:#333;
  --gray:#666;
  --gray2:#999;
  --white:#ffffff;
  --green:#00e5a0;
  --orange:#ff6b00;
  --yellow:#ffd200;
}
html{height:100%;background:#000;}
body{font-family:'Barlow',sans-serif;color:#fff;min-height:100vh;background:#000;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:2px;} ::-webkit-scrollbar-thumb{background:var(--red);}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes scanline{0%{transform:translateY(-100%)}100%{transform:translateY(100vh)}}
@keyframes glow{0%,100%{box-shadow:0 0 8px var(--red)}50%{box-shadow:0 0 20px var(--red),0 0 40px var(--red)44}}
@keyframes countUp{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}

/* SCANLINE EFFECT */
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px);pointer-events:none;z-index:1000;}

/* PIN SCREEN */
.pin-screen{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:500;padding:24px;gap:32px;}
.pin-logo{width:min(260px,70vw);animation:fadeUp .8s ease both;}
.pin-card{width:min(320px,90vw);display:flex;flex-direction:column;gap:12px;}
.pin-title{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:4px;color:var(--gray);text-transform:uppercase;text-align:center;}
.pin-input{background:var(--dark3);border:1px solid var(--border2);color:#fff;border-radius:3px;padding:16px 20px;font-size:22px;outline:none;width:100%;text-align:center;font-family:'Barlow Condensed',sans-serif;letter-spacing:8px;font-weight:700;transition:border .2s;}
.pin-input:focus{border-color:var(--red);}
.pin-btn{padding:16px;background:var(--red);border:none;border-radius:3px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:900;letter-spacing:3px;cursor:pointer;text-transform:uppercase;transition:opacity .2s;}
.pin-btn:hover{opacity:.85;}
.pin-err{color:var(--red);font-size:11px;font-weight:600;text-align:center;letter-spacing:2px;font-family:'Barlow Condensed',sans-serif;}

/* MAIN APP */
#app{display:none;min-height:100vh;flex-direction:column;}

/* TOP RED LINE */
.topline{height:2px;background:var(--red);flex-shrink:0;}

/* HEADER */
header{background:#000;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0;position:sticky;top:0;z-index:100;}
.h-logo{height:32px;object-fit:contain;}
.h-right{display:flex;align-items:center;gap:10px;}
.live-pill{display:flex;align-items:center;gap:5px;background:var(--red);border-radius:2px;padding:4px 8px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1s infinite;}
.live-txt{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:900;letter-spacing:2px;color:#fff;}
.live-pill.off{background:var(--dark4);}
.live-pill.off .live-dot{animation:none;background:var(--gray);}
.upd-time{font-size:10px;color:var(--gray);font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;}
.logout-btn{background:transparent;border:1px solid var(--border2);color:var(--gray);padding:5px 10px;border-radius:2px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;transition:all .2s;}
.logout-btn:hover{border-color:var(--red);color:var(--red);}

/* FECHA SELECTOR */
.fecha-bar{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0;scrollbar-width:none;}
.fecha-bar::-webkit-scrollbar{display:none;}
.fecha-chip{flex-shrink:0;padding:6px 14px;border-radius:2px;border:1px solid var(--border2);background:transparent;color:var(--gray2);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .2s;white-space:nowrap;}
.fecha-chip:hover,.fecha-chip.active{background:var(--red);border-color:var(--red);color:#fff;}
.fecha-chip.live{border-color:var(--green);color:var(--green);}
.fecha-chip.live.active{background:var(--green);color:#000;}

/* SCROLL CONTENT */
.scroll{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;}

/* BIG NUMBERS */
.totales-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.total-card{background:var(--dark2);border:1px solid var(--border);border-radius:4px;padding:16px 14px;position:relative;overflow:hidden;}
.total-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--c,var(--red));}
.total-label{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:3px;color:var(--gray);text-transform:uppercase;margin-bottom:6px;}
.total-val{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:900;color:var(--c,#fff);letter-spacing:-1px;line-height:1;animation:countUp .4s ease both;}
.total-sub{font-size:10px;color:var(--gray);margin-top:3px;font-family:'Barlow Condensed',sans-serif;}

/* SECTION */
.section{background:var(--dark2);border:1px solid var(--border);border-radius:4px;overflow:hidden;}
.section-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.section-header::before{content:'';width:2px;height:12px;background:var(--red);border-radius:1px;flex-shrink:0;}
.section-title{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:3px;color:#fff;text-transform:uppercase;}
.section-body{padding:12px 14px;}

/* MÉTODO ROW */
.met-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #111;}
.met-row:last-child{border-bottom:none;}
.met-icon{font-size:16px;margin-right:8px;}
.met-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;color:#fff;}
.met-cnt{font-size:10px;color:var(--gray);font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;}
.met-amount{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:16px;text-align:right;}

/* DIVIDER TOTAL */
.total-line{display:flex;justify-content:space-between;align-items:center;padding:12px 0 0;border-top:1px solid var(--red);margin-top:4px;}
.total-line-lbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:3px;color:var(--gray);text-transform:uppercase;}
.total-line-val{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:24px;letter-spacing:-1px;}

/* NEU ROW */
.neu-row{padding:10px 0;border-bottom:1px solid #111;}
.neu-row:last-child{border-bottom:none;}
.neu-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.neu-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;}
.neu-val{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:var(--red);}
.bar{height:4px;background:#1a1a1a;border-radius:2px;overflow:hidden;}
.bar-fill{height:100%;border-radius:2px;transition:width .8s cubic-bezier(.4,0,.2,1);}
.neu-detail{display:flex;gap:12px;margin-top:5px;font-size:10px;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;}

/* VENTA ROW */
.v-row{padding:10px 12px;border-bottom:1px solid #111;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.v-row:last-child{border-bottom:none;}
.v-num{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:16px;color:var(--red);flex-shrink:0;}
.v-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;}
.v-cat{font-size:9px;color:var(--gray);font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;margin-top:2px;}
.v-items{font-size:10px;color:var(--gray);margin-top:3px;}
.v-amount{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:16px;flex-shrink:0;text-align:right;}
.badge{display:inline-flex;align-items:center;padding:1px 5px;border-radius:2px;font-size:8px;font-weight:700;letter-spacing:1px;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;}

/* EMPTY */
.empty{text-align:center;padding:28px;color:var(--gray);font-size:12px;font-family:'Barlow Condensed',sans-serif;letter-spacing:2px;}

/* SPINNER */
.spinner{width:24px;height:24px;border:2px solid var(--border2);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;margin:32px auto;}

/* FOOTER */
footer{padding:12px 16px;text-align:center;font-size:9px;color:var(--gray);font-family:'Barlow Condensed',sans-serif;letter-spacing:3px;text-transform:uppercase;border-top:1px solid var(--border);flex-shrink:0;}

@media(max-width:380px){
  .total-val{font-size:22px;}
  .totales-grid{grid-template-columns:1fr;}
}
</style>
</head>

<script>
const SHEETS = "https://script.google.com/macros/s/AKfycbxh0cN7SV9tZtR0bgvZH6ysGzxQgApFiKn7O4C9mN7HUV8h3hWpLbq2fqYbw5XV1Jk3/exec";
const PINS = ["GP3admin","Fran2026"];
const HOY = new Date().toISOString().slice(0,10);

const CIRCUITOS = [
  {id:"f1",num:"1ª",nombre:"Termas de Río Hondo",inicio:"2026-04-03",fin:"2026-04-05"},
  {id:"f2",num:"2ª",nombre:"Toay",inicio:"2026-05-22",fin:"2026-05-24"},
  {id:"f3",num:"3ª",nombre:"San Nicolás",inicio:"2026-06-19",fin:"2026-06-21"},
  {id:"f4",num:"4ª",nombre:"Concordia",inicio:"2026-08-07",fin:"2026-08-09"},
  {id:"f5",num:"5ª",nombre:"San Juan Villicum",inicio:"2026-09-04",fin:"2026-09-06"},
  {id:"f6",num:"6ª",nombre:"Termas de Río Hondo 2",inicio:"2026-10-09",fin:"2026-10-11"},
  {id:"f7",num:"7ª",nombre:"San Juan Villicum — Final",inicio:"2026-11-13",fin:"2026-11-15"},
];

const METS = {
  "efectivo_usd":"💵 Efectivo USD",
  "transferencia":"🏦 Transferencia USD",
  "efectivo_ars":"🇦🇷 Efectivo ARS",
  "transferencia_ars":"🏦 Transf. ARS",
  "debito":"💳 Débito/Crédito",
};

let data = null;
let fecha = null;
let timer = null;

function fmt(v,m){const n=Number(v||0).toLocaleString("es-AR");return m==="ARS"?"$ "+n:"USD "+n;}

function checkPin(){
  const v = document.getElementById("pinInput").value;
  if(PINS.includes(v)){
    document.getElementById("pinScreen").style.display="none";
    const app = document.getElementById("app");
    app.style.display="flex";
    buildFechaBar();
    load();
    timer = setInterval(load, 30000);
  } else {
    document.getElementById("pinErr").style.display="block";
    document.getElementById("pinInput").value="";
  }
}

function logout(){
  clearInterval(timer);
  document.getElementById("app").style.display="none";
  document.getElementById("pinScreen").style.display="flex";
  document.getElementById("pinInput").value="";
  document.getElementById("pinErr").style.display="none";
}

function buildFechaBar(){
  const bar = document.getElementById("fechaBar");
  const activa = CIRCUITOS.find(c=>HOY>=c.inicio&&HOY<=c.fin);
  fecha = activa?.id || "activo";

  let html = '<button class="fecha-chip '+(fecha==="activo"?"active":"live")+'" onclick="selFecha(\'activo\')">ACTIVO</button>';
  CIRCUITOS.forEach(c=>{
    const enCurso = HOY>=c.inicio&&HOY<=c.fin;
    html += '<button class="fecha-chip '+(fecha===c.id?"active":enCurso?"live":"")+'" onclick="selFecha(\''+c.id+'\')">'+(enCurso?"● ":"")+c.num+" "+c.nombre+'</button>';
  });
  bar.innerHTML = html;
}

function selFecha(id){
  fecha = id;
  document.querySelectorAll(".fecha-chip").forEach(el=>{
    el.classList.remove("active");
    if(el.onclick && el.onclick.toString().includes("'"+id+"'")){
      el.classList.add("active");
    }
  });
  if(data) render(data);
}

async function load(){
  try{
    const res = await fetch(SHEETS+"?t="+Date.now());
    data = await res.json();
    const pill = document.getElementById("livePill");
    pill.className = "live-pill";
    document.getElementById("updTime").textContent = new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
    render(data);
  } catch(e){
    const pill = document.getElementById("livePill");
    pill.className = "live-pill off";
    pill.querySelector(".live-txt").textContent = "OFFLINE";
  }
}

function parseVentas(raw){
  if(!raw||raw.length<2) return [];
  const h = raw[0];
  return raw.slice(1).map(row=>{
    const v={};
    h.forEach((k,i)=>v[k]=row[i]);
    v.items = (v["Neumaticos"]||"").split(" | ").filter(Boolean).map(s=>{
      const p=s.split(":");
      return{prod_id:p[0],cantidad:parseInt(p[1])||1};
    });
    v.total = parseFloat(v["Total"])||0;
    v.unidades = v.items.reduce((s,i)=>s+i.cantidad,0);
    v.moneda = v["Moneda"]||"USD";
    v.piloto = v["Piloto"]||"";
    v.num = v["N Piloto"]||"";
    v.cat = v["Categoria"]||"";
    v.circ = v["Circuito"]||"";
    v.metodo = v["Metodo"]||"";
    return v;
  });
}

function parseStock(raw){
  if(!raw||raw.length<2) return {};
  const s={};
  raw.slice(1).forEach(row=>{ if(row[0]) s[row[0]]={t:parseInt(row[2])||0,b:parseInt(row[1])||0,f:parseInt(row[3])||0}; });
  return s;
}

function render(d){
  const ventas = parseVentas(d.ventas);
  const stock = parseStock(d.stock);
  const circ = CIRCUITOS.find(c=>c.id===fecha);

  const vF = fecha==="activo" ? ventas
    : ventas.filter(v=>v.circ===fecha||v.circ===circ?.nombre);

  const totUSD = vF.filter(v=>v.moneda==="USD").reduce((s,v)=>s+v.total,0);
  const totARS = vF.filter(v=>v.moneda==="ARS").reduce((s,v)=>s+v.total,0);
  const totUni = vF.reduce((s,v)=>s+v.unidades,0);

  // Por método
  const mets={};
  vF.forEach(v=>{
    const k=v.metodo;
    if(!mets[k]) mets[k]={usd:0,ars:0,cnt:0};
    if(v.moneda==="USD") mets[k].usd+=v.total;
    else mets[k].ars+=v.total;
    mets[k].cnt++;
  });

  // Por neumático vendido
  const neu={};
  vF.forEach(v=>{ v.items.forEach(i=>{ neu[i.prod_id]=(neu[i.prod_id]||0)+i.cantidad; }); });
  const neuList = Object.entries(neu).sort((a,b)=>b[1]-a[1]);
  const maxNeu = Math.max(...neuList.map(n=>n[1]),1);

  // Stock flotante
  const flotList = Object.entries(stock).filter(([,s])=>s.f+s.t+s.b>0).sort((a,b)=>b[1].f-a[1].f);

  const scroll = document.getElementById("scroll");
  scroll.innerHTML = `

    <!-- Totales -->
    <div class="totales-grid" style="animation:fadeUp .3s ease both">
      ${totUSD>0?`<div class="total-card" style="--c:var(--green)">
        <div class="total-label">Total USD</div>
        <div class="total-val" style="color:var(--green)">${fmt(totUSD,"USD")}</div>
      </div>`:""}
      ${totARS>0?`<div class="total-card" style="--c:var(--yellow)">
        <div class="total-label">Total ARS</div>
        <div class="total-val" style="color:var(--yellow)">${fmt(totARS,"ARS")}</div>
      </div>`:""}
      <div class="total-card" style="--c:#fff">
        <div class="total-label">Clientes</div>
        <div class="total-val">${vF.length}</div>
      </div>
      <div class="total-card" style="--c:var(--red)">
        <div class="total-label">Neumáticos</div>
        <div class="total-val" style="color:var(--red)">${totUni}</div>
      </div>
    </div>

    <!-- Ingreso por método -->
    <div class="section" style="animation:fadeUp .4s ease both">
      <div class="section-header"><span class="section-title">Ingreso por método de pago</span></div>
      <div class="section-body">
        ${Object.keys(mets).length===0
          ?'<div class="empty">SIN VENTAS</div>'
          :Object.entries(mets).map(([k,m])=>`
            <div class="met-row">
              <div>
                <div class="met-name">${METS[k]||k}</div>
                <div class="met-cnt">${m.cnt} VENTA${m.cnt!==1?"S":""}</div>
              </div>
              <div>
                ${m.usd>0?`<div class="met-amount" style="color:var(--green)">${fmt(m.usd,"USD")}</div>`:""}
                ${m.ars>0?`<div class="met-amount" style="color:var(--yellow)">${fmt(m.ars,"ARS")}</div>`:""}
              </div>
            </div>
          `).join("")
        }
        ${(totUSD>0||totARS>0)?`
          <div class="total-line">
            <span class="total-line-lbl">Total</span>
            <div>
              ${totUSD>0?`<div class="total-line-val" style="color:var(--green)">${fmt(totUSD,"USD")}</div>`:""}
              ${totARS>0?`<div class="total-line-val" style="color:var(--yellow)">${fmt(totARS,"ARS")}</div>`:""}
            </div>
          </div>
        `:""}
      </div>
    </div>

    <!-- Neumáticos vendidos -->
    <div class="section" style="animation:fadeUp .5s ease both">
      <div class="section-header"><span class="section-title">Neumáticos vendidos</span></div>
      <div class="section-body">
        ${neuList.length===0
          ?'<div class="empty">SIN VENTAS</div>'
          :neuList.map(([id,uni])=>`
            <div class="neu-row">
              <div class="neu-top">
                <span class="neu-name">${id.toUpperCase().replace(/_/g," ")}</span>
                <span class="neu-val">${uni} u.</span>
              </div>
              <div class="bar"><div class="bar-fill" style="width:${Math.round(uni/maxNeu*100)}%;background:var(--red)"></div></div>
            </div>
          `).join("")
        }
      </div>
    </div>

    <!-- Stock flotante en pista -->
    <div class="section" style="animation:fadeUp .6s ease both">
      <div class="section-header"><span class="section-title">Stock flotante — en pista</span></div>
      <div class="section-body">
        ${flotList.length===0
          ?'<div class="empty">SIN STOCK</div>'
          :flotList.map(([id,s])=>{
            const tot=s.f+s.t+s.b;
            const pct=tot>0?Math.round(s.f/tot*100):0;
            const alerta=s.f<=5;
            return`
              <div class="neu-row">
                <div class="neu-top">
                  <div style="display:flex;align-items:center;gap:8px;">
                    <span class="neu-name">${id.toUpperCase().replace(/_/g," ")}</span>
                    ${alerta?'<span style="font-size:9px;color:var(--red);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:1px;">⚠ BAJO</span>':""}
                  </div>
                  <span style="font-family:\'Barlow Condensed\',sans-serif;font-weight:900;font-size:22px;color:${alerta?"var(--red)":"var(--green)"};">${s.f}</span>
                </div>
                <div class="bar"><div class="bar-fill" style="width:${pct}%;background:${alerta?"var(--red)":"var(--green)"}"></div></div>
                <div class="neu-detail">
                  <span style="color:var(--orange)">🚚 ${s.t}</span>
                  <span style="color:var(--gray)">📦 ${s.b}</span>
                </div>
              </div>
            `;
          }).join("")
        }
      </div>
    </div>

    <!-- Últimas ventas -->
    <div class="section" style="animation:fadeUp .7s ease both">
      <div class="section-header"><span class="section-title">Ventas — ${vF.length} registros</span></div>
      <div>
        ${vF.length===0
          ?'<div class="empty">SIN VENTAS</div>'
          :[...vF].reverse().map(v=>`
            <div class="v-row">
              <div style="min-width:0;flex:1">
                <div style="display:flex;align-items:baseline;gap:6px;">
                  <span class="v-num">#${v.num||"—"}</span>
                  <span class="v-name">${v.piloto}</span>
                </div>
                <div class="v-cat">${v.cat}</div>
                <div class="v-items">${v.items.map(i=>i.prod_id.toUpperCase()+"×"+i.cantidad).join(" · ")}</div>
              </div>
              <div style="text-align:right;flex-shrink:0;">
