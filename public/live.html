<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>En Vivo — Preinscripciones CAV 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cav:#6ACCE4;--dark:#0a0a0f;--dark3:#1a1a24;--dark4:#222230;--border:#2a2a3a;--gray:#8888aa;--green:#00d4aa;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--dark);font-family:'Barlow',sans-serif;color:#fff;min-height:100%;-webkit-font-smoothing:antialiased;}
.topbar{height:5px;background:linear-gradient(90deg,var(--cav),#bdeaf6,var(--cav));}
.wrap{max-width:1100px;margin:0 auto;padding:22px 18px 50px;}
.logos{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap;margin-bottom:14px;}
.logos img{height:54px;object-fit:contain;background:#fff;border-radius:10px;padding:7px 12px;}
.head{text-align:center;margin-bottom:24px;}
.head .s{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:5px;color:var(--cav);text-transform:uppercase;font-weight:700;}
.head .t{font-family:'Barlow Condensed',sans-serif;font-size:38px;font-weight:900;letter-spacing:-0.5px;line-height:1.05;margin-top:4px;}
.total{text-align:center;background:var(--dark3);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:24px;}
.total .n{font-family:'Barlow Condensed',sans-serif;font-size:72px;font-weight:900;color:var(--cav);line-height:1;}
.total .l{font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:4px;text-transform:uppercase;color:var(--gray);margin-top:2px;}
.sec{font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:4px;text-transform:uppercase;color:var(--cav);font-weight:700;margin:0 0 14px 4px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
.cat{background:var(--dark3);border:1px solid var(--border);border-top:3px solid var(--cav);border-radius:14px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;transition:transform .15s;}
.cat .nom{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;letter-spacing:0.5px;}
.cat .cnt{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:46px;line-height:1;color:#fff;}
.cat.zero{opacity:.45;border-top-color:var(--border);}
.cat.zero .cnt{color:var(--gray);}
.foot{text-align:center;margin-top:30px;color:var(--gray);font-size:12px;letter-spacing:1px;}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.loading{text-align:center;color:var(--gray);padding:40px;font-size:15px;}
</style>
</head>
<body>
<div class="topbar"></div>
<div class="wrap">
  <div class="logos">
    <img src="gp3-logo.png" alt="GP3 Sports Latam" onerror="this.style.display='none'">
    <img src="cav-logo.png" alt="CAV" onerror="this.style.display='none'">
  </div>
  <div class="head">
    <div class="s">Campeonato Argentino de Velocidad 2026</div>
    <div class="t">Preinscripciones En Vivo</div>
  </div>

  <div class="total">
    <div class="n" id="total">—</div>
    <div class="l">Pilotos Preinscritos</div>
  </div>

  <div class="sec">Inscritos por Categoría</div>
  <div class="grid" id="grid"><div class="loading">Cargando...</div></div>

  <div class="foot"><span class="dot"></span><span id="upd">Conectando...</span></div>
</div>

<script>
const SHEETS_URL="https://script.google.com/macros/s/AKfycbxh0cN7SV9tZtR0bgvZH6ysGzxQgApFiKn7O4C9mN7HUV8h3hWpLbq2fqYbw5XV1Jk3/exec";
const CATS=["GP3 Amateur","GP3 Experto","GP3 Promocional","SBK Pro","SBK Experto","SBK Senior","SBK Promocional","SBK Amateur","Sportbike","600 SSP"];

async function cargar(){
 try{
   const res=await fetch(SHEETS_URL+"?tipo=inscripciones&t="+Date.now());
   const json=await res.json();
   const arr=Array.isArray(json)?json:(json.inscripciones||json.data||[]);
   render(arr);
 }catch(e){
   document.getElementById("upd").textContent="Sin conexión — reintentando...";
 }
}

function render(arr){
 document.getElementById("total").textContent=arr.length;
 const conteo={};
 arr.forEach(p=>{const c=(p.categoria||"").trim();if(c)conteo[c]=(conteo[c]||0)+1;});
 // todas las categorías + cualquier extra que aparezca
 const todas=CATS.slice();
 Object.keys(conteo).forEach(c=>{if(todas.indexOf(c)===-1)todas.push(c);});
 const orden=todas.map(c=>({c,n:conteo[c]||0})).sort((a,b)=>b.n-a.n);
 const grid=document.getElementById("grid");
 grid.innerHTML="";
 orden.forEach(({c,n})=>{
   const d=document.createElement("div");
   d.className="cat"+(n===0?" zero":"");
   d.innerHTML='<span class="nom">'+c+'</span><span class="cnt">'+n+'</span>';
   grid.appendChild(d);
 });
 const ahora=new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
 document.getElementById("upd").textContent="En vivo · actualizado "+ahora;
}

cargar();
setInterval(cargar,25000);
</script>
</body>
</html>
