<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Calendario GP3">

<title>Calendario Oficial GP3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1fb;--panel:#ffffff;--panel2:#f1ecfa;--line:#e4ddf2;--ink:#211d33;
 --mut:#6f6a86;--mut2:#9a95ad;--violet:#7c4dff;--violet-d:#6336e0;--red:#e03131;--rad:14px;--shadow:0 10px 30px rgba(80,50,160,.14)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:0 0 90px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.mono{font-family:'JetBrains Mono',monospace}
button{font-family:inherit}

/* PIN GATE */
#gate{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 90% at 50% 0%,#efe7ff,#f4f1fb 70%);
 display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#gate .logo{font-family:Oswald;font-weight:700;font-size:26px;letter-spacing:.06em;text-transform:uppercase;color:var(--violet-d)}
#gate .sub{color:var(--mut);font-size:12px;letter-spacing:.22em;text-transform:uppercase;margin:6px 0 30px}
#gate .dots{display:flex;gap:13px;margin-bottom:26px;height:16px}
#gate .dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--mut2);transition:.15s}
#gate .dots i.f{background:var(--violet);border-color:var(--violet)}
#gate .dots.err i{border-color:var(--red);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
 color:var(--ink);font-size:25px;font-family:Oswald;font-weight:500;cursor:pointer;transition:.1s;box-shadow:0 2px 6px rgba(80,50,160,.06)}
.pad button:active{background:var(--panel2);transform:scale(.95)}
.pad .wide{font-size:14px;letter-spacing:.04em}

/* TOPBAR */
header{position:sticky;top:0;z-index:30;background:rgba(244,241,251,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:10px;padding:11px 16px;max-width:1080px;margin:0 auto;flex-wrap:wrap}
.brand b{font-family:Oswald;font-weight:700;letter-spacing:.04em;font-size:15px;text-transform:uppercase;display:block;line-height:1;color:var(--violet-d)}
.brand span{font-size:9.5px;color:var(--mut);letter-spacing:.16em;text-transform:uppercase}
.year{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-left:auto}
.year button{font-family:Oswald;font-size:13px;letter-spacing:.04em;background:none;border:0;color:var(--mut);padding:7px 13px;cursor:pointer;font-weight:600}
.year button.on{background:var(--violet);color:#fff}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;width:100%;margin-top:4px}
.seg button{flex:1;font-family:Oswald;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;background:none;border:0;color:var(--mut);padding:9px 12px;cursor:pointer}
.seg button.on{background:var(--violet);color:#fff;font-weight:600}
@media(min-width:560px){.seg{width:auto}.seg button{flex:none}}

.tools{display:flex;gap:8px;align-items:center;margin:14px 0 2px;flex-wrap:wrap}
.tool{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 13px;font-size:12.5px;font-weight:500;cursor:pointer;font-family:Oswald;letter-spacing:.03em}
.tool:hover{border-color:var(--violet)}
.tool.add{background:var(--violet);color:#fff;border-color:var(--violet);font-weight:600;font-size:13.5px}
.tool.ghost{color:var(--mut)}

/* HERO */
.hero{margin:14px 0 4px;background:linear-gradient(135deg,#fff,#efe8fc);border:1px solid var(--line);border-radius:var(--rad);padding:16px 18px;display:flex;align-items:center;gap:18px;position:relative;overflow:hidden}
.hero .bar{position:absolute;left:0;top:0;bottom:0;width:6px}
.hero .lbl{font-family:Oswald;letter-spacing:.16em;text-transform:uppercase;font-size:10px;color:var(--mut)}
.hero .cd{font-family:Oswald;font-weight:700;font-size:42px;line-height:.9;margin-top:2px;color:var(--ink)}
.hero .cd small{font-size:13px;color:var(--mut);font-weight:500}
.hero .ev .name{font-family:Oswald;font-weight:600;font-size:19px;margin:0 0 4px}
.hero .ev .meta{font-size:12.5px;color:var(--mut);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:999px;color:#fff;font-family:Oswald;letter-spacing:.04em}

/* RAIL */
.rail{display:flex;gap:7px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:500;color:var(--mut);transition:.12s;user-select:none}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip.on{color:var(--ink);border-color:var(--violet)}.chip.off{opacity:.45}

/* AGENDA */
.month{margin:18px 0}
.month-h{display:flex;align-items:baseline;gap:10px;margin:0 0 9px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.month-h h2{font-family:Oswald;font-weight:600;letter-spacing:.03em;text-transform:uppercase;font-size:16px;margin:0}
.month-h .cnt{font-size:11px;color:var(--mut2);font-family:'JetBrains Mono'}
.month-h .now{margin-left:auto;font-size:9.5px;font-family:Oswald;letter-spacing:.08em;color:var(--violet-d);border:1px solid var(--violet);padding:2px 8px;border-radius:999px}
.ev-row{display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;cursor:pointer;transition:.12s;box-shadow:0 1px 4px rgba(80,50,160,.04)}
.ev-row:hover,.ev-row:focus-visible{border-color:var(--violet);transform:translateY(-1px);outline:none}
.ev-row .cbar{width:5px;flex:0 0 5px}
.ev-row .day{flex:0 0 56px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0;border-right:1px solid var(--line)}
.ev-row .day .n{font-family:Oswald;font-weight:700;font-size:21px;line-height:1}
.ev-row .day .w{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.ev-row .day.we .n{color:var(--red)}
.ev-row .body{flex:1;padding:9px 13px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.ev-row .body .t{font-weight:600;font-size:14.5px;margin:0 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-row .body .s{font-size:11.5px;color:var(--mut);display:flex;gap:9px;align-items:center}
.ev-row .clash{align-self:center;margin-right:10px;font-size:9.5px;font-family:Oswald;letter-spacing:.05em;color:#9a6800;border:1px solid #f0d98a;background:#fff7e0;padding:3px 7px;border-radius:6px}

/* GRILLA */
.grid-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin:16px 0;background:var(--panel)}
table.grid{border-collapse:collapse;width:100%;min-width:760px;font-size:11px}
table.grid th,table.grid td{border:1px solid var(--line)}
table.grid thead th{background:var(--panel2);font-family:Oswald;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:10.5px;color:var(--mut);padding:8px 5px;position:sticky;top:0}
table.grid tbody th{background:var(--panel);text-align:left;padding:0 10px;white-space:nowrap;position:sticky;left:0;z-index:2}
.catlabel{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:11.5px;padding:8px 0;color:var(--ink)}
.catlabel .dot{width:9px;height:9px;border-radius:50%}
table.grid td{height:32px;text-align:center;vertical-align:middle;background:var(--panel)}
table.grid td.nowcol{background:#efe9fb}
.cellev{height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:9.5px;font-family:Oswald;cursor:pointer;padding:3px 4px;line-height:1.05}

/* FERIADOS */
.fer-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.fer-col{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fer-h{font-family:Oswald;font-weight:600;font-size:13px;padding:10px 12px;background:var(--panel2);border-bottom:1px solid var(--line)}
.fer-row{display:flex;gap:9px;padding:7px 12px;border-bottom:1px solid var(--line);align-items:baseline;font-size:12px}
.fer-row:last-child{border-bottom:0}
.fer-d{color:var(--violet-d);font-size:11px;flex:0 0 40px;font-weight:600}
.fer-n i{color:var(--mut2);font-style:normal;font-size:9.5px}
@media(max-width:560px){.fer-wrap{grid-template-columns:1fr}}

/* FAB */
.fab{position:fixed;right:18px;bottom:22px;z-index:40;width:58px;height:58px;border-radius:50%;border:0;background:var(--violet);color:#fff;font-size:30px;font-weight:300;box-shadow:0 8px 22px rgba(124,77,255,.4);cursor:pointer;display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.93)}

/* SHEET / MODAL */
.scrim{position:fixed;inset:0;background:rgba(40,25,80,.4);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:50}
.scrim.show{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:520px;padding:20px 20px 28px;box-shadow:var(--shadow);animation:up .22s ease;max-height:92vh;overflow:auto}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-family:Oswald;font-weight:600;font-size:22px;margin:8px 0 4px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;gap:14px}
.row span{color:var(--mut)}.row b{font-weight:600;text-align:right}
.fer-near{background:#fff7e0;border:1px solid #f0d98a;border-radius:11px;padding:10px 12px;margin:13px 0}
.fer-near-h{font-family:Oswald;letter-spacing:.04em;font-size:11.5px;color:#9a6800;margin-bottom:5px}
.fer-near-r{display:flex;justify-content:space-between;font-size:12px;color:#7a5500;padding:2px 0}
.logi-btns{display:flex;gap:10px;margin:14px 0 0}
.logi-btn{flex:1;display:flex;align-items:center;gap:10px;text-decoration:none;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;font-family:Oswald;font-weight:600;font-size:13px;color:var(--ink)}
.logi-btn:hover{border-color:var(--violet)}.logi-btn .ico{font-size:18px}
.logi-btn span span{display:flex;flex-direction:column}.logi-btn small{color:var(--mut);font-size:10px;margin-top:2px;font-family:Inter;font-weight:400}
.actions{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-family:Oswald;letter-spacing:.05em;text-transform:uppercase;font-size:12.5px;padding:13px;border-radius:11px;cursor:pointer}
.btn.primary{background:var(--violet);color:#fff;border-color:var(--violet);font-weight:600}
.btn.danger{color:var(--red);border-color:#f0c0c0}
.field{margin:13px 0}
.field label{display:block;font-size:11px;color:var(--mut);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;font-family:Oswald}
.field input,.field select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:12px;font-size:15px;font-family:Inter}
.field input:focus,.field select:focus{outline:none;border-color:var(--violet)}
.foot{text-align:center;color:var(--mut2);font-size:10.5px;margin:30px 0 0;font-family:'JetBrains Mono'}
@media(min-width:560px){.scrim{align-items:center}.sheet{border-radius:18px;border-bottom:1px solid var(--line)}.grab{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</header>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>

function venueFor(txt){const t=(txt||'').toLowerCase();for(const k in VENUE){if(t.includes(k))return VENUE[k];}return null;}
function logiFor(ev){
  if(!TRAVEL.has(ev.cat))return null;
  const v=venueFor(ev.txt);if(!v)return null;
  const d=new Date(ev.date+'T00:00:00');
  const dep=new Date(d);dep.setDate(d.getDate()-1);
  const ret=new Date(d);ret.setDate(d.getDate()+2);
  const iso=x=>x.toISOString().slice(0,10);
  return {city:v.c,iata:v.i,clima:v.cl,dep:iso(dep),ret:iso(ret),
    flight:`https://www.google.com/travel/flights?q=Flights%20from%20SCL%20to%20${v.i}%20on%20${iso(dep)}%20through%20${iso(ret)}&curr=USD&hl=es`,
    hotel:`https://www.booking.com/searchresults.html?ss=${v.q.replace(/ /g,'+')}&checkin=${iso(dep)}&checkout=${iso(ret)}&selected_currency=USD&group_adults=1&no_rooms=1`};
}

/* ============ STATE ============ */
let events=[];const state={view:'agenda',off:new Set(),year:2026};
function load(){try{const s=localStorage.getItem(STORE);events=s?JSON.parse(s):JSON.parse(JSON.stringify(SEED));}catch(e){events=JSON.parse(JSON.stringify(SEED));}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(events));}catch(e){}pushSheet();}
function withDM(e){const d=new Date(e.date+'T00:00:00');return{...e,m:d.getMonth()+1,d:d.getDate(),we:d.getDay()===0||d.getDay()===6};}
function getEvents(){return events.filter(e=>e.date.slice(0,4)==String(state.year)).map(withDM).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);}

/* ============ SHEETS SYNC ============ */
async function pushSheet(){if(!API_URL)return;try{await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'calendar_save',events})});}catch(e){}}
async function pullSheet(){if(!API_URL)return;try{const r=await fetch(API_URL+'?type=calendar');const j=await r.json();if(j&&Array.isArray(j.events)&&j.events.length){events=j.events;try{localStorage.setItem(STORE,JSON.stringify(events));}catch(e){}render();}}catch(e){}}

/* ============ HELPERS ============ */
const $=id=>document.getElementById(id);
function visible(e){return !state.off.has(e.cat);}
function byDate(){const m={};getEvents().forEach(e=>{(m[e.date]=m[e.date]||[]).push(e);});return m;}
const PAISN={CL:'🇨🇱 Chile',AR:'🇦🇷 Argentina',BR:'🇧🇷 Brasil'};
function holidaysNear(dateStr){const y=dateStr.slice(0,4);const tbl=FER[y];if(!tbl)return[];const d=new Date(dateStr+'T00:00:00');const out=[];
 for(const p of['CL','AR','BR'])for(const[md,name,kind]of tbl[p]){const hd=new Date(y+'-'+md+'T00:00:00');const diff=Math.round((hd-d)/864e5);if(Math.abs(diff)<=3)out.push({p,name,kind,diff});}
 return out.sort((a,b)=>a.diff-b.diff);}
function nextEvent(){const t=new Date();const today=new Date(t.getFullYear(),t.getMonth(),t.getDate());return getEvents().filter(e=>visible(e)&&new Date(e.date+'T00:00:00')>=today)[0]||getEvents().filter(visible)[0];}

/* ============ RENDER ============ */
function renderHero(){const e=nextEvent();const h=$('hero');
 if(!e){h.innerHTML=`<div class="ev"><div class="lbl">Temporada ${state.year}</div><div class="name" style="margin-top:6px">Aún no cargaste eventos</div><div class="meta">Toca “＋ Agregar” para empezar.</div></div>`;return;}
 const t=new Date();const today=new Date(t.getFullYear(),t.getMonth(),t.getDate());
 const days=Math.round((new Date(e.date+'T00:00:00')-today)/864e5);const col=COLOR[e.cat];
 const dd=new Date(e.date+'T00:00:00');const wd=WD[dd.getDay()===0?6:dd.getDay()-1];
 const cd=days<0?'—':(days===0?'HOY':days);
 h.innerHTML=`<div class="bar" style="background:${col}"></div>
  <div style="text-align:center;min-width:74px"><div class="lbl">${days<0?'Temporada':'Próximo'}</div>
   <div class="cd">${cd}<small>${days>0?' días':''}</small></div></div>
  <div class="ev"><div class="name">${e.txt}</div>
   <div class="meta"><span class="pill" style="background:${col}">${e.cat}</span>
    <span>${wd} ${e.d} ${MESES[e.m-1].toLowerCase()} ${state.year}</span></div></div>`;}

function renderRail(){$('rail').innerHTML=CATS.map(c=>{const on=!state.off.has(c.name);
 return `<div class="chip ${on?'on':'off'}" data-cat="${c.name}" tabindex="0" role="button" aria-pressed="${on}"><span class="dot" style="background:${c.color}"></span>${c.name}</div>`;}).join('');}

function renderAgenda(){const v=$('view');const bd=byDate();let html='';const all=getEvents();
 for(let m=1;m<=12;m++){const evs=all.filter(e=>e.m===m&&visible(e));if(!evs.length)continue;
  const now=new Date().getFullYear()===state.year&&new Date().getMonth()===m-1;
  html+=`<div class="month"><div class="month-h"><h2>${MESES[m-1]}</h2><span class="cnt">${evs.length} ${evs.length===1?'hito':'hitos'}</span>${now?'<span class="now">Mes actual</span>':''}</div>`;
  evs.forEach(e=>{const dd=new Date(e.date+'T00:00:00');const wd=WD[dd.getDay()===0?6:dd.getDay()-1];const clash=(bd[e.date]||[]).filter(visible).length>1;
   html+=`<div class="ev-row" tabindex="0" role="button" data-id="${e.id}"><div class="cbar" style="background:${COLOR[e.cat]}"></div>
    <div class="day ${e.we?'we':''}"><span class="n">${e.d}</span><span class="w">${wd}</span></div>
    <div class="body"><div class="t">${e.txt}</div><div class="s"><span class="pill" style="background:${COLOR[e.cat]};font-size:9.5px;padding:2px 7px">${e.cat}</span></div></div>
    ${clash?'<div class="clash">⚠ Choque</div>':''}</div>`;});
  html+='</div>';}
 v.innerHTML=html||`<p style="color:var(--mut);text-align:center;padding:40px 20px;line-height:1.6">No hay eventos en ${state.year} todavía.<br>Toca <b>“＋ Agregar carrera / actividad”</b> arriba para empezar a armar tu temporada.</p>`;}

function renderGrilla(){const v=$('view');const cats=CATS.filter(c=>!state.off.has(c.name));const all=getEvents();
 const nowM=new Date().getFullYear()===state.year?new Date().getMonth():-1;
 let head='<th>Categoría</th>'+MESES.map((m,i)=>`<th class="${i===nowM?'nowcol':''}">${m.slice(0,3)}</th>`).join('');
 let body='';cats.forEach(c=>{let row=`<th><span class="catlabel"><span class="dot" style="background:${c.color}"></span>${c.name}</span></th>`;
  for(let m=1;m<=12;m++){const evs=all.filter(e=>e.m===m&&e.cat===c.name);const now=(m-1)===nowM?'nowcol':'';
   if(evs.length){const e0=evs[0];const lbl=evs.length>1?evs.length+' f.':(''+e0.d);row+=`<td class="${now}"><span class="cellev" style="background:${c.color}" data-id="${e0.id}" tabindex="0" role="button">${lbl}</span></td>`;}
   else row+=`<td class="${now}"></td>`;}
  body+=`<tr>${row}</tr>`;});
 v.innerHTML=`<div class="grid-scroll"><table class="grid"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
  <p style="color:var(--mut2);font-size:11px;text-align:center;margin:6px 0 0">Desliza para ver el año · toca una celda para el detalle</p>`;}

function renderFeriados(){const v=$('view');const tbl=FER[state.year];let cols='';
 for(const p of['CL','AR','BR']){let rows=tbl[p].map(([md,name,kind])=>{const[mm,dd]=md.split('-');
   return `<div class="fer-row"><span class="fer-d mono">${dd}/${mm}</span><span class="fer-n">${name}${kind==='m'?' <i>·mov</i>':''}</span></div>`;}).join('');
  cols+=`<div class="fer-col"><div class="fer-h">${PAISN[p]}</div>${rows}</div>`;}
 v.innerHTML=`<div class="fer-wrap">${cols}</div>
  <p style="color:var(--mut2);font-size:11.5px;text-align:center;margin:14px 0 0;line-height:1.5">Feriados nacionales ${state.year} de referencia. Los marcados <b>·mov</b> son movibles o se trasladan a lunes — confírmalos antes de cerrar viajes.</p>`;}

function render(){renderHero();state.view==='agenda'?renderAgenda():state.view==='grilla'?renderGrilla():renderFeriados();
 const n=getEvents().length;$('foot').textContent=`Calendario GP3 · ${state.year} · ${n} ${n===1?'hito':'hitos'}${API_URL?' · sincronizado':' · en este dispositivo'}`;}

function openDetail(id){const e=getEvents().find(x=>x.id===id);if(!e)return;
 const dd=new Date(e.date+'T00:00:00');const wd=WD[dd.getDay()===0?6:dd.getDay()-1];
 const same=(byDate()[e.date]||[]).filter(x=>x.id!==id&&visible(x));const near=holidaysNear(e.date);const L=logiFor(e);
 let ferH=near.length?`<div class="fer-near"><div class="fer-near-h">⚠ Feriados en esos días</div>`+near.map(h=>{const rel=h.diff===0?'el mismo día':(h.diff>0?`+${h.diff}d`:`${h.diff}d`);return `<div class="fer-near-r"><span>${PAISN[h.p].split(' ')[0]} ${h.name}</span><span class="mono">${rel}</span></div>`;}).join('')+`</div>`:'';
 let logiH=L?`<div class="row"><span>Clima típico</span><b>${L.clima}</b></div>
  <div class="logi-btns"><a class="logi-btn" href="${L.flight}" target="_blank" rel="noopener"><span class="ico">✈</span><span><span>Buscar vuelos<small>Google Flights · SCL→${L.iata} · USD</small></span></span></a>
   <a class="logi-btn" href="${L.hotel}" target="_blank" rel="noopener"><span class="ico">🛏</span><span><span>Buscar hoteles<small>${L.city} · USD</small></span></span></a></div>`:'';
 $('sheet').innerHTML=`<div class="grab"></div><span class="pill" style="background:${COLOR[e.cat]}">${e.cat}</span><h3>${e.txt}</h3>
  <div class="row"><span>Fecha</span><b>${wd} ${e.d} de ${MESES[e.m-1].toLowerCase()} ${e.date.slice(0,4)}</b></div>
  <div class="row"><span>Tipo de día</span><b>${e.we?'Fin de semana 🏁':'Día de semana'}</b></div>
  ${L?`<div class="row"><span>Sede</span><b>${L.city}</b></div>`:''}
  ${same.length?`<div class="row"><span>Mismo día</span><b style="color:#9a6800">⚠ ${same.map(x=>x.cat).join(', ')}</b></div>`:''}
  ${ferH}${logiH}
  <div class="actions"><button class="btn" onclick="openForm('${e.id}')">Editar</button><button class="btn danger" onclick="delEvent('${e.id}')">Borrar</button><button class="btn primary" onclick="closeSheet()">Listo</button></div>`;
 showScrim();}

function openForm(id){const e=id?events.find(x=>x.id===id):null;
 const opts=CATS.map(c=>`<option value="${c.name}" ${e&&e.cat===c.name?'selected':''}>${c.name}</option>`).join('');
 const defDate=e?e.date:state.year+'-'+String((new Date().getFullYear()===state.year?new Date().getMonth()+1:1)).padStart(2,'0')+'-01';
 $('sheet').innerHTML=`<div class="grab"></div><h3>${e?'Editar evento':'Nuevo evento · '+state.year}</h3>
  <div class="field"><label>Fecha</label><input type="date" id="f_date" value="${defDate}" min="${state.year}-01-01" max="${state.year}-12-31"></div>
  <div class="field"><label>Campeonato / Tipo</label><select id="f_cat">${opts}</select></div>
  <div class="field"><label>Nombre / Sede</label><input id="f_txt" placeholder="Ej: 5ª Fecha San Juan" value="${e?e.txt.replace(/"/g,'&quot;'):''}"></div>
  <p style="font-size:11px;color:var(--mut2);margin:2px 0 0">Si el nombre incluye una sede conocida (San Juan, Termas, Misano…) los botones de vuelo y clima se generan solos.</p>
  <div class="actions"><button class="btn" onclick="closeSheet()">Cancelar</button><button class="btn primary" onclick="saveForm('${id||''}')">Guardar</button></div>`;
 showScrim();}

function saveForm(id){const date=$('f_date').value,cat=$('f_cat').value,txt=$('f_txt').value.trim();
 if(!date||!txt){alert('Pon fecha y nombre');return;}
 if(id){const e=events.find(x=>x.id===id);if(e){e.date=date;e.cat=cat;e.txt=txt;}}
 else{events.push({id:'e'+Date.now(),date,cat,txt});}
 save();render();closeSheet();}
function delEvent(id){if(!confirm('¿Borrar este evento?'))return;events=events.filter(x=>x.id!==id);save();render();closeSheet();}

/* ============ ICS ============ */
function exportIcs(){let l=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//GP3 Sports LATAM//Calendario//ES','CALSCALE:GREGORIAN','X-WR-CALNAME:Calendario GP3'];
 events.forEach(e=>{const dt=e.date.replace(/-/g,'');const d2=new Date(e.date+'T00:00:00');d2.setDate(d2.getDate()+1);const end=d2.toISOString().slice(0,10).replace(/-/g,'');
  l.push('BEGIN:VEVENT','UID:'+e.id+'@gp3sports','DTSTART;VALUE=DATE:'+dt,'DTEND;VALUE=DATE:'+end,'SUMMARY:'+e.cat+' · '+e.txt,'DESCRIPTION:Calendario Oficial GP3 Sports LATAM','END:VEVENT');});
 l.push('END:VCALENDAR');const blob=new Blob([l.join('\r\n')],{type:'text/calendar'});const u=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=u;a.download='GP3_Calendario.ics';a.click();URL.revokeObjectURL(u);}

/* ============ UI EVENTS ============ */
function showScrim(){$('scrim').classList.add('show');}
function closeSheet(){$('scrim').classList.remove('show');}
$('seg').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;state.view=b.dataset.v;[...document.querySelectorAll('#seg button')].forEach(x=>x.classList.toggle('on',x===b));render();});
$('yearSel').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;state.year=+b.dataset.y;[...document.querySelectorAll('#yearSel button')].forEach(x=>x.classList.toggle('on',x===b));render();});
$('rail').addEventListener('click',toggleCat);
$('rail').addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();toggleCat(ev);}});
function toggleCat(ev){const c=ev.target.closest('.chip');if(!c)return;const cat=c.dataset.cat;state.off.has(cat)?state.off.delete(cat):state.off.add(cat);renderRail();render();}
$('view').addEventListener('click',ev=>{const el=ev.target.closest('[data-id]');if(el)openDetail(el.dataset.id);});
$('view').addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){const el=ev.target.closest('[data-id]');if(el){ev.preventDefault();openDetail(el.dataset.id);}}});
$('scrim').addEventListener('click',ev=>{if(ev.target.id==='scrim')closeSheet();});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeSheet();});
$('fab').addEventListener('click',()=>openForm(''));
$('btnAdd').addEventListener('click',()=>openForm(''));
$('btnIcs').addEventListener('click',exportIcs);
$('btnReset').addEventListener('click',()=>{if(confirm('¿Restaurar el calendario 2026 original? Se pierden los cambios de este dispositivo.')){events=JSON.parse(JSON.stringify(SEED));save();state.year=2026;[...document.querySelectorAll('#yearSel button')].forEach(x=>x.classList.toggle('on',x.dataset.y==='2026'));render();}});

/* ============ PIN ============ */
let buf='';
function renderDots(){[...$('dots').children].forEach((d,i)=>d.classList.toggle('f',i<buf.length));}
$('pad').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;const k=b.dataset.k;
 if(k==='clear'){buf='';}else if(k==='ok'){tryPin();return;}else if(buf.length<6){buf+=b.textContent;}
 renderDots();if(buf.length===6)setTimeout(tryPin,150);});
function tryPin(){if(buf===PIN){enter();}else{$('dots').classList.add('err');setTimeout(()=>{$('dots').classList.remove('err');buf='';renderDots();},400);}}
function enter(){$('gate').style.display='none';$('hdr').style.display='';$('app').style.display='';$('fab').style.display='';load();renderRail();render();pullSheet();}
renderDots();
</script>
