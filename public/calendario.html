<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Calendario Oficial GP3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0d12;--panel:#14161f;--panel2:#191c27;--line:#262a38;--ink:#eef0f5;
 --mut:#8990a4;--mut2:#5a6076;--signal:#13e2c8;--red:#ff5a5f;--rad:14px;--shadow:0 8px 30px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:0 0 90px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.mono{font-family:'JetBrains Mono',monospace}
button{font-family:inherit}

/* PIN GATE */
#gate{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 90% at 50% 0%,#16202b,#0c0d12 70%);
 display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#gate .logo{font-family:Oswald;font-weight:700;font-size:26px;letter-spacing:.08em;text-transform:uppercase}
#gate .sub{color:var(--mut);font-size:12px;letter-spacing:.22em;text-transform:uppercase;margin:6px 0 30px}
#gate .dots{display:flex;gap:13px;margin-bottom:26px;height:16px}
#gate .dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--mut2);transition:.15s}
#gate .dots i.f{background:var(--signal);border-color:var(--signal)}
#gate .dots.err i{border-color:var(--red);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
 color:var(--ink);font-size:25px;font-family:Oswald;font-weight:500;cursor:pointer;transition:.1s}
.pad button:active{background:var(--panel2);transform:scale(.95)}
.pad .wide{font-size:14px;letter-spacing:.05em}

/* TOPBAR */
header{position:sticky;top:0;z-index:30;background:rgba(12,13,18,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:1080px;margin:0 auto}
.brand b{font-family:Oswald;font-weight:700;letter-spacing:.05em;font-size:15px;text-transform:uppercase;display:block;line-height:1}
.brand span{font-size:9.5px;color:var(--mut);letter-spacing:.18em;text-transform:uppercase}
.seg{margin-left:auto;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font-family:Oswald;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;background:none;border:0;color:var(--mut);padding:8px 12px;cursor:pointer}
.seg button.on{background:var(--signal);color:#062b27;font-weight:600}
.tools{display:flex;gap:7px;align-items:center;margin:14px 0 2px;flex-wrap:wrap}
.tool{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);
 color:var(--ink);border-radius:10px;padding:9px 13px;font-size:12.5px;font-weight:500;cursor:pointer;font-family:Oswald;letter-spacing:.03em}
.tool:hover{border-color:var(--signal)}
.tool.ghost{color:var(--mut)}

/* HERO */
.hero{margin:14px 0 4px;background:linear-gradient(135deg,var(--panel),var(--panel2));border:1px solid var(--line);
 border-radius:var(--rad);padding:16px 18px;display:flex;align-items:center;gap:18px;position:relative;overflow:hidden}
.hero .bar{position:absolute;left:0;top:0;bottom:0;width:6px}
.hero .lbl{font-family:Oswald;letter-spacing:.18em;text-transform:uppercase;font-size:10px;color:var(--mut)}
.hero .cd{font-family:Oswald;font-weight:700;font-size:42px;line-height:.9;margin-top:2px}
.hero .cd small{font-size:13px;color:var(--mut);font-weight:500}
.hero .ev .name{font-family:Oswald;font-weight:600;font-size:19px;margin:0 0 4px}
.hero .ev .meta{font-size:12.5px;color:var(--mut);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:999px;color:#fff;font-family:Oswald;letter-spacing:.04em}

/* RAIL */
.rail{display:flex;gap:7px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;cursor:pointer;border:1px solid var(--line);
 background:var(--panel);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:500;color:var(--mut);transition:.12s;user-select:none}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip.on{color:var(--ink);border-color:transparent}.chip.off{opacity:.4}

/* AGENDA */
.month{margin:18px 0}
.month-h{display:flex;align-items:baseline;gap:10px;margin:0 0 9px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.month-h h2{font-family:Oswald;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:16px;margin:0}
.month-h .cnt{font-size:11px;color:var(--mut2);font-family:'JetBrains Mono'}
.month-h .now{margin-left:auto;font-size:9.5px;font-family:Oswald;letter-spacing:.1em;color:var(--signal);border:1px solid var(--signal);padding:2px 8px;border-radius:999px}
.ev-row{display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;cursor:pointer;transition:.12s}
.ev-row:hover,.ev-row:focus-visible{border-color:var(--mut2);transform:translateY(-1px);outline:none}
.ev-row .cbar{width:5px;flex:0 0 5px}
.ev-row .day{flex:0 0 56px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0;border-right:1px solid var(--line)}
.ev-row .day .n{font-family:Oswald;font-weight:700;font-size:21px;line-height:1}
.ev-row .day .w{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.ev-row .day.we .n{color:#ff6b6b}
.ev-row .body{flex:1;padding:9px 13px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.ev-row .body .t{font-weight:600;font-size:14.5px;margin:0 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-row .body .s{font-size:11.5px;color:var(--mut);display:flex;gap:9px;align-items:center}
.ev-row .clash{align-self:center;margin-right:10px;font-size:9.5px;font-family:Oswald;letter-spacing:.06em;color:#ffd43b;border:1px solid #5c5018;background:#241f08;padding:3px 7px;border-radius:6px}

/* GRILLA */
.grid-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin:16px 0}
table.grid{border-collapse:collapse;width:100%;min-width:760px;font-size:11px}
table.grid th,table.grid td{border:1px solid var(--line)}
table.grid thead th{background:var(--panel2);font-family:Oswald;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:10.5px;color:var(--mut);padding:8px 5px;position:sticky;top:0}
table.grid tbody th{background:var(--panel);text-align:left;padding:0 10px;white-space:nowrap;position:sticky;left:0;z-index:2}
.catlabel{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:11.5px;padding:8px 0}
.catlabel .dot{width:9px;height:9px;border-radius:50%}
table.grid td{height:32px;text-align:center;vertical-align:middle;background:var(--bg)}
table.grid td.nowcol{background:#0f1820}
.cellev{height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:9.5px;font-family:Oswald;cursor:pointer;padding:3px 4px;line-height:1.05}

/* FERIADOS */
.fer-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.fer-col{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fer-h{font-family:Oswald;font-weight:600;font-size:13px;padding:10px 12px;background:var(--panel2);border-bottom:1px solid var(--line)}
.fer-row{display:flex;gap:9px;padding:7px 12px;border-bottom:1px solid var(--line);align-items:baseline;font-size:12px}
.fer-row:last-child{border-bottom:0}
.fer-d{color:var(--signal);font-size:11px;flex:0 0 40px}
.fer-n i{color:var(--mut2);font-style:normal;font-size:9.5px}
@media(max-width:560px){.fer-wrap{grid-template-columns:1fr}}

/* FAB */
.fab{position:fixed;right:18px;bottom:22px;z-index:40;width:58px;height:58px;border-radius:50%;border:0;
 background:var(--signal);color:#062b27;font-size:30px;font-weight:300;box-shadow:0 8px 22px rgba(19,226,200,.35);cursor:pointer;display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.93)}

/* SHEET / MODAL */
.scrim{position:fixed;inset:0;background:rgba(4,5,9,.74);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:50}
.scrim.show{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:520px;padding:20px 20px 28px;box-shadow:var(--shadow);animation:up .22s ease;max-height:92vh;overflow:auto}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-family:Oswald;font-weight:600;font-size:22px;margin:8px 0 4px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;gap:14px}
.row span{color:var(--mut)}.row b{font-weight:600;text-align:right}
.fer-near{background:#241f08;border:1px solid #5c5018;border-radius:11px;padding:10px 12px;margin:13px 0}
.fer-near-h{font-family:Oswald;letter-spacing:.05em;font-size:11.5px;color:#ffd43b;margin-bottom:5px}
.fer-near-r{display:flex;justify-content:space-between;font-size:12px;color:#f0e3b0;padding:2px 0}
.logi-btns{display:flex;gap:10px;margin:14px 0 0}
.logi-btn{flex:1;display:flex;align-items:center;gap:10px;text-decoration:none;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;font-family:Oswald;font-weight:600;font-size:13px;color:var(--ink)}
.logi-btn:hover{border-color:var(--signal)}.logi-btn .ico{font-size:18px}
.logi-btn span span{display:flex;flex-direction:column}.logi-btn small{color:var(--mut);font-size:10px;margin-top:2px;font-family:Inter;font-weight:400}
.actions{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-family:Oswald;letter-spacing:.06em;text-transform:uppercase;font-size:12.5px;padding:13px;border-radius:11px;cursor:pointer}
.btn.primary{background:var(--signal);color:#062b27;border-color:var(--signal);font-weight:600}
.btn.danger{color:var(--red);border-color:#5c2326}
/* FORM */
.field{margin:13px 0}
.field label{display:block;font-size:11px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;font-family:Oswald}
.field input,.field select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:12px;font-size:15px;font-family:Inter}
.field input:focus,.field select:focus{outline:none;border-color:var(--signal)}
.foot{text-align:center;color:var(--mut2);font-size:10.5px;margin:30px 0 0;font-family:'JetBrains Mono'}
@media(min-width:560px){.scrim{align-items:center}.sheet{border-radius:18px;border-bottom:1px solid var(--line)}.grab{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>

function venueFor(txt){const t=(txt||'').toLowerCase();for(const k in VENUE){if(t.includes(k))return VENUE[k];}return null;}
function logiFor(ev){
  if(!TRAVEL.has(ev.cat))return null;
  const v=venueFor(ev.txt); if(!v)return null;
  const d=new Date(ev.date+'T00:00:00');
  const dep=new Date(d);dep.setDate(d.getDate()-1);
  const ret=new Date(d);ret.setDate(d.getDate()+2);
  const iso=x=>x.toISOString().slice(0,10);
  return {city:v.c,iata:v.i,clima:v.cl,dep:iso(dep),ret:iso(ret),
    flight:`https://www.google.com/travel/flights?q=Flights%20from%20SCL%20to%20${v.i}%20on%20${iso(dep)}%20through%20${iso(ret)}&curr=USD&hl=es`,
    hotel:`https://www.booking.com/searchresults.html?ss=${v.q.replace(/ /g,'+')}&checkin=${iso(dep)}&checkout=${iso(ret)}&selected_currency=USD&group_adults=1&no_rooms=1`};
}

/* ============ STATE ============ */
let events=[]; const state={view:'agenda',off:new Set()};
function load(){try{const s=localStorage.getItem(STORE);events=s?JSON.parse(s):JSON.parse(JSON.stringify(SEED));}catch(e){events=JSON.parse(JSON.stringify(SEED));}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(events));}catch(e){} pushSheet();}
function withDM(e){const d=new Date(e.date+'T00:00:00');return{...e,m:d.getMonth()+1,d:d.getDate(),we:d.getDay()===0||d.getDay()===6};}
function getEvents(){return events.map(withDM).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);}

/* ============ SHEETS SYNC (se activa con API_URL) ============ */
async function pushSheet(){ if(!API_URL)return;
  try{await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({type:'calendar_save',events})});}catch(e){console.warn('sync push',e);} }
async function pullSheet(){ if(!API_URL)return;
  try{const r=await fetch(API_URL+'?type=calendar');const j=await r.json();
    if(j&&Array.isArray(j.events)&&j.events.length){events=j.events;try{localStorage.setItem(STORE,JSON.stringify(events));}catch(e){}render();}}catch(e){console.warn('sync pull',e);} }

const $=id=>document.getElementById(id);
function visible(e){return !state.off.has(e.cat);}
function byDate(){const m={};getEvents().forEach(e=>{(m[e.date]=m[e.date]||[]).push(e);});return m;}
const PAISN={CL:'🇨🇱 Chile',AR:'🇦🇷 Argentina',BR:'🇧🇷 Brasil'};

function holidaysNear(dateStr){const d=new Date(dateStr+'T00:00:00');const out=[];
 for(const p of['CL','AR','BR'])for(const[md,name,kind]of FER[p]){
   const hd=new Date('2026-'+md+'T00:00:00');const diff=Math.round((hd-d)/864e5);
   if(Math.abs(diff)<=3)out.push({p,name,kind,diff});}
 return out.sort((a,b)=>a.diff-b.diff);}

function nextEvent(){const t=new Date();const today=new Date(t.getFullYear(),t.getMonth(),t.getDate());
 return getEvents().filter(e=>visible(e)&&new Date(e.date+'T00:00:00')>=today)[0];}

function renderHero(){const e=nextEvent();const h=$('hero');
 if(!e){h.innerHTML='<div class="ev"><div class="lbl">Sin próximos eventos con este filtro</div></div>';return;}
 const t=new Date();const today=new Date(t.getFullYear(),t.getMonth(),t.getDate());
 const days=Math.round((new Date(e.date+'T00:00:00')-today)/864e5);const col=COLOR[e.cat];
 const dd=new Date(e.date+'T00:00:00');const wd=WD[dd.getDay()===0?6:dd.getDay()-1];
 h.innerHTML=`<div class="bar" style="background:${col}"></div>
  <div style="text-align:center;min-width:74px"><div class="lbl">Próximo</div>
   <div class="cd">${days===0?'HOY':days}<small>${days===0?'':' días'}</small></div></div>
  <div class="ev"><div class="name">${e.txt}</div>
   <div class="meta"><span class="pill" style="background:${col}">${e.cat}</span>
    <span>${wd} ${e.d} ${MESES[e.m-1].toLowerCase()}</span></div></div>`;}

function renderRail(){$('rail').innerHTML=CATS.map(c=>{const on=!state.off.has(c.name);
 return `<div class="chip ${on?'on':'off'}" data-cat="${c.name}" tabindex="0" role="button" aria-pressed="${on}">
  <span class="dot" style="background:${c.color}"></span>${c.name}</div>`;}).join('');}

function renderAgenda(){const v=$('view');const bd=byDate();let html='';const all=getEvents();
 for(let m=1;m<=12;m++){const evs=all.filter(e=>e.m===m&&visible(e));if(!evs.length)continue;
  const now=new Date().getFullYear()===2026&&new Date().getMonth()===m-1;
  html+=`<div class="month"><div class="month-h"><h2>${MESES[m-1]}</h2>
   <span class="cnt">${evs.length} ${evs.length===1?'hito':'hitos'}</span>${now?'<span class="now">Mes actual</span>':''}</div>`;
  evs.forEach(e=>{const dd=new Date(e.date+'T00:00:00');const wd=WD[dd.getDay()===0?6:dd.getDay()-1];
   const clash=(bd[e.date]||[]).filter(visible).length>1;
   html+=`<div class="ev-row" tabindex="0" role="button" data-id="${e.id}">
    <div class="cbar" style="background:${COLOR[e.cat]}"></div>
    <div class="day ${e.we?'we':''}"><span class="n">${e.d}</span><span class="w">${wd}</span></div>
    <div class="body"><div class="t">${e.txt}</div><div class="s">
     <span class="pill" style="background:${COLOR[e.cat]};font-size:9.5px;padding:2px 7px">${e.cat}</span></div></div>
    ${clash?'<div class="clash">⚠ Choque</div>':''}</div>`;});
  html+='</div>';}
 v.innerHTML=html||'<p style="color:var(--mut);text-align:center;padding:40px">Nada con este filtro. Toca + para agregar.</p>';}

function renderGrilla(){const v=$('view');const cats=CATS.filter(c=>!state.off.has(c.name));const all=getEvents();
 const nowM=new Date().getFullYear()===2026?new Date().getMonth():-1;
 let head='<th>Categoría</th>'+MESES.map((m,i)=>`<th class="${i===nowM?'nowcol':''}">${m.slice(0,3)}</th>`).join('');
 let body='';cats.forEach(c=>{let row=`<th><span class="catlabel"><span class="dot" style="background:${c.color}"></span>${c.name}</span></th>`;
  for(let m=1;m<=12;m++){const evs=all.filter(e=>e.m===m&&e.cat===c.name);const now=(m-1)===nowM?'nowcol':'';
   if(evs.length){const e0=evs[0];const lbl=evs.length>1?evs.length+' f.':(''+e0.d);
    row+=`<td class="${now}"><span class="cellev" style="background:${c.color}" data-id="${e0.id}" tabindex="0" role="button">${lbl}</span></td>`;}
   else row+=`<td class="${now}"></td>`;}
  body+=`<tr>${row}</tr>`;});
 v.innerHTML=`<div class="grid-scroll"><table class="grid"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
  <p style="color:var(--mut2);font-size:11px;text-align:center;margin:6px 0 0">Desliza para ver el año · toca una celda para el detalle</p>`;}

function renderFeriados(){const v=$('view');let cols='';
 for(const p of['CL','AR','BR']){let rows=FER[p].map(([md,name,kind])=>{const[mm,dd]=md.split('-');
   return `<div class="fer-row"><span class="fer-d mono">${dd}/${mm}</span><span class="fer-n">${name}${kind==='m'?' <i>·mov</i>':''}</span></div>`;}).join('');

function openDetail(id){const e=getEvents().find(x=>x.id===id);if(!e)return;

  ${same.length?`<div class="row"><span>Mismo día</span><b style="color:#ffd43b">⚠ ${same.map(x=>x.cat).join(', ')}</b></div>`:''}
  ${ferH}${logiH}
  <div class="actions">
   <button class="btn" onclick="openForm('${e.id}')">Editar</button>
   <button class="btn danger" onclick="delEvent('${e.id}')">Borrar</button>
   <button class="btn primary" onclick="closeSheet()">Listo</button></div>`;
 showScrim();}

function openForm(id){const e=id?events.find(x=>x.id===id):null;
 const opts=CATS.map(c=>`<option value="${c.name}" ${e&&e.cat===c.name?'selected':''}>${c.name}</option>`).join('');
 $('sheet').innerHTML=`<div class="grab"></div>
  <h3>${e?'Editar evento':'Nuevo evento'}</h3>
  <div class="field"><label>Fecha</label><input type="date" id="f_date" value="${e?e.date:'2026-'+String(new Date().getMonth()+1).padStart(2,'0')+'-01'}" min="2026-01-01" max="2026-12-31"></div>
  <div class="field"><label>Campeonato</label><select id="f_cat">${opts}</select></div>
  <div class="field"><label>Nombre / Sede</label><input id="f_txt" placeholder="Ej: 5ª Fecha San Juan" value="${e?e.txt.replace(/"/g,'&quot;'):''}"></div>
  <p style="font-size:11px;color:var(--mut2);margin:2px 0 0">Si el nombre incluye una sede conocida (San Juan, Termas, Misano…) los botones de vuelo y clima se generan solos.</p>
  <div class="actions">
   <button class="btn" onclick="closeSheet()">Cancelar</button>
   <button class="btn primary" onclick="saveForm('${id||''}')">Guardar</button></div>`;
 showScrim();}

function saveForm(id){const date=$('f_date').value,cat=$('f_cat').value,txt=$('f_txt').value.trim();
 if(!date||!txt){alert('Pon fecha y nombre');return;}
 if(id){const e=events.find(x=>x.id===id);if(e){e.date=date;e.cat=cat;e.txt=txt;}}
 else{events.push({id:'e'+Date.now(),date,cat,txt});}
 save();render();closeSheet();}
function delEvent(id){if(!confirm('¿Borrar este evento?'))return;events=events.filter(x=>x.id!==id);save();render();closeSheet();}

/* ============ ICS EXPORT ============ */
function exportIcs(){
 let l=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//GP3 Sports LATAM//Calendario 2026//ES','CALSCALE:GREGORIAN','X-WR-CALNAME:Calendario GP3 2026'];
 getEvents().forEach(e=>{const dt=e.date.replace(/-/g,'');const d2=new Date(e.date+'T00:00:00');d2.setDate(d2.getDate()+1);
  const end=d2.toISOString().slice(0,10).replace(/-/g,'');
  l.push('BEGIN:VEVENT','UID:'+e.id+'@gp3sports','DTSTART;VALUE=DATE:'+dt,'DTEND;VALUE=DATE:'+end,
   'SUMMARY:'+e.cat+' · '+e.txt,'DESCRIPTION:Calendario Oficial GP3 Sports LATAM','END:VEVENT');});
 l.push('END:VCALENDAR');
 const blob=new Blob([l.join('\r\n')],{type:'text/calendar'});const u=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=u;a.download='GP3_Calendario_2026.ics';a.click();URL.revokeObjectURL(u);}

/* ============ SCRIM ============ */
function showScrim(){$('scrim').classList.add('show');}
function closeSheet(){$('scrim').classList.remove('show');}

/* ============ EVENTS ============ */
$('seg').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;state.view=b.dataset.v;
 [...document.querySelectorAll('#seg button')].forEach(x=>x.classList.toggle('on',x===b));render();});
$('rail').addEventListener('click',toggleCat);
$('rail').addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();toggleCat(ev);}});
function toggleCat(ev){const c=ev.target.closest('.chip');if(!c)return;const cat=c.dataset.cat;
 state.off.has(cat)?state.off.delete(cat):state.off.add(cat);renderRail();render();}
$('view').addEventListener('click',ev=>{const el=ev.target.closest('[data-id]');if(el)openDetail(el.dataset.id);});
$('view').addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){const el=ev.target.closest('[data-id]');if(el){ev.preventDefault();openDetail(el.dataset.id);}}});
$('scrim').addEventListener('click',ev=>{if(ev.target.id==='scrim')closeSheet();});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeSheet();});
$('fab').addEventListener('click',()=>openForm(''));
$('btnIcs').addEventListener('click',exportIcs);
$('btnReset').addEventListener('click',()=>{if(confirm('¿Restaurar el calendario original? Se pierden los cambios de este dispositivo.')){events=JSON.parse(JSON.stringify(SEED));save();render();}});

/* ============ PIN GATE ============ */
let buf='';
function renderDots(){[...$('dots').children].forEach((d,i)=>d.classList.toggle('f',i<buf.length));}
$('pad').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;
 const k=b.dataset.k;
 if(k==='clear'){buf='';}
 else if(k==='ok'){tryPin();return;}
 else if(buf.length<6){buf+=b.textContent;}
 renderDots();
 if(buf.length===6)setTimeout(tryPin,150);});
function tryPin(){if(buf===PIN){enter();}else{$('dots').classList.add('err');setTimeout(()=>{$('dots').classList.remove('err');buf='';renderDots();},400);}}
function enter(){$('gate').style.display='none';$('hdr').style.display='';$('app').style.display='';$('fab').style.display='';
 load();renderRail();render();pullSheet();}
renderDots();
</script>
