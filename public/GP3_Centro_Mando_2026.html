<style>
:root{
  --bg:#0c0d12; --panel:#14161f; --panel2:#191c27; --line:#262a38;
  --ink:#eef0f5; --mut:#8990a4; --mut2:#5a6076; --signal:#13e2c8;
  --rad:14px; --shadow:0 8px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:0 0 64px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
a{color:inherit}
.mono{font-family:'JetBrains Mono',monospace}
.osw{font-family:Oswald,sans-serif}

/* TOP BAR */
header{position:sticky;top:0;z-index:30;background:rgba(12,13,18,.86);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:12px;padding:13px 16px;max-width:1080px;margin:0 auto}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-family:Oswald;font-weight:700;letter-spacing:.06em;font-size:16px;text-transform:uppercase}
.brand span{font-size:10.5px;color:var(--mut);letter-spacing:.18em;text-transform:uppercase;margin-top:3px}
.seg{margin-left:auto;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font-family:Oswald;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  background:none;border:0;color:var(--mut);padding:8px 14px;cursor:pointer}
.seg button.on{background:var(--signal);color:#062b27;font-weight:600}

/* HERO próximo evento */
.hero{margin:18px 0 6px;background:linear-gradient(135deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:var(--rad);padding:18px 20px;display:flex;
  align-items:center;gap:20px;position:relative;overflow:hidden}
.hero .bar{position:absolute;left:0;top:0;bottom:0;width:6px}
.hero .lbl{font-family:Oswald;letter-spacing:.18em;text-transform:uppercase;font-size:10.5px;color:var(--mut)}
.hero .cd{font-family:Oswald;font-weight:700;font-size:46px;line-height:.9;margin-top:2px}
.hero .cd small{font-size:14px;color:var(--mut);font-weight:500;letter-spacing:.05em}
.hero .ev{flex:1}
.hero .ev .name{font-family:Oswald;font-weight:600;font-size:21px;margin:0 0 4px}
.hero .ev .meta{font-size:13px;color:var(--mut);display:flex;gap:14px;flex-wrap:wrap}
.hero .ev .meta b{color:var(--ink);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
  padding:3px 9px;border-radius:999px;color:#fff;font-family:Oswald;letter-spacing:.05em}

/* FILTER RAIL */
.rail{display:flex;gap:7px;overflow-x:auto;padding:14px 0 10px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel);border-radius:999px;
  padding:7px 13px;font-size:12.5px;font-weight:500;color:var(--mut);transition:.12s;user-select:none}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip.on{color:var(--ink);border-color:transparent}
.chip.off{opacity:.4}

/* AGENDA */
.month{margin:20px 0}
.month-h{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.month-h h2{font-family:Oswald;font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:17px;margin:0}
.month-h .cnt{font-size:11px;color:var(--mut2);font-family:'JetBrains Mono'}
.month-h .now{margin-left:auto;font-size:10px;font-family:Oswald;letter-spacing:.12em;
  color:var(--signal);border:1px solid var(--signal);padding:2px 8px;border-radius:999px}
.ev-row{display:flex;align-items:stretch;gap:0;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;margin-bottom:8px;overflow:hidden;cursor:pointer;transition:.12s}
.ev-row:hover,.ev-row:focus-visible{border-color:var(--mut2);transform:translateY(-1px);outline:none}
.ev-row .cbar{width:5px;flex:0 0 5px}
.ev-row .day{flex:0 0 58px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 0;border-right:1px solid var(--line)}
.ev-row .day .n{font-family:Oswald;font-weight:700;font-size:22px;line-height:1}
.ev-row .day .w{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}
.ev-row .day.we .n{color:#ff6b6b}
.ev-row .body{flex:1;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.ev-row .body .t{font-weight:600;font-size:15px;margin:0 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-row .body .s{font-size:12px;color:var(--mut);display:flex;gap:10px;align-items:center}
.ev-row .clash{flex:0 0 auto;align-self:center;margin-right:12px;font-size:10px;font-family:Oswald;
  letter-spacing:.08em;color:#ffd43b;border:1px solid #5c5018;background:#241f08;padding:3px 8px;border-radius:6px}

/* GRILLA */
.grid-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin:18px 0}
table.grid{border-collapse:collapse;width:100%;min-width:760px;font-size:11px}
table.grid th,table.grid td{border:1px solid var(--line);padding:0}
table.grid thead th{background:var(--panel2);font-family:Oswald;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;font-size:11px;color:var(--mut);padding:9px 6px;position:sticky;top:0}
table.grid tbody th{background:var(--panel);text-align:left;padding:0 10px;white-space:nowrap;position:sticky;left:0;z-index:2}
.catlabel{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:12px;padding:9px 0}
.catlabel .dot{width:9px;height:9px;border-radius:50%}
table.grid td{height:34px;text-align:center;vertical-align:middle;background:var(--bg)}
table.grid td.nowcol{background:#0f1820}
.cellev{display:block;height:100%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:600;font-size:10px;font-family:Oswald;letter-spacing:.02em;cursor:pointer;
  padding:3px 5px;line-height:1.05}

/* MODAL */
.scrim{position:fixed;inset:0;background:rgba(4,5,9,.72);backdrop-filter:blur(3px);
  display:none;align-items:flex-end;justify-content:center;z-index:50}
.scrim.show{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-bottom:0;
  border-radius:18px 18px 0 0;width:100%;max-width:520px;padding:22px 22px 30px;
  box-shadow:var(--shadow);animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 16px}
.sheet h3{font-family:Oswald;font-weight:600;font-size:23px;margin:8px 0 4px}
.sheet .row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.sheet .row span{color:var(--mut)}
.sheet .row b{font-weight:600}
.sheet .close{margin-top:18px;width:100%;background:var(--panel2);border:1px solid var(--line);
  color:var(--ink);font-family:Oswald;letter-spacing:.08em;text-transform:uppercase;font-size:13px;
  padding:13px;border-radius:11px;cursor:pointer}
.foot{text-align:center;color:var(--mut2);font-size:11px;margin:34px 0 0;font-family:'JetBrains Mono'}
@media(min-width:560px){.scrim{align-items:center}.sheet{border-radius:18px;border-bottom:1px solid var(--line)}.sheet .grab{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* FERIADOS */
.fer-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.fer-col{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fer-h{font-family:Oswald;font-weight:600;letter-spacing:.04em;font-size:14px;padding:11px 12px;
  background:var(--panel2);border-bottom:1px solid var(--line)}
.fer-row{display:flex;gap:9px;padding:8px 12px;border-bottom:1px solid var(--line);align-items:baseline;font-size:12.5px}
.fer-row:last-child{border-bottom:0}
.fer-d{color:var(--signal);font-size:11px;flex:0 0 42px}
.fer-n{color:var(--ink)}
.fer-n i{color:var(--mut2);font-style:normal;font-size:10px}
@media(max-width:560px){.fer-wrap{grid-template-columns:1fr}}

/* DETAIL logistics */
.fer-near{background:#241f08;border:1px solid #5c5018;border-radius:11px;padding:11px 13px;margin:14px 0}
.fer-near-h{font-family:Oswald;letter-spacing:.06em;font-size:12px;color:#ffd43b;margin-bottom:6px}
.fer-near-r{display:flex;justify-content:space-between;font-size:12.5px;color:#f0e3b0;padding:2px 0}
.logi-btns{display:flex;gap:10px;margin:16px 0 0}
.logi-btn{flex:1;display:flex;align-items:center;gap:11px;text-decoration:none;
  background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px;transition:.12s}
.logi-btn:hover{border-color:var(--signal)}
.logi-btn .ico{font-size:19px}
.logi-btn span span,.logi-btn>span:last-child{display:flex;flex-direction:column}
.logi-btn small{color:var(--mut);font-size:10.5px;margin-top:2px}
.logi-btn{font-family:Oswald;font-weight:600;font-size:13.5px;color:var(--ink);letter-spacing:.02em}
</style>

    <div class="ev">
      <div class="name">${e.txt}</div>
      <div class="meta">
        <span class="pill" style="background:${col}">${e.cat}</span>
        <span><b>${e.flag} ${e.pais}</b></span>
        <span>${WD[new Date(e.date+'T00:00:00').getDay()===0?6:new Date(e.date+'T00:00:00').getDay()-1]} ${e.d} ${MESES[e.m-1].toLowerCase()}</span>
      </div>
    </div>`;
}

function renderRail(){
  const r = document.getElementById('rail');
  r.innerHTML = DATA.cats.map(c=>{
    const on = !state.off.has(c.name);
    return `<div class="chip ${on?'on':'off'}" data-cat="${c.name}" tabindex="0" role="button" aria-pressed="${on}">
      <span class="dot" style="background:${c.color}"></span>${c.name}</div>`;
  }).join('');
}

function renderAgenda(){
  const v = document.getElementById('view');
  let html = '';
  for(let m=1;m<=12;m++){
    const evs = DATA.events.filter(e=>e.m===m && visible(e));
    if(!evs.length) continue;
    const isNow = TODAY.getFullYear()===2026 && TODAY.getMonth()===m-1;
    html += `<div class="month"><div class="month-h">
      <h2>${MESES[m-1]}</h2><span class="cnt">${evs.length} ${evs.length===1?'hito':'hitos'}</span>
      ${isNow?'<span class="now">Mes actual</span>':''}</div>`;
    evs.forEach(e=>{
      const dd = new Date(e.date+'T00:00:00');
      const wd = WD[dd.getDay()===0?6:dd.getDay()-1];
      const clash = (byDate[e.date]||[]).filter(x=>visible(x)).length>1;
      html += `<div class="ev-row" tabindex="0" role="button" data-date="${e.date}" data-cat="${e.cat}">
        <div class="cbar" style="background:${COLOR[e.cat]}"></div>
        <div class="day ${e.we?'we':''}"><span class="n">${e.d}</span><span class="w">${wd}</span></div>
        <div class="body"><div class="t">${e.txt}</div>
          <div class="s"><span class="pill" style="background:${COLOR[e.cat]};font-size:10px;padding:2px 7px">${e.cat}</span>
          <span>${e.flag} ${e.pais}</span></div></div>
        ${clash?'<div class="clash">⚠ Choque</div>':''}
      </div>`;
    });
    html += '</div>';
  }
  v.innerHTML = html || '<p style="color:var(--mut);text-align:center;padding:40px">Nada que mostrar con este filtro.</p>';
}

function renderGrilla(){
  const v = document.getElementById('view');
  const cats = DATA.cats.filter(c=>!state.off.has(c.name));
  let head = '<th>Categoría</th>'+MESES.map((m,i)=>`<th class="${TODAY.getMonth()===i&&TODAY.getFullYear()===2026?'nowcol':''}">${m.slice(0,3)}</th>`).join('');
  let body = '';
  cats.forEach(c=>{
    let row = `<th><span class="catlabel"><span class="dot" style="background:${c.color}"></span>${c.name}</span></th>`;
    for(let m=1;m<=12;m++){
      const evs = DATA.events.filter(e=>e.m===m && e.cat===c.name);
      const now = TODAY.getMonth()===m-1&&TODAY.getFullYear()===2026?'nowcol':'';
      if(evs.length){
        const e0=evs[0];
        const label = evs.length>1?evs.length+' fechas':(''+e0.d);
        row += `<td class="${now}"><span class="cellev" style="background:${c.color}" data-date="${e0.date}" data-cat="${c.name}" tabindex="0" role="button">${label}</span></td>`;
      } else row += `<td class="${now}"></td>`;
    }
    body += `<tr>${row}</tr>`;
  });
  v.innerHTML = `<div class="grid-scroll"><table class="grid"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
    <p style="color:var(--mut2);font-size:11px;text-align:center;margin:6px 0 0">Desliza horizontalmente para ver todo el año · toca una celda para el detalle</p>`;
}

const PAISNAME={CL:'🇨🇱 Chile',AR:'🇦🇷 Argentina',BR:'🇧🇷 Brasil'};
function holidaysNear(dateStr){
  const d=new Date(dateStr+'T00:00:00'); const out=[];
  for(const p of ['CL','AR','BR']){
    for(const [md,name,kind] of DATA.feriados[p]){
      const hd=new Date('2026-'+md+'T00:00:00');
      const diff=Math.round((hd-d)/86400000);
      if(Math.abs(diff)<=3) out.push({p,name,kind,diff,md});
    }
  }
  return out.sort((a,b)=>a.diff-b.diff);
}
function renderFeriados(){
  const v=document.getElementById('view');
  let cols='';
  for(const p of ['CL','AR','BR']){
    let rows=DATA.feriados[p].map(([md,name,kind])=>{
      const [mm,dd]=md.split('-');
      return `<div class="fer-row"><span class="fer-d mono">${dd}/${mm}</span>
        <span class="fer-n">${name}${kind==='m'?' <i>·mov</i>':''}</span></div>`;
    }).join('');
    cols+=`<div class="fer-col"><div class="fer-h">${PAISNAME[p]}</div>${rows}</div>`;
  }
  v.innerHTML=`<div class="fer-wrap">${cols}</div>
    <p style="color:var(--mut2);font-size:11.5px;text-align:center;margin:14px 0 0;line-height:1.5">
    Feriados nacionales 2026 de referencia. Los marcados <b>·mov</b> son movibles o se trasladan a lunes por ley — confírmalos antes de cerrar viajes.<br>
    Cuando conectemos la app, esto se cruza solo con tus eventos y te avisa si caés en feriado.</p>`;
}
function render(){
  renderHero();
  if(state.view==='agenda') renderAgenda();
  else if(state.view==='grilla') renderGrilla();
  else renderFeriados();
}

function openSheet(date,cat){
  const e = (byDate[date]||[]).find(x=>x.cat===cat) || byDate[date]?.[0];
  if(!e) return;
  const dd = new Date(date+'T00:00:00');
  const wd = WD[dd.getDay()===0?6:dd.getDay()-1];
  const same = (byDate[date]||[]).filter(x=>x.cat!==cat && visible(x));
  const near = holidaysNear(date);
  const L = e.logi;
  let logiHtml = '';
  if(L){
    logiHtml = `
    <div class="row"><span>Clima típico</span><b>${L.clima}</b></div>
    <div class="logi-btns">
      <a class="logi-btn" href="${L.flight}" target="_blank" rel="noopener">
        <span class="ico">✈</span><span>Buscar vuelos<small>Google Flights · SCL→${L.iata} · USD</small></span></a>
      <a class="logi-btn" href="${L.hotel}" target="_blank" rel="noopener">
        <span class="ico">🛏</span><span>Buscar hoteles<small>${L.city} · USD</small></span></a>
    </div>`;
  }
  let ferHtml = '';
  if(near.length){
    ferHtml = `<div class="fer-near"><div class="fer-near-h">⚠ Feriados en esos días</div>` +
      near.map(h=>{
        const rel = h.diff===0?'el mismo día':h.diff>0?`+${h.diff}d`:`${h.diff}d`;
        return `<div class="fer-near-r"><span>${PAISNAME[h.p].split(' ')[0]} ${h.name}</span><span class="mono">${rel}</span></div>`;
      }).join('') + `</div>`;
  }
  const s = document.getElementById('sheet');
  s.innerHTML = `<div class="grab"></div>
    <span class="pill" style="background:${COLOR[e.cat]}">${e.cat}</span>
    <h3>${e.txt}</h3>
    <div class="row"><span>Fecha</span><b>${wd} ${e.d} de ${MESES[e.m-1].toLowerCase()} 2026</b></div>
    <div class="row"><span>Tipo de día</span><b>${e.we?'Fin de semana 🏁':'Día de semana'}</b></div>
    <div class="row"><span>País</span><b>${e.flag} ${e.pais}</b></div>
    ${L?`<div class="row"><span>Sede</span><b>${L.city}</b></div>`:''}
    ${same.length?`<div class="row"><span>Mismo día</span><b style="color:#ffd43b">⚠ ${same.map(x=>x.cat).join(', ')}</b></div>`:''}
    ${ferHtml}
    ${logiHtml}
    <button class="close" id="closeSheet">Cerrar</button>`;
  document.getElementById('scrim').classList.add('show');
}
function closeSheet(){document.getElementById('scrim').classList.remove('show');}

// EVENTS
document.getElementById('seg').addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b)return;
  state.view=b.dataset.v;
  [...document.querySelectorAll('#seg button')].forEach(x=>x.classList.toggle('on',x===b));
  render();
});
document.getElementById('rail').addEventListener('click',ev=>toggleCat(ev));
document.getElementById('rail').addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();toggleCat(ev);}});
function toggleCat(ev){
  const c=ev.target.closest('.chip'); if(!c)return;
  const cat=c.dataset.cat;
  state.off.has(cat)?state.off.delete(cat):state.off.add(cat);
  renderRail(); render();
}
document.getElementById('view').addEventListener('click',ev=>{
  const el=ev.target.closest('[data-date]'); if(!el)return;
  openSheet(el.dataset.date,el.dataset.cat);
});
document.getElementById('view').addEventListener('keydown',ev=>{
  if(ev.key==='Enter'||ev.key===' '){const el=ev.target.closest('[data-date]');if(el){ev.preventDefault();openSheet(el.dataset.date,el.dataset.cat);}}
});
document.getElementById('scrim').addEventListener('click',ev=>{
  if(ev.target.id==='scrim'||ev.target.id==='closeSheet')closeSheet();
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeSheet();});

renderRail(); render();
</script>
