/* ============ motor de cálculo ============ */
const scVal=(S,k)=>S.sc[k][S.params.escenario];
function conv(v,cur,P){return cur==='CLP'?v/P.dolar:cur==='EUR'?v*P.euro:v}
function multVal(m,P){return m==='pilotos'?P.pilotos:m==='motos'?P.motos:1}
function fechasByMonth(S){const n=Z(),f=Z(),a=Z();S.fechas.forEach(x=>{if(x.corre){n[x.mes]++; if(x.frontera)f[x.mes]++; if(x.avion)a[x.mes]++;}});return {n,f,a,total:sum(n)}}
function itemSeries(S,it,fm){
  const P=S.params; const unit=it.sc?scVal(S,it.sc):(+it.unit||0);
  const occ=conv(unit*(+it.qty||0)*multVal(it.mult,P),it.moneda,P); const out=Z();
  for(let p=0;p<13;p++){
    switch(it.cad){
      case 'fecha':out[p]=occ*fm.n[p];break;
      case 'fecha_frontera':out[p]=occ*fm.f[p];break;
      case 'fecha_avion':out[p]=occ*fm.a[p];break;
      case 'mensual':out[p]=(p>=it.desde&&p<=it.hasta)?occ:0;break;
      case 'mes':out[p]=(p===+it.mes)?occ:0;break;
      case 'total_fechas':out[p]=fm.total?occ/fm.total*fm.n[p]:0;break;
    }
  }
  return out;
}
function planSeries(plan){const r=Z();plan.forEach(c=>{r[periodOf(c.f)]+=+c.m||0});return r}
function sponsorIncluded(sp,mode){ if(!sp.incluir) return false; if(mode==='todos') return true; if(mode==='sin_meta') return sp.estado!=='Por confirmar'; return sp.estado==='Firmado'; }
function compute(S,opt={}){
  const P=S.params, team=!!opt.team, fm=fechasByMonth(S), today=todayStr();
  const items=S.items.filter(it=>!(team&&it.conf)); const lines=[]; const cargable=Z();
  items.forEach(it=>{ if(it.kind==='pct') return; const s=itemSeries(S,it,fm); lines.push({it,s,total:sum(s)}); if(it.tipo==='gasto'&&it.cargable) addTo(cargable,s); });
  items.forEach(it=>{ if(it.kind!=='pct') return; const s=cargable.map(v=>v*(+it.pct||0)); lines.push({it,s,total:sum(s)}); });
  const gLines=lines.filter(l=>l.it.tipo==='gasto'), iLines=lines.filter(l=>l.it.tipo==='ingreso');
  const subtotal=Z(); gLines.forEach(l=>addTo(subtotal,l.s));
  const imprevPct=scVal(S,'imprevistos'); const imprev=subtotal.map(v=>v*imprevPct);
  const gastos=subtotal.map((v,i)=>v+imprev[i]);
  const byGroup={}; gLines.forEach(l=>{const g=l.it.grupo||'Otros'; byGroup[g]=addTo(byGroup[g]||Z(),l.s)});
  const spLines=[]; S.sponsors.forEach(sp=>{ if(!sponsorIncluded(sp,S.ui.ingMode)) return; const tot=conv(+sp.monto||0,sp.moneda,P); const s=Z();
    if(sp.modo==='fechas'){ fm.n.forEach((n,i)=>s[i]=fm.total?tot/fm.total*n:0) } else { for(let i=0;i<13;i++) s[i]=tot*(+sp.reparto[i]||0) }
    spLines.push({sp,s,total:sum(s),pct:sp.modo==='fechas'?1:sum(sp.reparto)}); });
  const act=S.pilotos.filter(p=>p.estado!=='Baja');
  const st={pagado:Z(),pend:Z(),venc:Z(),sin:Z()}; const rost=Z();
  act.forEach(p=>p.cuotas.forEach(c=>{const per=periodOf(c.fecha),m=+c.monto||0; rost[per]+=m; const rec=c.pagado?m:Math.min(m,Math.max(+c.mpago||0,0)); st.pagado[per]+=rec; if(m-rec>0.004){ if(c.fecha<today) st.venc[per]+=m-rec; else st.pend[per]+=m-rec }}));
  const nSin=Math.max(0,P.pilotos-act.length); const std=planSeries(S.planes.estandar); const unas=std.map(v=>v*nSin); st.sin=unas;
  const pilotGross=rost.map((v,i)=>v+unas[i]); const nc=scVal(S,'noCobradas'); const pilotLoss=pilotGross.map(v=>-v*nc);
  const pilotNet=pilotGross.map((v,i)=>v+pilotLoss[i]);
  const ing=Z(); spLines.forEach(l=>addTo(ing,l.s)); addTo(ing,pilotNet); iLines.forEach(l=>addTo(ing,l.s));
  const neto=ing.map((v,i)=>v-gastos[i]); const saldo=Z(); let acc=+P.saldoInicial||0; for(let i=0;i<13;i++){acc+=neto[i];saldo[i]=acc}
  const Ting=sum(ing), Tgas=sum(gastos), res=Ting-Tgas; let mi=0; for(let i=1;i<13;i++) if(saldo[i]<saldo[mi]) mi=i;
  const groups=Object.keys(byGroup).map(g=>({g,total:sum(byGroup[g]),s:byGroup[g]})); if(sum(imprev)>0) groups.push({g:'Imprevistos',total:sum(imprev),s:imprev});
  const sources=spLines.map(l=>({g:l.sp.nombre,total:l.total})); sources.push({g:'Pilotos (neto de cuotas no cobradas)',total:sum(pilotNet)}); iLines.forEach(l=>{if(l.total>0) sources.push({g:l.it.nombre,total:l.total})});

    porPiloto:P.pilotos?Tgas/P.pilotos:0,porFecha:fm.total?Tgas/fm.total:0,cobertura:Tgas?sum(pilotNet)/Tgas:0,groups,sources,real:realTotals(S,team)};
}
function realTotals(S,team){const by={}; let tot=S.realBackendUSD||0; S.real.forEach(r=>{const it=S.items.find(x=>x.id===r.itemId); if(team&&it&&it.conf) return; const u=conv(+r.monto||0,r.moneda,S.params); by[r.itemId||'_']=(by[r.itemId||'_']||0)+u; tot+=u}); return {by,tot}}

function mny(usd,o={}){const cl=S.ui.cur==='CLP'; const v=cl?usd*S.params.dolar:usd; const a=nf.format(Math.round(Math.abs(v))); return (v<0&&Math.round(Math.abs(v))>0?'−':'')+(cl?'$ ':'US$ ')+a}
function num(usd){const cl=S.ui.cur==='CLP'; const v=cl?usd*S.params.dolar:usd; const r=Math.round(v); return r===0?'–':(r<0?'−':'')+nf.format(Math.abs(r))}
function compact(usd){const cl=S.ui.cur==='CLP'; const v=(cl?usd*S.params.dolar:usd); const a=Math.abs(v); const s=v<0?'−':'';
  if(a>=1e9) return s+nf1.format(a/1e9)+' MM'; if(a>=1e6) return s+nf1.format(a/1e6)+' M'; if(a>=1e3) return s+nf.format(Math.round(a/1e3))+' mil'; return s+nf.format(Math.round(a))}

function niceTicks(min,max,n=5){ if(min===max){max=min+1}; const span=max-min,step0=span/n,mag=Math.pow(10,Math.floor(Math.log10(step0))); const r=step0/mag; const step=(r<=1?1:r<=2?2:r<=2.5?2.5:r<=5?5:10)*mag; const a=Math.floor(min/step)*step,b=Math.ceil(max/step)*step; const t=[];for(let v=a;v<=b+step/2;v+=step)t.push(v);return t}

function cobChart(C){
  const W=980,H=240,L=60,R=14,T=12,B=30; const cl=S.ui.cur==='CLP'; const k=cl?S.params.dolar:1;
  const tot=C.st.pagado.map((v,i)=>v+C.st.pend[i]+C.st.venc[i]+C.st.sin[i]); const ticks=niceTicks(0,Math.max(1,...tot)*k); const hi=ticks[ticks.length-1];
  const cw=(W-L-R)/13,bw=Math.min(34,cw*.6); const yy=v=>T+(hi-v*k)/hi*(H-T-B); let s='';
  ticks.forEach(t=>{const y=T+(hi-t)/hi*(H-T-B); s+=`<line class="${t===0?'zero':'grid'}" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-8}" y="${y+4}" text-anchor="end">${esc(compact(t/k))}</text>`});
  const defs='<defs><pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--card)"/><rect width="2.5" height="6" fill="var(--ink3)"/></pattern></defs>';
  for(let i=0;i<13;i++){ const cx=L+cw*i+cw/2; let acc=0; const segs=[['pagado','var(--inc)'],['pend','var(--pend)'],['venc','var(--crit)'],['sin','url(#hp)']];
    segs.forEach(([key,col])=>{const v=C.st[key][i]; if(v<=0) return; const y1=yy(acc),y2=yy(acc+v); s+=`<rect x="${cx-bw/2}" y="${y2}" width="${bw}" height="${Math.max(0,y1-y2-2)}" fill="${col}" ${col.startsWith('url')?'stroke="var(--ink3)" stroke-width="1"':''} rx="2"/>`; acc+=v;});
    s+=`<text x="${cx}" y="${H-10}" text-anchor="middle">${MONTHS[i]}</text>`;
    const tip=`${MFULL[i]}\nPagado: ${mny(C.st.pagado[i])}\nPendiente al día: ${mny(C.st.pend[i])}\nVencido: ${mny(C.st.venc[i])}\nSin piloto asignado: ${mny(C.st.sin[i])}`;
    s+=`<rect data-tip="${esc(tip)}" x="${L+cw*i}" y="${T}" width="${cw}" height="${H-T-B}" fill="transparent"/>`; }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cuotas de pilotos por mes según estado">${defs}${s}</svg>
  <div class="legend"><span><i style="background:var(--inc)"></i>Pagado</span><span><i style="background:var(--pend)"></i>Pendiente al día</span><span><i style="background:var(--crit)"></i>Vencido</span><span><i style="background:repeating-linear-gradient(45deg,var(--ink3) 0 2px,var(--card) 2px 5px);border:1px solid var(--ink3)"></i>Plan estándar sin piloto asignado</span></div>`;
}

/* ============ componentes de formulario ============ */
const inp=(path,v,t='n',extra='')=>`<input data-path="${path}" data-t="${t}" type="${t==='n'||t==='p'?'number':t==='d'?'date':'text'}" ${t==='n'||t==='p'?'step="any"':''} value="${esc(t==='p'?+(v*100).toFixed(4):v)}" ${extra}>`;
const sel=(path,v,opts,extra='')=>`<select data-path="${path}" data-t="s" ${extra}>${opts.map(o=>{const [val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lab)}</option>`}).join('')}</select>`;
const chk=(path,v,extra='')=>`<input type="checkbox" data-path="${path}" data-t="b" ${v?'checked':''} ${extra}>`;
const monthOpts=MONTHS.map((m,i)=>[i,m]);
const CAD=[['fecha','Cada fecha'],['fecha_frontera','Cada fecha con frontera'],['fecha_avion','Cada fecha con staff en avión'],['total_fechas','Total repartido en las fechas'],['mensual','Todos los meses (rango)'],['mes','Una sola vez (mes)']];
const MULT=[['1','—'],['pilotos','× pilotos'],['motos','× motos']];
const MONEDAS=['USD','CLP','EUR'];
function pillS(e){return `<span class="pill ${e.cls}">${e.ic} ${esc(e.txt)}</span>`}

/* ============ vistas ============ */
let C=null;
const TABS=[['resumen','📊 Resumen'],['presupuesto','💵 Presupuesto'],['flujo','📈 Flujo de caja'],['calendario','🏁 Calendario'],['sponsors','🤝 Sponsors'],['pilotos','🧑 Pilotos'],['cobranza','💰 Cobranza'],['real','📱 Gastos reales'],['ajustes','⚙️ Ajustes']];
function kpi(lab,val,note,bad){return `<div class="card kpi ${bad?'bad':''}"><div class="lab">${lab}</div><div class="val">${val}</div><div class="note">${note}</div></div>`}
function alerts(C){ const A=[]; const today=todayStr();
  if(C.minSaldo<0) A.push(['crit','Caja negativa',`La caja queda negativa en ${MFULL[C.minMes]} (${mny(C.minSaldo)}). Faltan ${mny(C.extra)} de caja, o hay que mover gastos o adelantar cobros.`]);
  const pend=sum(S.sponsors.filter(s=>s.incluir&&s.estado==='Por confirmar').map(s=>conv(+s.monto,s.moneda,S.params)));
  const totS=sum(S.sponsors.filter(s=>s.incluir).map(s=>conv(+s.monto,s.moneda,S.params)));
  if(pend>0) A.push(['warn','Ingresos sin firmar',`${mny(pend)} de sponsors (${pc(totS?pend/totS:0)} del total de sponsors) siguen en "Por confirmar". Cambia su estado en la pestaña Sponsors.`]);
  if(C.nSin>0) A.push(['warn','Pilotos sin cargar',`Hay ${S.pilotos.filter(p=>p.estado!=='Baja').length} pilotos cargados de ${S.params.pilotos}. Los ${C.nSin} restantes se proyectan con el plan estándar.`]);
  if(S.pilotos.filter(p=>p.estado!=='Baja').length>S.params.pilotos) A.push(['warn','Más pilotos que el presupuesto',`Hay ${S.pilotos.filter(p=>p.estado!=='Baja').length} pilotos y el presupuesto usa ${S.params.pilotos}. Ajusta la cantidad en Ajustes.`]);
  const venc=allCuotas().filter(x=>x.e.d>0&&!x.c.pagado); if(venc.length) A.push(['crit','Cuotas vencidas',`${venc.length} cuota(s) vencida(s) por ${mny(sum(venc.map(x=>saldoC(x.c))))}. Revisa la pestaña Cobranza.`]);
  const prox=allCuotas().filter(x=>x.e.k==='proxima'); if(prox.length) A.push(['warn','Cuotas por vencer',`${prox.length} cuota(s) vencen en los próximos ${S.mora.diasRecordar} días (${mny(sum(prox.map(x=>saldoC(x.c))))}).`]);
  const cot=S.items.filter(i=>i.tipo==='gasto'&&!i.kind&&(+i.unit||0)===0&&!i.sc).length; if(cot) A.push(['warn','Ítems por cotizar',`${cot} gastos están en 0 y no están en el resultado (pestaña Presupuesto, bloque "Por cotizar").`]);
  const nd=S.fechas.filter(f=>f.corre&&f.pais==='Por definir').length; if(nd) A.push(['warn','Calendario provisorio',`${nd} fecha(s) sin país definido. Los meses son estimados hasta que se confirme el calendario del FIM MotoJunior.`]);
  if(!A.length) A.push(['good','Sin alertas','Todo está al día con los datos cargados.']);
  return A.map(a=>`<div class="alert"><span class="pill ${a[0]}">${a[0]==='crit'?'▲ Crítico':a[0]==='warn'?'● Atención':'✔ Bien'}</span><div class="t"><b>${esc(a[1])}.</b> ${esc(a[2])}</div></div>`).join('')}
function vResumen(){
  const sc=['Optimista','Base','Pesimista'].map(n=>({n,c:withMod(s=>{s.params.escenario=n},{team:S.ui.vista==='equipo'})}));
  const wi=[['Escenario activo (' + S.params.escenario + ')',null],
    ['Sin el aporte 2 de Honda',s=>{const x=s.sponsors.find(z=>z.id==='sp_h2'); if(x) x.incluir=false},s=>s.sponsors.some(z=>z.id==='sp_h2')],

    ['Ocurren las dos cosas anteriores',s=>{const a=s.sponsors.find(z=>z.id==='sp_h2'); if(a) a.incluir=false; const b=s.sponsors.find(z=>z.id==='sp_mob'||z.id==='sp_mobil'); if(b) b.monto=200000},s=>s.sponsors.some(z=>z.id==='sp_h2')&&s.sponsors.some(z=>z.id==='sp_mob'||z.id==='sp_mobil')],

   ${kpi('Resultado antes de impuestos',mny(C.res),'Margen '+pc(C.margen),C.res<0)}
   ${kpi('Caja más baja del año',mny(C.minSaldo),C.minSaldo<0?'▼ '+MFULL[C.minMes]+' · faltan '+mny(C.extra):MFULL[C.minMes],C.minSaldo<0)}
   ${kpi('Gasto por piloto',mny(C.porPiloto),'Cada piloto paga US$ '+nf.format(S.mora.precio))}
   ${kpi('Gasto por fecha',mny(C.porFecha),C.fm.total+' fechas · '+sum(C.fm.f)+' cruzan frontera')}
   ${kpi('Pilotos cubren el gasto',pc(C.cobertura),'Cuotas de pilotos ÷ gastos del año')}
   ${kpi('Gasto real acumulado',mny(r.tot),C.Tgas?pc(r.tot/C.Tgas)+' del presupuesto de gastos':'')}
  </div>
  <div class="sec grid three">
    <div class="card"><h2>Caja mes a mes</h2>${flowChart(C)}</div>
    <div class="card"><h2>Alertas</h2>${alerts(C)}</div>
  </div>
  <div class="sec grid two">
    <div class="card"><h2>Gastos por bloque</h2>${hbars(C.groups.slice().sort((a,b)=>b.total-a.total),'var(--exp)')}</div>
    <div class="card"><h2>Ingresos por fuente</h2>${hbars(C.sources.slice().sort((a,b)=>b.total-a.total),'var(--inc)')}</div>
  </div>
  <div class="sec grid two">
    <div class="card"><h2>Tres escenarios</h2><div class="tw"><table><thead><tr><th></th>${sc.map(x=>`<th class="r">${x.n}</th>`).join('')}</tr></thead><tbody>
      <tr><td>Ingresos</td>${sc.map(x=>`<td class="r">${mny(x.c.Ting)}</td>`).join('')}</tr>
      <tr><td>Gastos</td>${sc.map(x=>`<td class="r">${mny(x.c.Tgas)}</td>`).join('')}</tr>
      <tr class="tot"><td>Resultado</td>${sc.map(x=>`<td class="r ${x.c.res<0?'neg':''}">${mny(x.c.res)}</td>`).join('')}</tr>
      <tr><td>Margen</td>${sc.map(x=>`<td class="r">${pc(x.c.margen)}</td>`).join('')}</tr>
      <tr><td>Caja más baja</td>${sc.map(x=>`<td class="r ${x.c.minSaldo<0?'neg':''}">${mny(x.c.minSaldo)}</td>`).join('')}</tr></tbody></table></div>
      <p class="note">Solo cambian transporte, aduana, imprevistos y cuotas no cobradas (Ajustes).</p></div>
    <div class="card"><h2>¿Y si…?</h2><div class="tw"><table><thead><tr><th>Supuesto</th><th class="r">Resultado</th><th class="r">Caja más baja</th></tr></thead><tbody>
      ${wi.map(x=>`<tr><td>${esc(x.lab)}</td><td class="r ${x.c.res<0?'neg':''}">${mny(x.c.res)}</td><td class="r ${x.c.minSaldo<0?'neg':''}">${mny(x.c.minSaldo)}</td></tr>`).join('')}</tbody></table></div>
      <p class="note">Cálculo instantáneo sobre una copia: no cambia tus datos.</p></div>
  </div>`;
}
function vPresupuesto(){
  const groups=[]; S.items.forEach(it=>{const k=it.tipo+'|'+(it.grupo||'Otros'); let g=groups.find(x=>x.k===k); if(!g){g={k,tipo:it.tipo,grupo:it.grupo||'Otros',its:[]};groups.push(g)} g.its.push(it)});
  groups.sort((a,b)=>(a.tipo===b.tipo?0:a.tipo==='gasto'?-1:1));
  const lineOf=id=>C.lines.find(l=>l.it.id===id);
  const gl=[...new Set(S.items.map(i=>i.grupo))];
  let rows='';
  // ingresos resumen
  rows+=`<tr class="grp"><td colspan="11">INGRESOS · sponsors y pilotos (se editan en sus pestañas)</td></tr>`;
  C.spLines.forEach(l=>{rows+=`<tr><td>${esc(l.sp.nombre)}</td><td colspan="8" class="muted">Sponsor · <span class="pill neu">${esc(l.sp.estado)}</span></td><td class="r v">${num(l.total)}</td><td></td></tr>`});
  rows+=`<tr><td>Inscripciones de pilotos</td><td colspan="8" class="muted">${S.params.pilotos} pilotos · plan según cada piloto</td><td class="r v">${num(sum(C.pilotGross))}</td><td></td></tr>`;
  rows+=`<tr><td>Menos: cuotas de pilotos que no se cobran</td><td colspan="8" class="muted">${pc(scVal(S,'noCobradas'))} según escenario</td><td class="r v neg">${num(sum(C.pilotLoss))}</td><td></td></tr>`;
  groups.forEach(g=>{
    const sub=sum(g.its.map(i=>(lineOf(i.id)||{total:0}).total));
    rows+=`<tr class="grp"><td colspan="9">${g.tipo==='ingreso'?'INGRESOS · ':'GASTOS · '}${esc(g.grupo)}</td><td class="r v" style="color:var(--ink)">${num(sub)}</td><td><button class="btn sm" data-act="addItem" data-g="${esc(g.grupo)}" data-tipo="${g.tipo}">+ ítem</button></td></tr>`;
    g.its.forEach(it=>{const l=lineOf(it.id); if(!l) return; const real=C.real.by[it.id]||0; const conf=S.ui.vista==='equipo'&&it.conf;
      const ix=`items.${it.id}`;
      let tiempo='—'; if(it.cad==='mensual') tiempo=`${sel(ix+'.desde',it.desde,monthOpts.slice(1))} a ${sel(ix+'.hasta',it.hasta,monthOpts.slice(1))}`; else if(it.cad==='mes') tiempo=sel(ix+'.mes',it.mes,monthOpts);
      if(it.kind==='pct'){
        rows+=`<tr><td><input class="nm" data-path="${ix}.nombre" data-t="s" value="${esc(it.nombre)}"></td><td colspan="3" class="r">${inp(ix+'.pct',it.pct,'p')} <span class="muted">%</span></td><td colspan="5" class="muted">de los sueldos marcados "con cargas"</td><td class="r v">${num(l.total)}</td><td>${delBtn('items',it.id)}</td></tr>`; return;}
      rows+=`<tr title="${esc(it.nota||'')}"><td><input class="nm" data-path="${ix}.nombre" data-t="s" value="${esc(it.nombre)}">${it.nota?`<div class="note">${esc(it.nota)}</div>`:''}</td>
        <td>${inp(ix+'.qty',it.qty)}</td>
        <td>${it.sc?`<span class="pill neu">según escenario</span><div class="note">${num0(scVal(S,it.sc))} ${it.moneda}</div>`:inp(ix+'.unit',it.unit)}</td>
        <td>${sel(ix+'.moneda',it.moneda,MONEDAS)}</td>
        <td>${sel(ix+'.mult',it.mult,MULT)}</td>
        <td>${sel(ix+'.cad',it.cad,CAD)}</td>
        <td>${tiempo}</td>
        <td class="r">${it.tipo==='gasto'?(it.cargable?'<span class="pill neu">con cargas</span>':''):''}${it.conf?'<span class="pill neu">confidencial</span>':''}</td>
        <td class="r v">${it.tipo==='gasto'&&real?`<span title="Gasto real cargado">${num(real)}</span>`:'<span class="muted">–</span>'}</td>
        <td class="r v">${num(l.total)}</td><td>${delBtn('items',it.id)}</td></tr>`;});
  });
  rows+=`<tr class="grp"><td colspan="11">RESULTADO</td></tr>
   <tr class="tot"><td>Total ingresos</td><td colspan="8"></td><td class="r v">${num(C.Ting)}</td><td></td></tr>
   <tr><td>Subtotal gastos</td><td colspan="8"></td><td class="r v">${num(sum(C.subtotal))}</td><td></td></tr>
   <tr><td>Imprevistos (${pc(C.imprevPct)}, según escenario)</td><td colspan="8"></td><td class="r v">${num(sum(C.imprev))}</td><td></td></tr>
   <tr class="tot"><td>Total gastos</td><td colspan="8"></td><td class="r v">${num(C.Tgas)}</td><td></td></tr>
   <tr class="tot ${C.res<0?'neg':''}"><td>Resultado antes de impuestos · margen ${pc(C.margen)}</td><td colspan="8"></td><td class="r v">${num(C.res)}</td><td></td></tr>`;
  return `<div class="sec" style="margin-top:0"><h2>Presupuesto 2027 <span class="note" style="text-transform:none;letter-spacing:0">Montos en ${S.ui.cur}. Edita cualquier celda; cada ítem puede tener otro nombre, moneda y regla de cobro.</span>
    <button class="btn pri" data-act="addItem" data-g="Nuevo bloque" data-tipo="gasto">+ Nuevo ítem de gasto</button></h2>
    <div class="tw"><table><thead><tr><th>Concepto</th><th class="r">Cantidad</th><th class="r">Valor unitario</th><th>Moneda</th><th>Multiplica</th><th>Se aplica</th><th>Cuándo</th><th></th><th class="r">Real cargado</th><th class="r">Total ${S.ui.cur}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <datalist id="grupos">${gl.map(g=>`<option value="${esc(g)}">`).join('')}</datalist>
    <p class="note">"Cantidad × valor unitario × multiplicador" es lo que cuesta cada vez. "Se aplica" decide cuántas veces y en qué meses entra al flujo. Cambia el bloque de un ítem escribiendo otro nombre de bloque en su detalle (botón Detalle).</p>
    ${vDetalleItems()}</div>`;
}
function num0(v){return nf.format(v)}
function delBtn(col,id){return `<button class="btn sm danger" data-act="del" data-col="${col}" data-id="${id}" title="Borrar" aria-label="Borrar esta fila">✕</button>`}
function vDetalleItems(){
  return `<div class="sec"><h2>Detalle por ítem <span class="note" style="text-transform:none;letter-spacing:0">Bloque, notas y marcas especiales</span></h2><div class="tw"><table><thead><tr><th>Ítem</th><th>Tipo</th><th>Bloque</th><th>Con cargas</th><th>Confidencial</th><th>Nota</th></tr></thead><tbody>`+
  S.items.map(it=>`<tr><td>${esc(it.nombre)}</td><td>${sel('items.'+it.id+'.tipo',it.tipo,[['gasto','Gasto'],['ingreso','Ingreso']])}</td><td><input list="grupos" data-path="items.${it.id}.grupo" data-t="s" value="${esc(it.grupo)}"></td><td>${it.kind==='pct'?'':chk('items.'+it.id+'.cargable',it.cargable)}</td><td>${chk('items.'+it.id+'.conf',it.conf)}</td><td><input data-path="items.${it.id}.nota" data-t="s" value="${esc(it.nota||'')}"></td></tr>`).join('')+`</tbody></table></div>
  <p class="note">"Confidencial" oculta el ítem (y sus cargas) cuando la vista es "Equipo". "Con cargas" suma el ítem a la base sobre la que se calcula el porcentaje de cargas del empleador.</p></div>`}
function vFlujo(){
  const det=S.ui.detalle; let rows=''; const row=(lab,s,cls='',tot=true)=>`<tr class="${cls}"><td>${lab}</td>${s.map(v=>`<td class="r v ${v<-0.5?'neg':''}">${num(v)}</td>`).join('')}<td class="r v"><b>${tot?num(sum(s)):''}</b></td></tr>`;
  rows+=`<tr class="grp"><td colspan="15">INGRESOS</td></tr>`;
  C.spLines.forEach(l=>rows+=row(esc(l.sp.nombre),l.s));
  rows+=row('Pilotos · cuotas del plan',C.pilotGross)+row('Menos: cuotas que no se cobran',C.pilotLoss);
  C.iLines.forEach(l=>{if(l.total!==0) rows+=row(esc(l.it.nombre),l.s)});
  rows+=row('TOTAL INGRESOS',C.ing,'tot');
  rows+=`<tr class="grp"><td colspan="15">GASTOS</td></tr>`;
  if(det){ C.gLines.forEach(l=>{ if(l.total!==0) rows+=row(esc(l.it.nombre),l.s) }); } else { C.groups.filter(g=>g.g!=='Imprevistos').forEach(g=>rows+=row(esc(g.g),g.s)); }
  rows+=row('Imprevistos ('+pc(C.imprevPct)+')',C.imprev)+row('TOTAL GASTOS',C.gastos,'tot');
  rows+=`<tr class="grp"><td colspan="15">CAJA</td></tr>`+row('Flujo neto del mes',C.neto,'tot')+
    `<tr class="tot"><td>Caja a fin de mes</td>${C.saldo.map(v=>`<td class="r v ${v<0?'neg':''}">${v<0?'▼ ':''}${num(v)}</td>`).join('')}<td></td></tr>`;
  const chk2=C.neto.reduce((a,b)=>a+b,0)-(C.Ting-C.Tgas);
  return `<div class="card"><h2>Caja mes a mes</h2>${flowChart(C)}</div>
  <div class="sec"><h2>Flujo de caja 2027 <span class="note" style="text-transform:none;letter-spacing:0">Montos en ${S.ui.cur} · la columna Nov–Dic 26 es la pretemporada</span>
   <span class="right row2"><label class="f">Caja inicial (US$) <input data-path="params.saldoInicial" data-t="n" type="number" step="any" value="${esc(S.params.saldoInicial)}" style="width:110px"></label>
   <button class="btn" data-act="toggleDetalle">${det?'Ver por bloque':'Ver detalle por ítem'}</button></span></h2>
   <div class="tw flowtw"><table><thead><tr><th>Concepto</th>${MONTHS.map(m=>`<th class="r">${m}</th>`).join('')}<th class="r">Año</th></tr></thead><tbody>${rows}</tbody></table></div>
   <p class="note">Control: ${Math.abs(chk2)<1?'<span class="pill good">✔ Los meses suman el resultado del año</span>':'<span class="pill crit">▲ Revisar: los meses no suman el resultado</span>'} · Las cuotas de pilotos entran según la fecha de cada cuota (pestaña Pilotos).</p></div>`;

function resolve(path){ const seg=path.split('.'); let o=S; for(let i=0;i<seg.length-1;i++){ const k=seg[i]; if(Array.isArray(o)){ const porId=o.find(x=>x&&x.id===k); o=porId||(/^\d+$/.test(k)?o[+k]:null) } else o=o[k]; if(o==null) return null } return [o,seg[seg.length-1]] }
document.addEventListener('change',e=>{
  const t=e.target; const path=t.dataset&&t.dataset.path; if(!path) return;
  const r=resolve(path); if(!r) return; const [o,k]=r; let v;
  switch(t.dataset.t){ case 'b':v=t.checked;break; case 'n':v=t.value===''?0:parseFloat(t.value);break; case 'p':v=(t.value===''?0:parseFloat(t.value))/100;break; default:v=t.value }
  const prev=o[k];
  if(Array.isArray(o)&&/^\d+$/.test(k)) o[+k]=v; else o[k]=v;
  if(t.dataset.t==='n'&&isNaN(v)) o[k]=0;
  if(/^params\.(dolar|euro)$/.test(path)&&!(v>0&&v<=1000000)) o[k]=prev;
  if(/\.mpago$/.test(path)) delete o.mpagoAnt;
  if(/^pilotos\.[^.]+\.cuotas\.\d+\.(monto|mpago)$/.test(path)&&!(v>=0&&v<=100000)) o[k]=prev;
  // reglas de coherencia
  if(/\.pagado$/.test(path)&&v){const c=o; if(!c.fpago) c.fpago=santiagoHoy(); if(c.mpago===''||c.mpago==null||(+c.mpago)<(+c.monto||0)){ if(+c.mpago>0) c.mpagoAnt=+c.mpago; c.mpago=c.monto }}
  if(/\.pagado$/.test(path)&&!v){o.fpago='';o.mpago=(+o.mpagoAnt>0)?+o.mpagoAnt:''; delete o.mpagoAnt}
  if(/\.cad$/.test(path)){ if(v==='mensual'){o.desde=o.desde||1;o.hasta=o.hasta||12} }
  if(/\.(desde|hasta)$/.test(path)){ o[k]=+v; }
  if(/\.mes$/.test(path)||/fechas\.[^.]+\.mes$/.test(path)) o[k]=+v;
  if(/\.estado$/.test(path)&&v==='Contrato firmado'&&('contrato' in o)) o.contrato=true;
  if(/\.contrato$/.test(path)&&!v&&o.estado==='Contrato firmado') o.estado='Contrato enviado';
  if(/^ui\.aplazo\./.test(path)) aplazoSync(path);
  save();
  /* en campos de texto el repintado espera un instante: si el foco pasó a un botón o a una fila, su clic ya repinta (si no, el clic se perdería) */
  if(ptrAbajo){ dirtyRender=true; setTimeout(()=>{ if(dirtyRender&&!ptrAbajo) render() },1500); return }
  if(t.tagName==='TEXTAREA'||(t.tagName==='INPUT'&&/^(text|number|date|email|tel|search|url)?$/i.test(t.type||''))) setTimeout(()=>{ const a=document.activeElement;
    if(a&&a!==document.body&&a!==t&&a.closest&&a.closest('#view')&&!/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){ dirtyRender=true; setTimeout(()=>{ if(dirtyRender) render() },500) }
    else render() },0);
  else render();
});

function cargarEstado(o){
  if(!validState(o)) throw 0;
  const viejo=S, habia=!!(viejo&&viejo.srv&&viejo.srv.on), emb=viejo&&viejo.emb, roto=ROTO;
  try{ if(viejo&&viejo.pilotos){ const cp=JSON.parse(JSON.stringify(viejo)); delete cp.emb; localStorage.setItem(KEYB,JSON.stringify(cp)) } }catch(e){}
  try{ S=o; S.srv=SRV0(); if(emb) S.emb=true; migrate(); S.ui.tab='ajustes'; ROTO=''; render() }
  catch(e2){ S=viejo; ROTO=roto; try{ render() }catch(e3){} throw 0 }
  save(); try{ if(EMB) toParent({type:'finReady'}) }catch(e){} return habia }
